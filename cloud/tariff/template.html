<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-net="move">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>河北四网资费全量查询</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   河北四网资费查询页 —— 样式表（2026-10-01 极光版重设计）
   ★★ 一条硬规则（2026-09-24 事故后立的）：
      **凡是要「压在滚动内容之上」的面，一律不透明。**
      半透明的面（哪怕 0.94 + blur）在滚动时都会让表体从下面透出来。
      所以吸顶层用 --card / --card2（实色），--glass 只给装饰面板。
   ══════════════════════════════════════════════════════════════════════ */
:root{
  /* 品牌三色（随当前网切换，见 [data-net=…]） */
  --op1:#0085d0; --op2:#4cc9f0; --op3:#2dd4a7; --op1d:#0067b3;
  /* 背景层 */
  --bg0:#eef4fb; --bg1:#e7f0fa; --bg2:#f7fbff; --bg3:#ffffff;
  /* 面：实色（吸顶/表头用） */
  --card:#ffffff; --card2:#f0f6fc; --card3:#e2ecf7;
  /* 玻璃：只给「不压滚动内容」的装饰面板 */
  --glass:rgba(255,255,255,.60); --glass2:rgba(255,255,255,.80); --glass3:rgba(255,255,255,.94);
  --bd:rgba(255,255,255,.92); --bd2:rgba(8,32,64,.12);
  --tx:#0a1f30; --tx2:#38536d; --tx3:#6a829c;
  --ok:#0b9e6d; --okbg:rgba(11,158,109,.10);
  --warn:#b45309; --warnbg:rgba(214,124,12,.10);
  --bad:#e11d48; --badbg:rgba(225,29,72,.08);
  --ac:var(--op1d); --ac2:rgba(0,133,208,.10);
  --sh:0 8px 24px rgba(10,40,80,.08); --sh2:0 18px 44px rgba(10,40,80,.16);
  --r:16px; --r2:10px; --blur:18px;
  --zebra:rgba(8,40,80,.026); --hover:rgba(0,133,208,.055);
  /* 运营商 logo 底板：官方标志是彩色的，必须放在浅色底上才可辨认（深色主题同样用浅板） */
  --logoplate:#ffffff; --logobd:rgba(10,40,80,.10);
  /* 极光混合模式：浅色用 multiply（颜料叠在亮底上），深色用 screen（光叠加） */
  --blobmix:multiply; --blobop:.36; --glowop:.55; --glowmix:multiply; --ribbonop:.5;
}
[data-net="unicom"]{ --op1:#e2231a; --op2:#ff7a45; --op3:#ffb199; --op1d:#c4160c; --ac2:rgba(226,35,26,.10); }
[data-net="telecom"]{ --op1:#0057b8; --op2:#00a0e9; --op3:#4ad3c8; --op1d:#004494; --ac2:rgba(0,87,184,.10); }
[data-net="cbn"]    { --op1:#c8102e; --op2:#ff4d6d; --op3:#ff9bb0; --op1d:#a50c24; --ac2:rgba(200,16,46,.10); }

[data-theme="dark"]{
  --bg0:#040b16; --bg1:#071120; --bg2:#0a1a2e; --bg3:#0e2338;
  --card:#0c2036; --card2:#122c49; --card3:#183556;
  --glass:rgba(12,28,48,.55); --glass2:rgba(16,36,60,.72); --glass3:rgba(20,44,72,.92);
  --bd:rgba(255,255,255,.12); --bd2:rgba(255,255,255,.16);
  --tx:#eef6ff; --tx2:#c8dcee; --tx3:#94abc4;
  --ok:#2fd598; --okbg:rgba(47,213,152,.13);
  --warn:#fbbf24; --warnbg:rgba(251,191,36,.12);
  --bad:#fb7185; --badbg:rgba(251,113,133,.12);
  --ac:var(--op2); --ac2:rgba(76,201,240,.14);
  --sh:0 10px 28px rgba(0,0,0,.40); --sh2:0 22px 52px rgba(0,0,0,.50);
  --zebra:rgba(255,255,255,.028); --hover:rgba(255,255,255,.06);
  --logoplate:#f2f5fa; --logobd:rgba(255,255,255,.20);
  --blobmix:screen; --blobop:.5; --glowop:.72; --glowmix:screen; --ribbonop:.4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{color-scheme:light dark}
body{min-height:100vh;background:var(--bg1);color:var(--tx);
  font:400 14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  overflow-x:hidden;transition:background .4s,color .4s}

/* ── 极光背景 ─────────────────────────────────────────────────────
   三层：① 基础天色渐变（::before）② 三条流动的极光带（.band，慢速漂移）
   ③ 网点三色环境光晕（::after，color-mix 揉当前网主题色）+ 圆形光斑（.blob）
   + 噪点（.grain）。prefers-reduced-motion 时全部静止。 */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora::before{content:'';position:absolute;inset:0;
  background:radial-gradient(1100px 720px at 14% -12%,var(--bg2),transparent 62%),
             radial-gradient(960px 660px at 96% 4%,var(--bg3),transparent 60%),
             linear-gradient(180deg,var(--bg1),var(--bg0) 55%,var(--bg1));
  transition:background .5s}
.band{position:absolute;left:-30vw;width:160vw;height:36vh;border-radius:50%;
  filter:blur(72px);opacity:var(--ribbonop);mix-blend-mode:var(--blobmix);will-change:transform}
.bd1{top:-24vh;background:linear-gradient(100deg,transparent 18%,var(--op2) 46%,var(--op1) 62%,transparent 84%);
  animation:drift1 24s ease-in-out infinite alternate}
.bd2{top:0vh;background:linear-gradient(80deg,transparent 22%,var(--op3) 48%,var(--op2) 66%,transparent 86%);
  animation:drift2 31s ease-in-out infinite alternate}
.bd3{top:22vh;opacity:calc(var(--ribbonop)*.7);
  background:linear-gradient(95deg,transparent 26%,var(--op1) 52%,var(--op3) 68%,transparent 88%);
  animation:drift3 27s ease-in-out infinite alternate}
@keyframes drift1{from{transform:rotate(-9deg) translate3d(-3vw,-1vh,0) scaleY(1)}
  to{transform:rotate(-6deg) translate3d(4vw,3vh,0) scaleY(1.18)}}
@keyframes drift2{from{transform:rotate(7deg) translate3d(3vw,2vh,0) scaleY(1.1)}
  to{transform:rotate(4deg) translate3d(-4vw,-2vh,0) scaleY(.94)}}
@keyframes drift3{from{transform:rotate(-5deg) translate3d(-2vw,2vh,0)}
  to{transform:rotate(-2deg) translate3d(3vw,-3vh,0) scaleY(1.15)}}
.blob{position:absolute;border-radius:50%;filter:blur(84px);opacity:var(--blobop);
  mix-blend-mode:var(--blobmix);transition:background .5s}
.b1{width:520px;height:520px;background:var(--op1);top:-170px;left:-130px;animation:fl1 22s ease-in-out infinite}
.b2{width:430px;height:430px;background:var(--op2);top:20%;right:-150px;animation:fl2 27s ease-in-out infinite}
.b3{width:470px;height:470px;background:var(--op3);bottom:-190px;left:12%;animation:fl3 31s ease-in-out infinite}
@keyframes fl1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(64px,54px) scale(1.12)}}
@keyframes fl2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-70px,44px) scale(.93)}}
@keyframes fl3{0%,100%{transform:translate(0,0) scale(.97)}50%{transform:translate(56px,-62px) scale(1.1)}}
@media(prefers-reduced-motion:reduce){.blob,.band{animation:none}*{transition:none!important}}
/* 网点环境光晕：把当前网的主题色揉成低饱和色温铺满全页（color-mix 不支持时整条作废，只是少层色温） */
.aurora::after{content:'';position:absolute;inset:0;opacity:var(--glowop);
  mix-blend-mode:var(--glowmix);pointer-events:none;
  background:radial-gradient(50% 44% at 6% -2%,color-mix(in srgb,var(--op2) 74%,transparent),transparent 70%),
             radial-gradient(48% 46% at 98% 2%,color-mix(in srgb,var(--op3) 68%,transparent),transparent 72%),
             radial-gradient(56% 50% at 70% 104%,color-mix(in srgb,var(--op1) 52%,transparent),transparent 74%),
             radial-gradient(40% 40% at 46% 46%,color-mix(in srgb,var(--op2) 34%,transparent),transparent 76%)}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.028;
  background-image:radial-gradient(currentColor 1px,transparent 1px);background-size:3px 3px}

.wrap{position:relative;z-index:2;max-width:1380px;margin:0 auto;padding:12px 16px 48px}
.glass{background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
  border:1px solid var(--bd);box-shadow:var(--sh);border-radius:var(--r)}

/* ══ 业务横栏（简约单行）：品牌 · 四网分段 · 统计 · 主题 ══ */
.topbar{position:relative;z-index:40;margin-bottom:10px;
  background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
  border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.tb-in{display:flex;align-items:center;gap:14px;padding:9px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
#logo{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--op1),var(--op2) 68%,var(--op3));color:#fff;
  font-weight:800;font-size:16px;box-shadow:0 6px 16px rgba(0,0,0,.20);transition:background .4s}
/* 有官方标志时：换成「浅色底板 + 标志」——彩色的运营商标志压在品牌渐变上会糊成一团。
   底板在深浅两个主题下都是浅色（标志本身的配色是固定的，不能跟着主题反转）。 */
#logo.mk{background:var(--logoplate);border:1px solid var(--logobd);
  box-shadow:0 4px 12px rgba(10,40,80,.14)}
#logo.mk svg,#logo.mk img{width:26px;height:26px;display:block}
#logo.mk img{object-fit:contain}
.brand-t{min-width:0}
#h1{font-size:15px;font-weight:750;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:50vw}
#sub{font-size:11px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:54vw}
/* 四网分段控件：居中，选中项为品牌渐变胶囊 */
.netnav{flex:1 1 auto;display:flex;justify-content:center;min-width:0}
.netnav-in{display:flex;gap:3px;padding:3.5px;border-radius:13px;
  background:var(--glass2);border:1px solid var(--bd2);max-width:100%;overflow-x:auto;scrollbar-width:none}
.netnav-in::-webkit-scrollbar{display:none}
.netbtn{display:inline-flex;align-items:center;gap:6px;padding:6.5px 13px;border:0;border-radius:10px;
  background:transparent;cursor:pointer;font-size:13px;color:var(--tx2);
  font-family:inherit;transition:.16s;white-space:nowrap}
.netbtn:hover{color:var(--ac);background:var(--hover)}
.netbtn.on{background:linear-gradient(135deg,var(--op1),var(--op2));color:#fff;font-weight:650;
  box-shadow:0 4px 12px rgba(0,0,0,.18)}
.netbtn .nc{font-size:10.5px;opacity:.85;font-variant-numeric:tabular-nums}
.netbtn .nb{font-size:10px;padding:1px 7px;border-radius:999px;background:var(--warnbg);color:var(--warn);font-weight:600}
.netbtn.on .nb{background:rgba(255,255,255,.22);color:#fff}
/* 右侧：更新指示 + 三组计数 + 主题切换 */
.tb-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}
.tb-cnt{font-size:11px;color:var(--tx3);white-space:nowrap;padding:4px 10px;border-radius:999px;
  background:var(--glass2);border:1px solid var(--bd2)}
.tb-cnt b{color:var(--tx);font-weight:800;font-size:12px;font-variant-numeric:tabular-nums}
.upd{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
#themeBtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd2);background:var(--glass2);
  cursor:pointer;display:grid;place-items:center;color:var(--tx2);transition:transform .25s,border-color .2s,color .2s}
#themeBtn:hover{border-color:var(--ac);color:var(--ac);transform:rotate(20deg)}
#themeBtn .ic{width:17px;height:17px;display:none}
[data-theme="light"] #themeBtn .ic-moon{display:block}
[data-theme="dark"] #themeBtn .ic-sun{display:block}
.noticebar{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:0 14px 10px}
.notice{padding:7px 12px;border-radius:10px;background:var(--ac2);color:var(--ac);
  font-size:12.5px;font-weight:500;display:inline-block}
.notice.warn{background:var(--badbg);color:var(--bad)}
.notice a{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* ══ #deck：筛选卡片容器（不吸顶）══════════════════════════════
   🔴 2026-09-25 事故修复的架构不能回退：只有 #vtab 吸顶（≈46px），
   #bar 随列表滚走；#deck / #bar 绝不声明 position:sticky。 */
.deck{margin:10px 0 12px;background:var(--card);border-radius:var(--r);
  box-shadow:0 0 0 1px var(--bd2),0 12px 26px rgba(0,40,80,.10)}

/* 视图页签（总览 / 明细 / 历史 / 说明）—— 唯一吸顶元素。
   🔴 背景必须实色（--card）：吸顶后脱离 #deck 卡片，没有实色表体会透上来叠字。 */
#vtab{position:sticky;top:0;z-index:39;background:var(--card);
  display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--bd2);
  overflow-x:auto;scrollbar-width:none;box-shadow:0 10px 22px rgba(0,40,80,.12)}
#vtab::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;pointer-events:none;
  background:linear-gradient(90deg,var(--op1),var(--op2),transparent 92%)}
#vtab::-webkit-scrollbar{display:none}
#vtab .tab{position:relative;border:0;background:transparent;padding:12px 18px 11px;
  font-size:13.5px;font-weight:600;color:var(--tx2);cursor:pointer;font-family:inherit;
  transition:.16s;white-space:nowrap}
#vtab .tab:hover{color:var(--ac)}
#vtab .tab.on{color:var(--ac);font-weight:750}
#vtab .tab.on::after{content:'';position:absolute;left:15px;right:15px;bottom:-1px;height:2.5px;
  border-radius:3px;background:linear-gradient(90deg,var(--op1),var(--op2))}
.view{display:none}
.view.on{display:block}

/* ── 工具条 #bar：只属于「资费明细」页 ─────────────────────────── */
.bar{display:none;padding:12px 12px 11px}
body[data-view="list"] .bar{display:block}
.brow1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
/* 状态页签：胶囊分段 */
#tabs{display:inline-flex;gap:2px;padding:3.5px;border:1px solid var(--bd2);border-radius:12px;background:var(--glass2);flex:none}
#tabs button{border:0;background:transparent;padding:6.5px 13px;border-radius:9px;
  font-size:12.5px;cursor:pointer;color:var(--tx2);font-weight:600;font-family:inherit;transition:.15s;white-space:nowrap}
#tabs button:hover{color:var(--ac)}
#tabs button.on{background:linear-gradient(135deg,var(--op1),var(--op2));color:#fff;
  box-shadow:0 3px 9px rgba(0,0,0,.16)}
#tabs button:disabled{color:var(--tx3);opacity:.5;cursor:not-allowed}
#tabs button:disabled.on{background:var(--tx3);color:#fff}
/* 搜索框：带图标 */
.kwwrap{position:relative;flex:1 1 280px;min-width:160px;display:flex;align-items:center}
.kwwrap>svg{position:absolute;left:11px;width:15px;height:15px;color:var(--tx3);pointer-events:none}
#kw{width:100%;padding:8.5px 12px 8.5px 33px;border:1px solid var(--bd2);border-radius:11px;
  font-size:13.5px;background:var(--glass3);color:var(--tx);font-family:inherit;color-scheme:light dark;transition:.15s}
#kw::placeholder{color:var(--tx3)}
#kw:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
/* 工具按钮 */
#reset,#csv,#offline,#ftog{padding:8.5px 13px;border:1px solid var(--bd2);background:var(--glass3);
  border-radius:10px;cursor:pointer;font-size:12.5px;color:var(--tx2);transition:.16s;white-space:nowrap;font-family:inherit}
#reset:hover,#csv:hover,#offline:hover,#ftog:hover{border-color:var(--ac);color:var(--ac)}
/* 筛选折叠开关的「生效条件数」徽标；折叠态下开关保持高亮提示「里面还挂着条件」 */
#fbadge{font-style:normal;margin-left:5px;padding:0 7px;border-radius:999px;
  background:linear-gradient(135deg,var(--op1),var(--op2));color:#fff;font-size:11px;font-weight:700}
.deck.folded .ffilt,.deck.folded .chips{display:none}
.deck.folded #ftog{border-color:var(--ac);color:var(--ac)}
input,select{padding:7px 10px;border:1px solid var(--bd2);border-radius:9px;font-size:13px;
  background:var(--glass3);color:var(--tx);font-family:inherit;color-scheme:light dark}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
option,select optgroup{background:var(--card2);color:var(--tx)}
button{font-family:inherit}

/* ── 筛选区：按语义分区（范围 / 分类 / 资费 / 办理 / 时效）──────────
   每段是一个浅玻璃小面板，左侧竖排组标签（细字重 + 右侧渐变细线），
   控件统一 34px 高、底对齐。窄屏时段内自动折行、组标签独占一行。 */
.ffilt{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:8px;margin-top:11px}
.fsec{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;align-content:flex-start;min-width:0;
  padding:8px 11px 9px;border:1px solid var(--bd2);border-radius:12px;background:var(--glass2)}
.fsec>.glab{position:relative;flex:0 0 auto;align-self:center;font-size:10.5px;font-weight:800;
  letter-spacing:.15em;color:var(--tx3);white-space:nowrap;padding:0 10px 0 1px;margin-right:4px;
  line-height:1.5}
/* 组标签右侧那条渐变细分隔线 */
.fsec>.glab::after{content:'';position:absolute;right:0;top:12%;bottom:12%;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--op1),var(--op2))}

/* ── 两级主轴：资费归属（个人/政企）× 资费范围（全网/河北）──────────────
   官方页面把这两级做成页签 —— 它们回答的是「先看哪一半」，不是「再筛什么」，
   塞进筛选网格里只会跟地域 / 类型混成一团（用户报的就是这个）。
   ★ 底层仍是那两个 <select>（#ow / #sb）：深链（#ow=政企）、CSV 表头、
     判据、探针全都按 id 取值，改 id / 去掉控件等于把整条链静默打断。
     所以按钮只是它的**镜像**，点了回写 select —— 单一数据源不变。
   ★ 一级是一行（移动有归属这级，联通/电信/广电没有，那一行整个不出现）。 */
.axisbar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:7px 16px;align-items:center;
  padding:8px 11px;border:1px solid var(--bd2);border-radius:12px;background:var(--glass2);
  position:relative}
.axis{display:flex;align-items:center;gap:9px;min-width:0;position:relative}
.axis>.axlab{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.15em;color:var(--tx3);
  white-space:nowrap}
.axseg{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--bd2);border-radius:11px;
  background:var(--card);min-width:0}
.axseg button{border:0;background:transparent;padding:5.5px 13px;border-radius:8px;font-family:inherit;
  font-size:12.5px;font-weight:650;color:var(--tx2);cursor:pointer;white-space:nowrap;
  transition:background .18s,color .18s}
.axseg button:hover{color:var(--ac)}
.axseg button.on{background:linear-gradient(135deg,var(--op1),var(--op2));color:#fff;
  box-shadow:0 3px 9px rgba(0,0,0,.16)}
.axseg button:disabled{color:var(--tx3);opacity:.45;cursor:not-allowed}
.axseg button:disabled.on{background:var(--tx3);color:#fff}
.axseg button i{font-style:normal;margin-left:5px;font-size:10.5px;font-weight:700;opacity:.6}
.axseg button.on i{opacity:.85}
/* 底层 select：**不用 display:none 藏** —— 那样 dimVisible() / walk 探针会认为
   「这一维在本网不存在」，于是按钮选中的条件会被判成「无效筛选 = 不筛」，
   出现「按钮亮着、结果却是全量」的静默错。用视觉隐藏保住布局与可判定性。 */
.axsel{position:absolute;width:1px;height:1px;margin:0;padding:0;border:0;opacity:0;
  pointer-events:none;clip:rect(0 0 0 0);clip-path:inset(50%);overflow:hidden;white-space:nowrap}

.f{flex:0 1 128px;min-width:112px;display:flex;flex-direction:column;gap:4px}
.f.w2{flex:0 1 250px;min-width:190px}
.f>.fl{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--tx3);padding-left:3px}
.f select,.f input,.f button{width:100%;max-width:none}
.f select{text-overflow:ellipsis}

/* 快捷 chip */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:11px;align-items:center}
.chips button{padding:5px 12px;border:1px solid var(--bd2);background:var(--glass3);border-radius:999px;
  font-size:12.5px;cursor:pointer;color:var(--tx2);transition:.14s;font-family:inherit}
.chips button:hover{border-color:var(--ac);color:var(--ac)}
.chips button.on{background:linear-gradient(135deg,var(--op1),var(--op2));border-color:transparent;color:#fff}
.fchips{display:inline-flex;flex-wrap:wrap;gap:5px;vertical-align:middle}
.fchip{padding:1px 9px;border:1px solid var(--bd2);background:var(--ac2);color:var(--ac);
  border-radius:999px;font-size:12px;cursor:pointer;line-height:1.7;font-family:inherit}
.fchip:hover{border-color:var(--ac)}
.fchip i{font-style:normal;font-weight:700;margin-left:4px}
/* 空结果诊断的建议按钮（样式与快捷 chip 同族，可点摘条件） */
.diag{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:10px}
.diag>span{color:var(--tx3);font-size:12.5px}
.diagb{padding:5px 12px;border:1px solid var(--bd2);background:var(--glass3);border-radius:999px;
  font-size:12.5px;cursor:pointer;color:var(--tx2);transition:.14s;font-family:inherit}
.diagb:hover{border-color:var(--ac);color:var(--ac)}

/* ── 收藏关注（并入主样式表，2026-10-01 重设计版）────────────────── */
.favbtn{background:none;border:0;cursor:pointer;font-size:14px;line-height:1;
  padding:0 4px 0 0;color:var(--tx3);vertical-align:baseline;font-family:inherit}
.favbtn:hover,.favbtn.on{color:var(--warn)}
.favchip{font:inherit;cursor:pointer;border:1px solid var(--bd2);background:var(--glass3);
  color:var(--tx2);border-radius:999px;padding:5px 12px;font-size:12.5px}
.favchip:hover{border-color:var(--ac);color:var(--ac)}
.favchip.on{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
.favnote{margin:8px 0 0;font-size:12px;color:var(--warn);background:var(--warnbg);
  border-radius:var(--r2);padding:4px 10px}

/* ── 结果栏：匹配计数 + 可摘筛选标签 + 排序控件 ─────────────────── */
.rbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 2px}
#stat{flex:1 1 auto;min-width:0;color:var(--tx2);font-size:12.5px}
#stat b{color:var(--tx)}
#stat .sortinfo{color:var(--ac);font-weight:600}
/* 排序控件：「排序」标签 + 字段下拉 + 方向钮，拼成一个整体 */
.sortctl{display:inline-flex;align-items:stretch;gap:0;flex:none}
.sc-lab{align-self:center;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--tx3);margin-right:7px;white-space:nowrap}
.sortctl select{border-radius:10px 0 0 10px;border-right:0;font-weight:600;padding:7px 8px}
#dir{width:36px;border:1px solid var(--bd2);border-radius:0 10px 10px 0;background:var(--glass3);
  cursor:pointer;color:var(--ac);font-weight:800;font-size:14px}
#dir:hover{background:var(--ac2)}

/* ── 表格 ───────────────────────────────────────────────────────── */
/* 🔴 必须 overflow:clip，**不能** overflow:hidden：
   hidden 会让表格成为滚动容器，th 的 position:sticky 彻底失效。 */
/* .tblwrap 默认 overflow:visible —— visible 不产生滚动容器，桌面上 th 的
   sticky（相对页面滚动）照常工作。窄屏媒体查询里才切成 overflow-x:auto：
   那时 wrapper 成为滚动容器，表头随内容滚走（窄屏上表格本就一屏装不下，
   「能看全」优先于「表头钉住」），右侧被 clip 裁掉的列就能滚出来了。 */
.tblwrap{overflow:visible}
table{width:100%;border-collapse:separate;border-spacing:0;
  background:var(--glass);border:1px solid var(--bd2);border-radius:var(--r);overflow:clip;
  font-size:13px;box-shadow:var(--sh)}
/* 🔴 th 背景必须**实色**：它压在滚动的行上面，半透明会透出下面的字。 */
th{position:sticky;top:var(--stackh,276px);z-index:5;background:var(--card2);
  text-align:left;padding:11px 10px;font-weight:700;font-size:12.5px;color:var(--tx2);
  border-bottom:1px solid var(--bd2);white-space:nowrap;user-select:none}
th[data-k]{cursor:pointer}
th[data-k]:hover{color:var(--ac)}
th .ar{opacity:.3;margin-left:3px;font-size:10px}
th.act{color:var(--ac)}
th.act .ar{opacity:1}
td{padding:10px;border-bottom:1px solid var(--bd2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
/* 斑马纹走 JS 打的 .zeb 类而不是 nth-child：行与详情行成对插入 tbody，
   「只看收藏」显隐后 nth-child 仍把隐藏行数进去，可见行的条纹会忽有忽无；
   zebrafy() 只数**可见**行，任何显隐路径下条纹都连续。 */
tbody tr.row.zeb td{background:var(--zebra)}
tr.row:hover td{background:var(--hover);cursor:pointer}
/* 键盘可达：Tab 聚焦行、Enter/Space 展开（render() 里绑定） */
tr.row:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
/* 展开指示：行首小箭头，展开时转向 —— 不占新列，hover/聚焦之外也看得出可点 */
td.fee::before{content:"▸";display:inline-block;width:11px;font-size:10px;
  opacity:.3;transition:transform .15s,opacity .15s}
tr.row.open td.fee::before{transform:rotate(90deg);opacity:.9;color:var(--ac)}
/* 新上架行的左缘绿条：NEW 徽标只在日期格里，扫全表时行级标记更快 */
tr.row.isnew td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.nm{font-weight:600}
/* 搜索命中高亮：淡主色底、不抢字色（深浅主题都走 --ac2 半透明，字色继承） */
mark{background:var(--ac2);color:inherit;padding:0 1px;border-radius:2px}
.tg{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--ac2);color:var(--ac);
  font-size:11.5px;font-weight:650;white-space:nowrap}
.fee{font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums}
.fee.free{color:var(--ok)}
.fee.low{color:var(--warn)}
.ap{color:var(--tx2);font-size:12px;max-width:320px}
.mut{color:var(--tx3);font-size:11.5px}
.bwtg{display:inline-block;padding:0 6px;border-radius:5px;background:var(--okbg);color:var(--ok);
  font-size:11.5px;font-weight:700}
.bwv{font-size:12px;white-space:nowrap}
.soon{color:var(--warn);font-size:11.5px;font-weight:600}
.exp{color:var(--bad);font-size:11.5px;font-weight:600}
.bg{display:inline-block;padding:0 6px;border-radius:5px;font-size:11px;font-weight:700;line-height:17px;white-space:nowrap}
.bg-new{background:var(--okbg);color:var(--ok)}
.bg-wait{background:var(--warnbg);color:var(--warn)}
.bg-add{background:var(--okbg);color:var(--ok);border:1px solid currentColor}
.bg-chg{background:var(--badbg);color:var(--bad);border:1px solid currentColor}
.bg-sc{background:var(--ac2);color:var(--ac);border:1px solid transparent}
.bg-sc-cn{background:var(--warnbg);color:var(--warn)}
.bg-stop{background:var(--badbg);color:var(--bad)}
/* —— 有效期徽标（名称列 + 详情高亮行） ——
   soon 红 / mid 琥珀 / far 灰三档，rn（自动续）虚线小标。
   灰档刻意用 --card3 + --tx3：远期与长约要有但必须「退后」，红琥珀才是重点。 */
.vptg{display:inline-block;padding:0 7px;border-radius:5px;font-size:11px;font-weight:700;
  line-height:17px;white-space:nowrap;margin-left:5px}
.vptg-soon{background:var(--badbg);color:var(--bad);border:1px solid currentColor}
.vptg-mid{background:var(--warnbg);color:var(--warn)}
.vptg-far{background:var(--card3);color:var(--tx3);font-weight:500}
.vptg-rn{background:none;color:var(--tx3);border:1px dashed var(--bd2);font-weight:500}
.ditem.vp-hi{background:var(--warnbg);border-radius:8px;padding:4px 8px;margin:2px -4px}
.ditem.vp-hi em{font-style:normal}
.ditem.vp-hi .vpraw{color:var(--tx)}
/* 归属徽标：类名用 bg-ow / bg-ow-g，不拼中文标识符（压缩/正则处理时是常见坑） */
.bg-ow{background:var(--ac2);color:var(--ac)}
.bg-ow-g{background:var(--warnbg);color:var(--warn)}
.nm .bg{margin-left:5px}
tr.row.stopped .nm,tr.row.stopped .fee{color:var(--tx3)}
.det{display:none}
.det.on{display:table-row}
.det>td{padding:0;background:var(--glass2)}
.det .detwrap{padding:13px 16px;border-bottom:1px solid var(--bd2)}
/* 详情：定义列表网格（标签在左、内容在右，两列自适应） */
.detgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:7px 26px;font-size:12.5px;line-height:1.75}
.detgrid .ditem{display:flex;gap:9px;min-width:0}
.detgrid .ditem>span{flex:none;width:64px;color:var(--tx3);font-weight:600;font-size:11.5px;padding-top:1px}
.detgrid .ditem>em{font-style:normal;color:var(--tx);word-break:break-all;min-width:0}
.ailine{margin-top:11px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;line-height:1.85}
.ailine b{color:var(--tx2);font-weight:600}
.aichip{padding:2px 10px;border-radius:999px;background:var(--okbg);color:var(--ok);
  font-size:12px;font-weight:600}
.detact{margin-top:11px}
.cpbtn{padding:5px 12px;border:1px solid var(--bd2);background:var(--glass3);border-radius:9px;
  font-size:12px;cursor:pointer;color:var(--tx2);font-family:inherit}
.cpbtn:hover{border-color:var(--ac);color:var(--ac)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:20px 0}
.pager button{padding:7px 15px;border:1px solid var(--bd2);background:var(--glass2);border-radius:10px;
  cursor:pointer;font-size:13px;color:var(--tx)}
.pager button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
.pager button:disabled{opacity:.4;cursor:default}
#pg{color:var(--tx2);font-size:13px;font-variant-numeric:tabular-nums}
.pjump{display:inline-flex;align-items:center;gap:5px;color:var(--tx2);font-size:12.5px}
#pgin{width:56px;padding:6px 7px;border:1px solid var(--bd2);background:var(--glass3);
  border-radius:9px;font-size:12.5px;color:var(--tx);text-align:center;font-family:inherit;
  -moz-appearance:textfield}
#pgin::-webkit-outer-spin-button,#pgin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#psz{padding:7px 8px;font-size:12.5px;font-weight:600}
.empty{padding:48px;text-align:center;color:var(--tx2)}
.empty a{color:var(--ac)}
.netempty{max-width:760px;margin:40px auto;padding:26px 30px}
.netempty h2{margin:0 0 12px;font-size:17px}
.netempty p{margin:9px 0;color:var(--tx2);font-size:13.5px;line-height:1.9}
.netempty p b{color:var(--tx)}

/* ── 总览 ───────────────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.stat{padding:16px 18px;border-radius:var(--r);background:var(--glass);border:1px solid var(--bd2);
  box-shadow:var(--sh);position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--op1),var(--op2))}
.stat .si{font-size:16px;margin-bottom:6px;opacity:.85}
.stat .sn{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1.15;
  background:linear-gradient(135deg,var(--op1),var(--op2));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.stat .sl{font-size:11.5px;color:var(--tx3);margin-top:4px;font-weight:600}
.stat.k{border-left:3px solid var(--op1)}
.panel{padding:17px 19px;margin-bottom:12px;border-radius:var(--r);background:var(--glass);
  border:1px solid var(--bd);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  box-shadow:var(--sh)}
.ph{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:14px}
.pt{margin:0;font-size:14.5px;font-weight:700}
.ps{font-size:11.5px;color:var(--tx3)}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:minmax(112px,152px) 1fr 62px;gap:10px;align-items:center;font-size:12.5px}
.blab{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.btrack{height:19px;background:var(--zebra);border-radius:6px;overflow:hidden;position:relative}
.bfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--op1),var(--op2));
  transition:width .5s cubic-bezier(.4,0,.2,1);min-width:2px}
.bval{text-align:right;font-variant-numeric:tabular-nums;color:var(--tx2);font-weight:700}
.btrack .bpct{position:absolute;right:7px;top:0;line-height:19px;font-size:10.5px;
  color:var(--tx3);font-weight:700}

/* ── 变化历史（时间线）────────────────────────────────────────── */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:5px;top:5px;bottom:5px;width:2px;
  background:linear-gradient(180deg,var(--op1),var(--op2),transparent);border-radius:2px;opacity:.5}
.tnode{position:relative;padding:11px 0 11px 3px}
.tnode::before{content:'';position:absolute;left:-20px;top:17px;width:10px;height:10px;
  border-radius:50%;background:var(--op1);box-shadow:0 0 0 3px var(--bg1);transition:background .4s}
.tnode.zero::before{background:var(--tx3);opacity:.45}
.thd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;cursor:pointer}
.thd .ts{font-weight:700;color:var(--tx)}
.thd .tm{color:var(--tx3);font-variant-numeric:tabular-nums}
.tbd{display:none;margin-top:9px}
.tnode.open .tbd{display:block}
.tnet{margin:7px 0;padding:10px 13px;border-radius:10px;background:var(--glass2);border:1px solid var(--bd2)}
.tnet .nh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;font-weight:700}
.tnet .nn{color:var(--tx2);font-weight:400}
.tcaps{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tcap{padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--glass3);border:1px solid var(--bd2);color:var(--tx2)}
.tcap.a{background:var(--okbg);color:var(--ok);border-color:transparent}
.tcap.r{background:var(--badbg);color:var(--bad);border-color:transparent}
.tcap.c{background:var(--warnbg);color:var(--warn);border-color:transparent}
.tcap.w{background:var(--glass3);color:var(--bad);border:1px dashed var(--bad)}
/* ── 字段变更对照卡：左=旧值，右=新值，中间一条分隔线 ─────────────
   一条资费改了哪些字段、从什么改成什么，一眼对照 —— 不再是一串
   「改了 月费/流量」的裸字段名（那样用户还得自己翻 changes/*.md）。 */
.dc{margin-top:8px;border:1px solid var(--bd2);border-radius:10px;overflow:hidden;
  background:var(--glass3)}
.dch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:7px 11px;
  font-size:12.5px;font-weight:700;border-bottom:1px solid var(--bd2);
  background:var(--glass2)}
.dch .nn{font-weight:400;color:var(--tx3)}
.drow{display:grid;grid-template-columns:minmax(58px,88px) 1fr 1fr;font-size:12px}
.drow+.drow{border-top:1px solid var(--bd2)}
.dlab{padding:7px 4px 7px 11px;color:var(--tx2);font-weight:600;
  display:flex;align-items:flex-start}
.dold{padding:7px 11px;color:var(--tx3);word-break:break-word;
  border-right:1px dashed var(--bd2);
  background:linear-gradient(90deg,rgba(226,68,68,.05),rgba(226,68,68,0))}
.dnew{padding:7px 11px;color:var(--tx);word-break:break-word;
  background:linear-gradient(90deg,rgba(30,166,92,0),rgba(30,166,92,.055))}
.dtg{display:inline-block;padding:0 5px;border-radius:5px;font-size:10.5px;
  font-weight:700;line-height:16px;margin-right:5px;vertical-align:1px;flex:none}
.dtg.o{background:var(--badbg);color:var(--bad)}
.dtg.n{background:var(--okbg);color:var(--ok)}
/* 整行对照（.full）：未变字段不配色不挂徽标 —— 信息在场，但视觉上让位给变更行 */
.dold.plain,.dnew.plain{color:var(--tx3);background:none}
.drow.chg .dlab{color:var(--tx)}
.dstat{margin-left:auto;font-weight:400;font-size:11px;color:var(--tx3)}
.dc.full .drow{font-size:11.5px}
.dc.full .dlab,.dc.full .dold,.dc.full .dnew{padding-top:5px;padding-bottom:5px}
/* 对照卡折叠：单轮最多见过 116 条字段变更，全铺开会把当天节点拉出好几屏 ——
   每轮先铺 DIFF_SHOW 张，其余收进 .dmore，点按钮展开/收起。 */
.dmorebtn{margin:8px 0 0 11px;padding:4px 12px;border:1px solid var(--bd2);
  background:var(--glass2);border-radius:999px;font-size:12px;cursor:pointer;
  color:var(--tx2);font-family:inherit}
.dmorebtn:hover{border-color:var(--ac);color:var(--ac)}
.tgl{padding:5px 12px;border:1px solid var(--bd2);background:var(--glass3);border-radius:999px;
  font-size:12px;cursor:pointer;color:var(--tx2);font-family:inherit}
.tgl:hover{border-color:var(--ac);color:var(--ac)}

#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,12px);z-index:99;
  background:#111c2b;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  box-shadow:var(--sh2);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){
  .netnav{order:3;flex:1 1 100%;justify-content:flex-start}
  #h1{max-width:70vw}#sub{max-width:76vw}
}
@media(max-width:760px){
  .wrap{padding:8px 10px 32px}
  .ap{max-width:150px}
  #kw{min-width:110px}
  .ffilt{grid-template-columns:1fr;gap:7px}
  .fsec{gap:7px 6px;padding:7px 9px 8px}
  .f{flex:0 1 104px;min-width:94px}
  .f.w2{flex:0 1 200px;min-width:160px}
  /* 窄屏组标签独占一行（否则被挤到控件右侧、读不出是哪一组的开头） */
  .fsec>.glab{flex:1 0 100%;padding:1px 0 4px;margin-right:0}
  .fsec>.glab::after{display:none}
  /* 两级主轴：窄屏每级独占一行，按钮允许折行 */
  .axisbar{gap:7px;padding:8px 9px}
  .axis{flex:1 0 100%;gap:8px}
  .axseg{flex-wrap:wrap;flex:1 1 auto}
  .brow{grid-template-columns:minmax(78px,104px) 1fr 52px;font-size:12px}
  .stat .sn{font-size:22px}
  th,td{padding:8px 7px}
  /* 🔴 窄屏下 10 列的自然宽度远超屏宽，table 的 overflow:clip 会把右侧列
     （目标客户/上架/下线）**直接剪掉**且无任何办法看到 —— 切成横向滚动。

  .drow{grid-template-columns:1fr 1fr}

<script>
/* —— 四网数据容器 ——
   骨架阶段：只有「移动」接了真实数据，其余三家的 rows 为空、src/base 待补。
   刻意做成**对称结构**（每网都含 sh/nm/src/base/rows），而不是「移动特殊、
   三家另放一个数组」—— 后者每加一处逻辑都要分叉一次，迟早漏掉一边。
   ★ 每网自带 base：「相对天数 / 上架下线筛选」都以**本网**的数据基线为准，
     不能全局共用一个 —— 三家的抓取时点不可能总在同一天。 */
const NETS=__NETS__;
/* 大类顺序由构建脚本注入（见 tariff_monitor.CAT_ORDER）。
   在页面里另写一份常量会与 Python 那份漂移，而漂移只表现为「下拉顺序和构建日志对不上」，
   不报错 —— 这种没人会去查的不一致最难防，所以干脆只留一份权威。 */
const CAT_ORDER=__CAT_ORDER__;
/* 归属档位顺序。同 CAT_ORDER 的理由：顺序只留一份权威，页面不另写常量。 */
const OW_ORDER=__OW_ORDER__;
/* 变更历史 —— 页面时间线的**唯一**数据源，由构建脚本从 history.json 注入。
   空数组是正常状态（首次部署时还没有任何一次带变更的巡检），不是错误。 */
const HIST=__HIST__;
/* 所有「枚举型筛选维度」的控件 id —— 全页只此一份。
   清空筛选 / 切网复位 / 深链读写本来都要遍历同一批控件，而原先是**每处各写一遍字面量**
   （5 处），加一个维度就得记得改 5 个地方。漏一处的后果是「切网后这个维度没被清掉」：
   上个网选中的条件继续生效，页面却毫无提示 —— 与「幽灵筛选值」是同一类静默错。 */
const DIMS=["sb","sc","ow","cat","ty","pf","gf","cf","bw","chx","on","off","chg"];
function clearDims(){DIMS.forEach(k=>{const e=document.getElementById(k);if(e)e.value=""})}
const NET_LS=["move","unicom","telecom","cbn"];      // 顺序即导航条顺序
const rowsOf=n=>((NETS[n]||{}).rows)||[];
const online=n=>rowsOf(n).length>0;                  // 是否已接入数据
/* 默认网：取第一个**已接入**的（而不是硬编码 move）—— 万一哪天移动那网抓挂了，
   页面会自动落到别的有数据的网，而不是一进来就是一片空白。 */
const NET_DEF=(NET_LS.filter(online)[0])||NET_LS[0];
let NET=NET_DEF;
const net=()=>NETS[NET]||{};

/* 每页条数可调（80/200/400）：全量 5000+ 行一次铺完会卡顿几秒，
   「全部」档不提供 —— 真想一次看完用 CSV 导出（口径与列表一致）。
   let 而非 const：#psz 切换时改写。 */
let PAGE=80;
/* 深链带回的页码（readHash 写入、apply 消费一次后清掉）：
   apply() 对「筛选变了」一律回第 1 页，但「深链 / 刷新恢复」不该丢页码，
   所以走旁路注入而不是改 apply 的默认行为。 */
let _pgNext=null;
/* 在售 / 已下架 页签的当前值（"0" 在售 / "1" 已下架 / "" 全部）。
   默认「在售」：这是日常要看的那份；下架资费要收全、但要单列，
   不能混进在售清单的排序与变更检测里。 */
let STA="0";
/* 地域徽标文案与配色：hb 河北 / cn 全国。
   sc 由构建脚本按**原始地域字段**算好（四网判据完全不同，见 tariff_monitor.WHERE_OF），
   页面只负责显示与筛选 —— 页面侧不能再拿名称文本猜地市（那是旧做法，会误判）。 */
const SC_LB={hb:"河北",cn:"全国"};
/* 条目的地市归属（d.cty）**仍在数据里**，但页面不再把它做成筛选维度 ——
   2026-10-03 起「地市分布」面板与「地市」下拉一并下线，地市只作为**信息**
   出现在详情行与 CSV 的「城市」列（见 cityTags 的用法）。
   🔴 原先这里还注入过一张地市清单（构建脚本的 CITY_ORDER / CITY_EXTRA），
      靠两个占位符带进来给下拉建选项；下拉没了，那两个占位符也就一起从构建契约里
      撤掉了（构建脚本、CI 归档校验、audit_data 三处同步删的）。
      ⚠️ 本注释刻意**不写出占位符的字面量**：这份模板会被原样渲染进线上页面，
        而「页面里出现一个双下划线包起来的记号」正是占位符漏替换的症状 ——
        构建与 CI 都按字面量扫全页，写在这里会逼人放宽那条判据。
      构建脚本里的 CITY_ORDER / CITY_EXTRA 常量**保留** —— 它们仍在数据侧
      把地市码换算成中文名，CI 也照旧断言 cty 的取值域。 */
let view=[],pg=0,sortK="on",sortD=-1;

const $=s=>document.querySelector(s);
const DAY=864e5;

function num(v){const f=parseFloat(v);return isNaN(f)?null:f}
function toDate(s){
  s=String(s==null?"":s).trim();
  if(!/^\d{8}$/.test(s))return null;
  const y=+s.slice(0,4),m=+s.slice(4,6),d=+s.slice(6,8);
  if(m<1||m>12||d<1||d>31)return null;
  /* 只做 1..31 的范围检查不够：Date.UTC 会把 2 月 30 日、4 月 31 日这类
     **不存在的日期静默归一化**到下个月，于是相对天数与时间筛选全都悄悄偏移。
     回读三项、确认与原值一致才算合法（口径与 audit_data.py 的 date() 对齐）。 */
  const t=Date.UTC(y,m-1,d),dt=new Date(t);
  if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)return null;
  return t;
}
function fmtD(s){s=String(s==null?"":s);return /^\d{8}$/.test(s)?s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8):""}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmtGb(g){if(g==null||g===""||g===0)return"—";if(g>=1)return(g%1?g.toFixed(1):g)+"GB";return Math.round(g*1024)+"MB"}
function feeCls(f){const n=num(f);if(n===0)return"free";if(n!==null&&n<=10)return"low";return""}
/* 每元流量的显示形式。perVal() 为 null（无流量 / 月费为 0 / 缺值）时不显示，
   不臆造 0 或 ∞。 */
function perCell(d){
  const v=perVal(d);
  if(v==null)return "";
  /* 0 元含流量显示 ∞ —— 不显示反而更糟：按该列降序时它们排在最前，
     却不写值，看着像排序坏了。 */
  const s=v===Infinity?"∞":(v>=10?String(Math.round(v)):(v>=1?v.toFixed(1):v.toFixed(2)));
  return '<div class="mut">每元 '+s+'GB</div>';
}
/* 本次巡检变更徽章（标注由构建脚本的 diff 写入，页面只读） */
function chgTag(d){
  if(d.ck)return ' <span class="bg bg-chg" title="关键字段（月费 / 流量 / 上下线 / 权益等）本次有变更">变更</span>';
  if(d.ca)return ' <span class="bg bg-add" title="本次巡检新增的资费">新增</span>';
  return "";
}
/* 地域徽标：由构建脚本写好的 d.sc（hb 河北 / cn 全国）。
   放在名称前面 —— 「这条资费是哪一级的」比「它叫什么」更该先看到。 */
function scTag(d){
  const lb=SC_LB[d.sc];
  return lb?'<span class="bg bg-sc bg-sc-'+esc(d.sc)+'" title="适用地域：'+esc(lb)+'">'+esc(lb)+'</span>':"";
}
/* 归属徽标（个人 / 政企）。四网里只有移动的数据带 d.ow ⇒ 其余三网不会渲染出这个标签。
   类名走 bg-ow / bg-ow-g 两个固定值，不拼中文 —— 中文标识符虽合法，
   但在压缩、正则处理、别的工具解析时都是常见踩坑点。 */
function owTag(d){
  if(!d.ow)return"";
  return '<span class="bg bg-ow'+(d.ow==="政企"?" bg-ow-g":"")+'" title="归属：'
    +esc(d.ow)+'（官方标注）">'+esc(d.ow)+'</span>';
}
function stopTag(d){
  return d.st?' <span class="bg bg-stop" title="已下架">已下架</span>':"";
}

/* —— 有效期解析与徽标 ——
   宽带类资费普遍带期限（实测联通 229 条宽带里 199 条有限期），不标出来的话
   看不出「这是长期资费还是一年一续的合约」。分档按紧迫度着色：
   红=固定到期日 ≤90 天或已过，琥珀=≤1 年或 ≤12 个月的短包，灰=远期/长约；
   「自动续约」单独降级标注 —— 到期顺延对用户的影响远小于硬截止。
   🔴 阈值是展示口径不是数据口径：只影响颜色，不改任何筛选/排序结果。 */
const VP_RENEW=/顺延|延续|自动续|以此类推|自动延期|无异议/;
const VP_CN={"一":1,"两":2,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10,"半":.5};
function vpInfo(d){
  const v=String(d.vp==null?"":d.vp).trim();
  if(!v||v==="长期"||v==="—")return null;
  /* 固定到期日：取文案里**最晚**的一个 —— 有的条目先说促销截止再说恢复日，
     「有效期到 X 日」语义上以最晚的才算数。8 位紧凑式（20261231）一并认；
     2020–2040 之外的年份按解析噪音丢弃。 */
  let best=null;
  const RE=/20\d{2}\s*[年\/\-\.]\s*\d{1,2}\s*[月\/\-\.]\s*\d{1,2}|20\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])/g;
  for(let m;(m=RE.exec(v));){
    const s=m[0].replace(/\s+/g,"");let y,mo,dy;
    if(/^\d{8}$/.test(s)){y=+s.slice(0,4);mo=+s.slice(4,6);dy=+s.slice(6,8)}
    else{const p=s.split(/[年\/\-\.月日]+/).filter(Boolean);y=+p[0];mo=+p[1];dy=+p[2]||1}
    if(mo<1||mo>12||dy<1||dy>31)continue;
    const t=Date.UTC(y,mo-1,dy);
    if(t>=Date.UTC(2020,0,1)&&t<=Date.UTC(2040,11,31)&&(best==null||t>best))best=t;
  }
  /* 时长：N个月 / N年（含汉字 一/两/三…），统一换算成月数 */
  let term=null,tm;
  if((tm=v.match(/(\d+)\s*个?\s*月/))&&+tm[1]>0&&+tm[1]<=120)term=+tm[1];
  if(term==null&&(tm=v.match(/(\d+)\s*年/))&&+tm[1]>0&&+tm[1]<=10)term=+tm[1]*12;
  if(term==null&&(tm=v.match(/([一两二三四五六七八九十半])\s*年/)))term=VP_CN[tm[1]]*12;
  if(best==null&&term==null)return null;
  return{date:best,term:term,renew:VP_RENEW.test(v)};
}
function fmtT(t){const dt=new Date(t);return dt.getUTCFullYear()+"-"
  +String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0")}
function vpTag(d){
  const i=vpInfo(d);if(!i)return"";
  const rn=i.renew?' <span class="vptg vptg-rn" title="到期后双方无异议则自动顺延/续约">自动续</span>':"";
  if(i.date!=null&&BASE_OK){
    const lf=left(i.date),ds=fmtT(i.date);
    if(lf<=0)return ' <span class="vptg vptg-soon" title="资费标称有效期已过（'+ds+'）；上下架状态以上线/下线日期为准">'+ds+' 已过</span>'+rn;
    if(lf<=90)return ' <span class="vptg vptg-soon" title="距标称有效期（'+ds+'）还有 '+lf+' 天">至 '+ds+'</span>'+rn;
    if(lf<=365)return ' <span class="vptg vptg-mid" title="标称有效期至 '+ds+'">至 '+ds+'</span>'+rn;
    return ' <span class="vptg vptg-far" title="标称有效期至 '+ds+'">至 '+ds+'</span>'+rn;
  }
  if(i.date!=null)  /* 本页缺基准日：给不了剩余天数就不给颜色档，按远期灰处理 */
    return ' <span class="vptg vptg-far" title="标称有效期含日期，但本页缺基准日无法算剩余天数">'+fmtT(i.date)+'</span>'+rn;
  /* 纯时长（订购起算）：≤12 个月琥珀短包，更长灰长约；带自动续再降一档 */
  const y=Math.floor(i.term/12),mo=i.term%12;
  const ts=y?(mo?y+"年"+mo+"个月":y+"年"):mo+"个月";
  let cls=i.term<=12?"mid":"far";
  if(i.renew&&cls==="mid")cls="far";
  return ' <span class="vptg vptg-'+cls+'" title="订购起算 '+ts+'">'+ts+'</span>'+rn;
}

/* —— 宽带判定 ——
   d.bw 字段四网写法极碎（「含宽带」「300M」「无」「提速包」…），而「办不办宽带」
   恰是用户筛资费的高频维度。**只信字段，不做名称兜底**：
   🔴 字段写「无」就是无 —— 名称里出现「宽带」两个字是把「提到」当「包含」
      （「宽带电视点播费」「游戏宽带权益包」都这么误判过）。
   🔴 2026-10-03 数据审计补的两刀：
   ① 字段无效值黑名单扩容 ——「不涉及」「无需」「暂无」这类回避写法当时不在列，
      被当成了「肯定有宽带」的明示值。
   ② 字段**本身**在说「提速/装机/调测」这类附加动作的（实测移动
      「宽带提速一档（宽带已为1000M则不再提速）」），不算线路明示值 ——
      提速包是给已有宽带的人提速的，不是一条新线路。
   🔴 2026-10-03 定稿：名称兜底改**两级** —— 弱提及不算，强断言才算。
      曾是「名称含『宽带』二字就判含」，实测联通 77% 的名称判定里混着
      「极速电话咨询月包宽带20元/月」这类只是**提到**宽带的条目（用户指正：
      「不含宽带的（名称判定）可以去掉」）。整层撤掉又会误伤真宽带 —— 广电
      宽带字段全空（「59元宽带套餐」「全省慧家宽带优享套餐」），移动
      「动感地带芒果卡（宽带版）」也全靠名称。故名称路径只认**断言**：
      含宽带 / 宽带版 / 宽带包 / …套餐 / 融合 / FTTR / 速率数字，弱提及
      （名字里光有「宽带」）不算；判出的直接显示「含宽带」，不再有
      「（名称判定）」标签。排除词仍先行 —— 权益包 / 营销活动 / 提速 /
      电视这些「提到但不是线路」的照旧挡掉。 */
const BW_BADVAL=/^(0|[-—－\/\\]|无.*|没有|否|不涉及|不限|暂无|无需)$/;
const BW_NOTLINE=/提速|电视|IPTV|检修|装机|调测|加速|绿色上网|调优|扩容|移机|权益|营销活动|预约办理|电子券|标识|游戏宽带|无宽带|神眼/;
const BW_ASSERT=/含宽带|宽带版|宽带包|宽带套餐|宽带融合|融合宽带|宽带流量|宽带[+＋]|单宽带|FTTR|宽带.{0,8}\d{3,4}\s*M|\d{3,4}\s*M\D{0,4}宽带|千兆宽带|光宽带|宽带.{0,4}套餐/;
const BW_SPEED=/提速|光网|组网|FTTR/;
function bwInfo(d){
  const v=String(d.bw==null?"":d.bw).trim();
  /* 字段给了肯定值（含「宽带」「M」「光纤」之类）→ 采信；
     字段自己在说提速 / 电视这类附加动作的不算（见上 ②）；空 / 「无」→ 落名称 */
  if(v&&!BW_BADVAL.test(v)&&!BW_NOTLINE.test(v))return{t:v,src:"field"};
  /* 名称只在**明确说有**宽带时才算线路（见上 ③），只是「提到」不算 */
  const n=d.n||"";
  if(/宽带/.test(n)&&!BW_NOTLINE.test(n)&&BW_ASSERT.test(n))return{t:"含宽带",src:"name"};
  return null;
}
function bwSpeed(d){return BW_SPEED.test((d.n||"")+" "+(d.x||""))}
function bwMbps(d){
  const i=bwInfo(d);if(!i)return null;
  /* 数字带 M（300M / 500M / 1000M）→ 取最大那个数。千兆写法杂（1000M / 1G / 千兆），
     先按 M 抓，抓不到再认「千兆|1G」 */
  if(i.src==="field"){
    const ms=String(i.t).match(/\d{3,4}/g);
    if(ms)return Math.max.apply(null,ms.map(Number));
  }
  const ms=String(d.n||"").match(/(\d{3,4})\s*M/g);
  if(ms)return Math.max.apply(null,ms.map(m=>parseInt(m,10)));
  if(/千兆|1\s*G/i.test((d.n||"")+" "+(d.x||"")))return 1000;
  return null;
}
function bwDetail(d){
  const i=bwInfo(d),raw=String(d.bw==null?"":d.bw).trim();
  const v=i?"含宽带":"不含宽带";
  /* 🔴 raw 是运营商接口原文，必须 esc —— 这是全页唯一经手上游原文且进 innerHTML
     的位置；漏转义就是构建期烤进静态页的存储型 XSS（2026-10-02 代码审查抓到）。 */
  if(!i)return v+"（官方原文："+(esc(raw)||"空")+"）";
  const mb=bwMbps(d);
  const sp=bwSpeed(d)?' · <span class="bwtg" title="名称/权益里带「提速、光网、组网、FTTR」字样">提速/组网</span>':"";
  /* 判为含宽带但速率提不出来（名称与字段都没写数字）→ 明说，别让人以为是漏显示 */
  const un=mb==null?' · <span class="mut" title="名称与宽带字段都没有可提取的速率数字">速率未标注</span>':"";
  return v+(mb?' · <span class="bwtg">'+mb+'M</span>':"")+un+sp
    +'（官方原文：'+(esc(raw)||"空")+"）";
}
/* 条目的地市归属（中文名数组）——**只读**，不做任何换算，也**不再参与筛选**
   （下拉已下线，见 SC_LB 上方的注释）。仍是「单一来源」的锚点：
   audit_data.py 会断言这一行原样存在，防的正是「页面自己又整出一份地市判据副本」。
   仅用于详情行的「地域」、单条摘要与 CSV 的「城市」列。 */
function cityTags(d){return d.cty||[]}
function bwCell(d){
  const i=bwInfo(d);
  if(!i)return '<span class="mut">—</span>';
  const mb=bwMbps(d);
  const t=String(i.t);
  /* 字段原文超长时截断 —— 有权益说明整段被填进宽带字段的（实测最长 40 字），
     全量展示会把表格行撑到三行高。兜底显示不影响筛选（判定在 bwInfo 那一层）。 */
  const short=t.length>14?t.slice(0,14)+"…":t;
  return (mb?'<span class="bwtg">'+mb+'M</span> ':"")
    +'<span class="bwv" title="'+esc(t)+'">'+esc(short)+'</span>'
    +(bwSpeed(d)?' <span class="bwtg">提速</span>':"");
}

/* —— 数据基线与相对天数 ——
   BASE 在 setBase() 里**每次 apply 都重算**：切网、深链、hashchange 各条路径
   都必经 apply()，写在这里就不会有「漏调 setBase 用了别网基线」的旁路。
   写成 const 会让「切到别的网还拿移动的基线算天数」—— 一个不报错的错。 */
let BASE=null,BASE_OK=false;
function setBase(){
  BASE_OK=false;BASE=null;
  const b=net().base;
  if(!b)return;
  const t=toDate(String(b).replace(/-/g,""));
  if(t==null)return;
  BASE=t;BASE_OK=true;
}
const ago  =dt=>dt==null?null:Math.round((BASE-dt)/DAY);   // 上架至今（天）
const left =dt=>dt==null?null:Math.round((dt-BASE)/DAY);   // 距下线（天）
const FAR  =3650;                                          // 下线日超过这个天数视为「长期」

/* 每元流量（GB / 元）：比价口径的核心。
   月费缺失 / 流量缺失 ⇒ null（「算不出来」不等于「零」或「无穷」）。
   月费 0 元含流量 ⇒ +∞：0 元档是真实存在的促销形态（实测 227 条），
   按每元流量降序排时它们就该在顶上，给 null 会沉底、给 0 会颠倒。 */
function perVal(d){
  const f=num(d.f);
  if(!d.g||f==null||f<0)return null;
  /* 月费 0 元却含流量：每元流量在数学上是 +∞。
     这里**不能**返回 null —— null 会被当成「没有这个值」，按「每元流量」降序排时
     整批沉到空值尾部，而它们恰恰是最划算的。实测这类有 227 条，
     占「有流量」条目的三成，不是边角料。 */
  return f===0?Infinity:d.g/f;
}

/* 排序字段表：def = 首次点该列时的默认方向（1 升 / -1 降） */
const F={
  on  :{lb:"上架时间",def:-1,get:d=>toDate(d.o)},
  off :{lb:"下线时间",def: 1,get:d=>toDate(d.e)},
  fee :{lb:"月费",    def: 1,get:d=>num(d.f)},
  gb  :{lb:"流量",    def:-1,get:d=>(d.g==null?null:d.g)},
  call:{lb:"通话",    def:-1,get:d=>num(d.c)},
  per :{lb:"每元流量",def:-1,get:d=>perVal(d)},
  name:{lb:"名称",    def: 1,get:d=>d.n||d.t||""},
  /* 排序键名沿用 "ty"（老的 #s=ty 深链不作废），但**取值换成大类** ——
     表格那一列显示的就是大类，按细分排会让同一大类被拆散在多处，观感很碎。
     兜底保留 d.ty：万一某行没有 cat（不该发生），也不至于整批沉到空值尾部。 */
  ty  :{lb:"类型",    def: 1,get:d=>d.cat||d.ty||""},
  bw  :{lb:"宽带速率",def:-1,get:d=>{
         if(!bwInfo(d))return null;
         const m=bwMbps(d);
         /* 判为「含宽带」但速率未知（名称与字段都没写数字）的那几条：
            返回哨兵 -1 而不是 null —— 让它们留在宽带组内、排在已知速率之后，
            而不是混进几千条「不含宽带」的空值尾部里彻底看不出。
            真假速率都 ≥100，-1 不会有歧义。 */
         return m==null?-1:m;
       }}
};

/* 字符串比较复用同一个 Collator。
   localeCompare(y,"zh") 每次调用都要重新解析 locale、重算排序键，
   而一次 sort 的比较次数是 O(n·log₂n)。模块级 Collator 结果等价、可复用。 */
const COLL=(typeof Intl!=="undefined"&&Intl.Collator)?new Intl.Collator("zh"):null;

function cmpX(x,y){
  if(x==null&&y==null)return 0;
  if(x==null)return 1;          // 空值恒排最后，与升降序无关
  if(y==null)return -1;
  /* 相等先短路：两个 +∞ 相减是 NaN，而比较器返回 NaN 属实现定义行为
     （V8 当 0 处理，看着没事，但语义上已经是 undefined behavior）。 */
  if(x===y)return 0;
  const r=(typeof x==="string")
    ?(COLL?COLL.compare(x,y):x.localeCompare(y,"zh"))
    :(x-y);
  return sortD*r;
}

/* ★ 装饰-排序-反装饰（decorate → sort → undecorate）
   比较函数会被调用约 n·log₂n 次 —— 3878 行约 4.6 万次。
   若在比较函数里现算取值，等于把 toDate()（正则 + Date.UTC + 回读校验）
   和 localeCompare() 各跑 4.6 万次：实测按「上架时间」排一次 32ms、
   按「名称」20.5ms，而取值本身只要 0.5ms —— 时间全花在重复取值上。
   先各自求一次值、再比「值」，取值次数从 O(n·log₂n) 降到 O(n)。
   语义不变：空值恒排最后、方向仍由 sortD 决定；V8 的 sort 是稳定的，
   相等元素保持原相对顺序，与逐次现算的结果一致。 */
function sortView(){
  const get=F[sortK].get;
  const dec=view.map(d=>[get(d),d]);
  dec.sort((a,b)=>cmpX(a[0],b[0]));
  view=dec.map(p=>p[1]);
}

/* 维度的显示前缀。空串＝这个维度的选项文本本身就能读懂（如「本次变更」）。 */
const DIM_PRE={sb:"资费范围：",sc:"地域：",ow:"归属：",cat:"类型：",ty:"细分：",pf:"月费：",
               gf:"流量：",cf:"通话：",bw:"宽带：",chx:"渠道：",on:"上架：",off:"下线：",chg:""};
/* 资费范围的**显示名**：数据值说的是「这一条从哪个目录来」（tariffAttr 1/2 =
   全国跨省目录 / 本省目录），官方页面给用户看的词是「全网资费 / 河北资费」。
   只改**显示**，不动落盘取值 —— 构建期判据、probe_filter_dims 的 ATTR_CN
   白名单、以及审计脚本都按 全国资费/本省资费 这两个值对账，改值等于把对账打断。 */
const SB_LABEL={"全国资费":"全网资费","本省资费":"河北资费"};
/* 读某个维度控件当前选中项的**可读文本**。
   选项文本带条数（如「加装包（2135）」）—— 那是给下拉里挑的时候看的，
   写进筛选说明 / 标签里就是噪音，这里统一削掉。 */
function optText(k){
  const s=document.getElementById(k),o=s&&s.selectedOptions[0];
  return o?o.textContent.replace(/（\d+）$/,""):"";
}

/* —— 两级主轴：把 #ow / #sb 的选项**镜像**成页签按钮 ——
   ★ 单一数据源仍是那两个 select：按钮只负责「点击后回写 + 反射选中态」。
     从 select 现算按钮，就不可能出现「按钮写着 8 条、下拉里写着 5 条」这种
     两份口径 —— 置灰 / 条数 / 选中态全部跟着 select 走。
   ★ 只在**结构**（取值 / 条数 / 置灰）变了才重建 DOM，单纯切选中态只改 class：
     否则每敲一个搜索键都重建一遍按钮，点完那一下的焦点会当场丢掉。 */
function syncAxis(){
  [["ow","segOw"],["sb","segSb"]].forEach(p=>{
    const sel=document.getElementById(p[0]),box=document.getElementById(p[1]);
    if(!sel||!box)return;
    const opts=[].slice.call(sel.options);
    const sig=opts.map(o=>o.value+"|"+(o.textContent||"")+"|"+(o.disabled?1:0)).join("\u0001");
    if(box.dataset.sig!==sig){
      box.dataset.sig=sig;
      box.innerHTML=opts.map(o=>{
        /* 选项文本形如「全网资费（2956）」—— 条数挪到小号 <i> 里，
           页签上就只剩名字，和官方那排页签读起来一样。 */
        const m=/^(.*?)（(\d+)）$/.exec(o.textContent||"");
        const lb=m?m[1]:(o.textContent||o.value);
        const on=sel.value===o.value;
        return '<button type="button" data-v="'+esc(o.value)+'"'
          +(o.disabled?" disabled":"")
          +(on?' class="on" aria-pressed="true"':' aria-pressed="false"')
          +'>'+esc(lb)+(m?'<i>'+m[2]+'</i>':"")+'</button>';
      }).join("");
    }
    [].forEach.call(box.children,(b,i)=>{
      const o=opts[i];if(!o)return;
      const on=sel.value===o.value;
      b.classList.toggle("on",on);
      b.setAttribute("aria-pressed",on?"true":"false");
    });
  });
}

/* —— 大类 ↔ 细分 联动 ——
   选了大类后，把不属于它的细分项**置灰**。
   不置灰的话用户可以选出「大类＝加装包 ＋ 细分＝5G套餐」这种自相矛盾的组合，
   页面会安静地给出 0 条 —— 看着像「没有数据」，其实是不存在的组合。
   （与 renderDims 里「本网没有的维度就不给入口」是同一条原则。） */
/* —— 当前筛选条件：一次读成对象 ——
   判据（match）与「每个档位几条」（syncDims）**共用这一份**。
   以前是 apply() 里一串 const + 就地闭包，要给档位显示条数就只能**照抄一遍**
   这套条件 ⇒ 同一口径两份副本，改一处忘另一处 = 「选项写着 8 条、点进去 5 条」。
   ★ dimOff：本网**不存在**（隐藏）或**已置灰**的维度一律当没筛 ——
     UI 上点不到，但脚本 / 深链 / 地址栏仍可能把它设进来（实测可行）。
     与 readHash「认不出来就当没传」同一原则：**无效筛选 = 不筛**。 */
/* 某一维在本网是否存在（= 控件没被藏起来）。
   ★ 同时看控件本身与它的外层容器（id 约定：容器 = "w" + 控件 id：
     #wsb 是「资费范围」整行、#wow 是「资费归属」整行）。
     只藏一层的话，另一层的判据会把隐藏的维度当真 ⇒ 拿一个本网没有的取值去筛。
   ★ 资费范围 / 资费归属两个 select 是**视觉隐藏**（.axsel）而不是 display:none ——
     它们由主轴页签代劳，但判据必须仍认为「这一维在本网存在」，否则用户在页签上
     选中的条件会被判成无效筛选，出现「页签亮着、结果却是全量」。 */
function dimVisible(k){
  const e=document.getElementById(k),w=document.getElementById("w"+k);
  if(!e)return false;
  return e.style.display!=="none"&&!(w&&w.style.display==="none");
}
function condOf(){
  const dm={};
  ["sb","ow"].forEach(k=>{dm[k]=!dimVisible(k)});
  const g=k=>{const e=document.getElementById(k);return e?e.value:""};
  /* 区间值在这里一次性解析（["0,5" → [0,5]]），match() 里直接用数组 ——
     否则每行每轮都重复 split/map。rg 值三种形态：null=不筛 / "none"=无该项 /
     [lo,hi]=区间。 */
  const rg=k=>{const v=g(k);if(!v)return null;if(v==="none")return"none";
    const p=v.split(",").map(Number);return[p[0],p[1]]};
  /* 关键词按空白拆成词数组（match 里做多词 AND）；
     空串拆出来是 [""]，先滤掉。高亮（render 侧）用同一份词表，口径一致。 */
  const kwTerms=$("#kw").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return {kw:kwTerms,
          sb:g("sb"),sc:g("sc"),ow:g("ow"),cat:g("cat"),ty:g("ty"),
          pf:rg("pf"),gf:rg("gf"),cf:rg("cf"),bw:g("bw"),chx:g("chx"),
          on:g("on"),offv:g("off"),chg:g("chg"),sta:STA,dimOff:dm};
}

/* —— 板块 → 类型 → 细分：三级联动 + 档位条数 ——
   ★ 必须在 apply() 开头跑（**不能只挂 onchange**）：程序化设值不触发 onchange，
     深链 #cat=… / 脚本复位 / 切网清值都走那条路 —— 只挂 onchange 时联动会
     **静默失效**（能选出「套餐 ＋ 加装包细分」这种不存在的组合，页面安静给 0 条）。
     这一版在这上面栽过两次（大类→细分一次、地市一次），故统一收口到 apply() 的必经之处。
   ★ 条数由 match() 算，且对**自己所在的那一层**不做限制（facet 计数）：
     问的是「把这一格换成 X 会有几条」，不是「已选 X 时还剩几条」。
   ★ 只扫一遍 rows（而不是「每个选项扫一遍」）：
     30 个选项 × 8000 行 = 24 万次判据调用，每敲一个搜索键都要付一遍。 */
function syncDims(){
  const rs=rowsOf(NET);
  if(!rs.length){
    /* 空网（未接入 / 快照缺失）早退前，先把静态下拉里可能残留的**上一个网**
       的档位条数与置灰清掉 —— 不清的话切到空网，月费/流量下拉还挂着
       别网的数字，纯误导。分类两下拉由 renderNet 重建，不在此列。 */
    const empt=[["sc","全部地域（河北 + 全国）"],["pf","全部月费"],["gf","不限流量"],
                ["cf","不限通话"],["bw","不限宽带"],["chx","不限渠道"],
                ["on","全部上架时间"],["off","全部下线时间"]];
    empt.forEach(p=>{
      const sel=document.getElementById(p[0]);if(!sel)return;
      [...sel.options].forEach(o=>{
        o.disabled=false;
        o.textContent=o.value?(o.dataset.lbl||o.textContent.replace(/（\d+）$/,"")):p[1];
      });
    });
    return;
  }
  const base=condOf(),sb=$("#sb"),cat=$("#cat"),ty=$("#ty");
  const sv=sb?sb.value:"",cv=cat?cat.value:"",tv=ty?ty.value:"";
  /* 只把「分类」这三层摘掉，其余维度（搜索 / 地域 / 月费 / 时效…）照常生效。 */
  const core=Object.assign({},base,{sb:"",cat:"",ty:""});
  const sbN={},catN={},tyN={};
  rs.forEach(d=>{
    if(!match(d,core))return;
    const okS=!sv||d.sect===sv,okC=!cv||d.cat===cv,okT=!tv||d.ty===tv;
    if(okS&&okT&&d.cat)catN[d.cat]=(catN[d.cat]||0)+1;
    if(okS&&okC&&d.ty)tyN[d.ty]=(tyN[d.ty]||0)+1;
    if(okC&&okT&&d.sect)sbN[d.sect]=(sbN[d.sect]||0)+1;
  });
  /* 条数写进选项文本；0 条的档置灰（点进去必然空，不如直接挡住）。
     optText() 会把「（N）」削掉，所以筛选标签 / CSV 头不会带上数字。 */
  const fill=(sel,mp,fb,lab)=>{
    if(!sel)return;
    [...sel.options].forEach(o=>{
      const nm=lab?lab(o.value):o.value;
      if(!o.value){o.disabled=false;o.textContent=fb;return}
      const n=mp[o.value]||0;
      o.textContent=n?(nm+"（"+n+"）"):nm;
      o.disabled=!n;
    });
    /* 🔴 这里**不清值** —— 见下面的说明。 */
  };
  /* 资费范围是**唯一**带显示名映射的维度：数据值写的是目录来源
     （全国资费 / 本省资费），官方页面对用户用的词是 全网资费 / 河北资费，
     见 SB_LABEL。其余维度的选项文本本身就是取值，不需要这一层间接。 */
  if(dimVisible("sb"))fill(sb,sbN,"全部",v=>SB_LABEL[v]||v);
  fill(cat,catN,"全部大类");
  fill(ty,tyN,"全部细分");
  /* —— 第二组 facet：档位 / 属性类维度（地域 / 归属 / 月费 / 流量 / 通话 / 宽带 / 渠道 / 时效）——
     口径与上面分类 facet 一致：「把这一格换成 X 会有几条」。
     ★ 组内互相不设限（core2 一次摘掉这一组），组间约束照常生效 ——
       选了 cat=加装包 时，月费各档的条数就是加装包内部的分布。
       严格「每维只摘自己」要 9 遍过滤（8000 行 × 9 = 7 万次判据，每敲一个搜索键
       都付一遍）；组内不设限的近似只要 1 遍，且与分类三层「互相不设限」同一取舍。
     ★ 行上的数值（月费/流量/通话/速率/相对天数）在循环里各算**一次**再落档，
       别在每个档的判断里重复 num()/toDate()。
     ★ 各档的判定必须与 match() **逐字对应**（含 fail-closed：速率未知不算 ≥200M、
       缺基准日不进时间档）—— 两处口径一漂移，就是「选项写着 8 条、点进去 5 条」。 */
  const core2=Object.assign({},base,{sc:"",ow:"",pf:null,gf:null,cf:null,bw:"",chx:"",on:"",offv:""});
  const n2={sc:{},ow:{},pf:{},gf:{},cf:{},bw:{},chx:{},on:{},off:{}};
  const inR=(v,lo,hi)=>v!=null&&v>=lo&&v<=hi;
  rs.forEach(d=>{
    if(!match(d,core2))return;
    if(d.sc)n2.sc[d.sc]=(n2.sc[d.sc]||0)+1;
    if(d.ow)n2.ow[d.ow]=(n2.ow[d.ow]||0)+1;
    if(d.chx)n2.chx[d.chx]=(n2.chx[d.chx]||0)+1;
    const f=num(d.f);
    if(f!=null){
      if(f===0)n2.pf["0,0"]=(n2.pf["0,0"]||0)+1;
      if(f<=10)n2.pf["0,10"]=(n2.pf["0,10"]||0)+1;
      if(f<=30)n2.pf["0,30"]=(n2.pf["0,30"]||0)+1;
      if(f<=60)n2.pf["0,60"]=(n2.pf["0,60"]||0)+1;
      if(inR(f,60,100))n2.pf["60,100"]=(n2.pf["60,100"]||0)+1;
      if(f>=100)n2.pf["100,99999"]=(n2.pf["100,99999"]||0)+1;
    }
    const gN=d.g;
    if(gN==null||gN===0)n2.gf.none=(n2.gf.none||0)+1;
    if(inR(gN,0,5))n2.gf["0,5"]=(n2.gf["0,5"]||0)+1;
    if(inR(gN,5,30))n2.gf["5,30"]=(n2.gf["5,30"]||0)+1;
    if(inR(gN,30,100))n2.gf["30,100"]=(n2.gf["30,100"]||0)+1;
    if(gN!=null&&gN>=100)n2.gf["100,99999"]=(n2.gf["100,99999"]||0)+1;
    const cm=num(d.c);
    if(cm==null||cm===0)n2.cf.none=(n2.cf.none||0)+1;
    if(inR(cm,0,100))n2.cf["0,100"]=(n2.cf["0,100"]||0)+1;
    if(inR(cm,100,500))n2.cf["100,500"]=(n2.cf["100,500"]||0)+1;
    if(cm!=null&&cm>=500)n2.cf["500,99999"]=(n2.cf["500,99999"]||0)+1;
    /* ⚠️ 提速档**不能**嵌进 bwInfo 里：bwSpeed 只看名称/权益里的「提速/光网
       组网」字样，独立于「有没有一条宽带线路」—— 判据 bw==="speed" 也只认
       bwSpeed（审计抓过：面 45 / 实 257 的漂移就是这么来的）。 */
    if(bwSpeed(d))n2.bw.speed=(n2.bw.speed||0)+1;
    /* line 与 noline 恰好互补（bwInfo 是单一判据），if/else 各记一档 ——
       两条档的计数出自同一次判定，不可能出现 line+noline > total 的劈叉。 */
    if(bwInfo(d)){
      n2.bw.line=(n2.bw.line||0)+1;
      const mb=bwMbps(d);
      if(mb!=null){
        if(mb>=200)n2.bw.m200=(n2.bw.m200||0)+1;
        if(mb>=500)n2.bw.m500=(n2.bw.m500||0)+1;
        if(mb>=1000)n2.bw.m1000=(n2.bw.m1000||0)+1;
      }
    }else n2.bw.noline=(n2.bw.noline||0)+1;
    const ot=toDate(d.o);
    if(ot==null)n2.on.none=(n2.on.none||0)+1;
    else if(BASE_OK){
      const ag=ago(ot);
      if(ag>=0){
        if(ag<=7)n2.on["7"]=(n2.on["7"]||0)+1;
        if(ag<=30)n2.on["30"]=(n2.on["30"]||0)+1;
        if(ag<=90)n2.on["90"]=(n2.on["90"]||0)+1;
        if(ag<=180)n2.on["180"]=(n2.on["180"]||0)+1;
        if(ag<=365)n2.on["365"]=(n2.on["365"]||0)+1;
      }
    }
    if(BASE_OK){
      const et=toDate(d.e);
      if(et!=null){
        const lf=Math.abs(left(et));
        if(lf<=30)n2.off["30"]=(n2.off["30"]||0)+1;
        if(lf<=60)n2.off["60"]=(n2.off["60"]||0)+1;
        if(lf<=90)n2.off["90"]=(n2.off["90"]||0)+1;
      }
    }
  });
  /* 条数写进选项文本；0 条的档置灰（点进去必然空，不如直接挡住）。
     显示名从首次写入时缓存的 dataset.lbl 取 —— 这组下拉的选项文本是手工
     排版的（「仅 0 元」「≤ 10 元」），不能拿 value 当文本重新生成。 */
  const fillLbl=(sel,mp,fb)=>{
    if(!sel)return;
    [...sel.options].forEach(o=>{
      if(!o.value){o.disabled=false;o.textContent=fb;return}
      if(!o.dataset.lbl)o.dataset.lbl=o.textContent.replace(/（\d+）$/,"");
      const n=mp[o.value]||0;
      o.textContent=n?(o.dataset.lbl+"（"+n+"）"):o.dataset.lbl;
      o.disabled=!n;
    });
  };
  fillLbl($("#sc"),n2.sc,"全部地域（河北 + 全国）");
  if(dimVisible("ow"))fillLbl($("#ow"),n2.ow,"全部");
  fillLbl($("#pf"),n2.pf,"全部月费");
  fillLbl($("#gf"),n2.gf,"不限流量");
  fillLbl($("#cf"),n2.cf,"不限通话");
  fillLbl($("#bw"),n2.bw,"不限宽带");
  fillLbl($("#chx"),n2.chx,"不限渠道");
  fillLbl($("#on"),n2.on,"全部上架时间");
  fillLbl($("#off"),n2.off,"全部下线时间");
  /* ★ 全页**唯一一处**「联动清值」：细分项不属于当前所选大类时。
     判据是**从属关系**（细分挂在大类下，data-cat 由 renderNet 写好），
     而不是「这个组合恰好 0 条」。
     🔴 后者绝不能清 —— 那会把用户已选的条件**悄悄摘掉**，于是
       「先选加装包、再选含宽带」本来该是 0 条，页面却给出 85 条（宽带的全部），
       筛选标签上的「细分：加装包」也同时消失 —— 一个静默改答案的行为。
       （2026-09-24 一致性对账抓到：期望 0、实际 85，四网共 20+ 例。）
       组合为空就该诚实显示 0 条：用户看得见两个条件都在，自己会取舍。 */
  if(ty){
    const sel=ty.selectedOptions[0];
    if(sel&&sel.value&&cv&&sel.dataset.cat&&sel.dataset.cat!==cv)ty.value="";
  }
  /* 两级主轴的页签跟着上面的条数 / 置灰一起刷新（放在最后一件事：
     sb 的选项文本刚被 fill() 改过，早跑一步会把上一轮的条数镜像出去）。 */
  syncAxis();
}
/* —— 当前生效筛选：渲染成可点掉的标签 ——
   以前这里是一行纯文本（「筛选：状态：在售 · 地域：仅河北省 · …」），
   想改掉其中一个条件，得先在这一长串里认出它、再回头去 12 个下拉里找到那一个。
   做成标签后点 × 即摘，且「这一屏为什么少了东西」一眼可数。
   ★ 页签（在售/已下架）也放进来 —— 它同样是结果变少的原因之一；
     点掉它等于切回「全部」，语义与其他维度一致。 */
function chipsHtml(){
  const a=[];
  if(STA!=="")a.push(["st","状态："+(STA==="1"?"已下架":"在售")]);
  const kw=$("#kw").value.trim();
  if(kw)a.push(["kw","关键词「"+kw+"」"]);
  DIMS.forEach(k=>{if($("#"+k).value)a.push([k,(DIM_PRE[k]||"")+optText(k)])});
  if(!a.length)return '<span class="mut">无筛选</span>';
  return '<span class="fchips">'+a.map(p=>
    '<button type="button" class="fchip" data-d="'+esc(p[0])+'" title="点掉这一个条件">'
    +esc(p[1])+'<i>×</i></button>').join("")+'</span>';
}
/* 纯文本版条件说明（condText）已删除：它曾与 chipsHtml 各维护一份口径且
   无人调用 —— 死代码留着的下场就是改一处忘一处。 */

function onCell(d){
  const dt=toDate(d.o);
  if(dt==null)return'<span class="mut">—</span>';
  if(!BASE_OK)return'<div>'+fmtD(d.o)+'</div>';   // 缺基准日就不编造相对天数
  const ag=ago(dt);
  let b="",rel;
  if(ag<0){b=' <span class="bg bg-wait">待上架</span>';rel=(-ag)+" 天后生效"}
  else if(ag===0){b=' <span class="bg bg-new">NEW</span>';rel="今天上架"}
  else{b=ag<=30?' <span class="bg bg-new">NEW</span>':"";rel=ag+" 天前"}
  return'<div>'+fmtD(d.o)+'</div><div class="mut">'+rel+b+'</div>';
}
function offCell(d){
  const dt=toDate(d.e);
  if(dt==null)return'<span class="mut">—</span>';
  if(!BASE_OK)return'<div>'+fmtD(d.e)+'</div>';
  const lf=left(dt);
  if(lf>FAR)return'<div>'+fmtD(d.e)+'</div><div class="mut">长期</div>';
  if(lf<0)return'<div>'+fmtD(d.e)+'</div><div class="exp">已过期 '+(-lf)+' 天</div>';
  if(lf<=60)return'<div>'+fmtD(d.e)+'</div><div class="soon">'+lf+' 天后到期</div>';
  return'<div>'+fmtD(d.e)+'</div><div class="mut">'+lf+' 天后到期</div>';
}

/* —— 「同价位更优选择」（2026-10-01）——
   用户盯着一 条 59 元 30GB 的套餐时，心里真正的问题是「这个价位有没有更好的」。
   答案就在同网数据里，但手动翻页去比对几千条没人会做 —— 把这一步做成展开详情时
   自动给出：±10 元档内、流量更多**且**每元流量更高（更划算）的在售资费 top3。
   ★ 判据全用页面既有口径（perVal / num / fmtGb），不另立一套：
     「更划算」= 每元流量严格更高；「更多」= 流量严格更大。两者同时满足才算更优，
     只便宜不多给的不算（那可能是权益缩水）。
   ★ 0 元档（每元流量 = ∞）天然是「更优」，保留 —— 它确实更划算。
   ★ 确定性：只读行数据，同一份数据展开两次结果逐字节一致。 */
function aiCompareHTML(d){
  const f=num(d.f);
  if(f==null||f<=0||!d.g)return"";          // 无月费 / 0 元 / 无流量的没有「同价位」可言
  const rs=rowsOf(NET),lo=f-10,hi=f+10,my=perVal(d),hits=[];
  for(let i=0;i<rs.length;i++){
    const x=rs[i];
    if(x.st)continue;                        // 只推在售
    if(x===d||!x.g)continue;
    const xf=num(x.f);
    if(xf==null||xf<lo||xf>hi)continue;
    if(x.g<=d.g)continue;                    // 流量必须更多
    const xp=perVal(x);
    if(xp==null||xp<=(my==null?-1:my))continue;   // 每元流量必须更高
    hits.push([xp,x]);
  }
  if(!hits.length)return"";
  hits.sort((a,b)=>b[0]-a[0]);
  const fmt=v=>v===Infinity?"∞":(v>=10?String(Math.round(v)):v.toFixed(1));
  return '<span class="mut">±10 元内、流量更多且更划算的：</span>'
    +hits.slice(0,3).map(p=>{
      const x=p[1];
      return '<span class="aichip" title="月费 '+esc(String(x.f))+' 元 · 流量 '+esc(fmtGb(x.g))
        +' · 每元 '+esc(fmt(p[0]))+'GB">'+esc((x.n||x.t||"—").slice(0,42))+'</span>';
    }).join("");
}

/* ══ 收藏关注（并入主脚本，2026-10-01 重设计版）══════════════════════
   收藏表 { "网|名称": 1 } 存 localStorage（键沿用 hbtm_fav / hbtm_only_fav，
   老用户已存的收藏在新界面直接可用）。星标注入名称单元格；
   「只看收藏 / 收藏导出 / 收藏导入」挂在快捷 chip 行。 */
const FAV_KEY="hbtm_fav",ONLY_KEY="hbtm_only_fav";
function loadObj(k){try{const v=JSON.parse(localStorage.getItem(k)||"{}");return(v&&typeof v==="object")?v:{}}catch(e){return{}}}
function saveObj(k,o){try{localStorage.setItem(k,JSON.stringify(o))}catch(e){}}
let fav=loadObj(FAV_KEY);
let onlyFav=false;
try{onlyFav=localStorage.getItem(ONLY_KEY)==="1"}catch(e){}
/* 星标：注入到名称单元格最前面（render() 每次重建表格后调用） */
function decorateFav(){
  const tb=$("#tb");if(!tb)return;
  const rows=tb.querySelectorAll("tr.row");
  for(let i=0;i<rows.length;i++){
    const tr=rows[i];
    if(tr.querySelector(".favbtn"))continue;
    const cell=tr.querySelector("td.nm");
    if(!cell)continue;
    const b=document.createElement("button");
    b.type="button";
    b.className="favbtn"+(fav[tr.dataset.k]?" on":"");
    b.title="收藏关注（只存本机，不上传）";
    b.setAttribute("aria-label","收藏");
    b.textContent=fav[tr.dataset.k]?"★":"☆";
    b.onclick=ev=>{
      ev.preventDefault();ev.stopPropagation();   // 别让 tr.onclick 展开详情
      const k=tr.dataset.k||"";
      if(fav[k])delete fav[k];else fav[k]=1;
      saveObj(FAV_KEY,fav);
      b.textContent=fav[k]?"★":"☆";
      b.className="favbtn"+(fav[k]?" on":"");
      favRefresh();
    };
    cell.insertBefore(b,cell.firstChild);
  }
  favRefresh();
}
/* 只看收藏：DOM 层显隐（返回当前可见条数） */
function applyOnlyFav(){
  const tb=$("#tb");if(!tb)return 0;
  const rows=tb.querySelectorAll("tr.row");
  let shown=0;
  for(let i=0;i<rows.length;i++){
    const tr=rows[i],det=tr.nextElementSibling;
    const hit=!onlyFav||!!fav[tr.dataset.k||""];
    tr.style.display=hit?"":"none";
    if(det&&det.classList.contains("det"))det.style.display=hit?"":"none";
    if(hit)shown++;
  }
  /* 斑马纹按可见行重排 —— 不重排的话条纹按「含隐藏行」的序数分布，忽有忽无 */
  zebrafy();
  return shown;
}
function favRefresh(){
  const shown=applyOnlyFav();
  const btn=document.getElementById("favOnly");
  if(btn){
    const n=Object.keys(fav).length;
    btn.textContent=(onlyFav?"★ 只看收藏":"☆ 只看收藏")+(n?" ("+n+")":"");
    btn.classList.toggle("on",onlyFav);
  }
  const note=document.getElementById("favNote");
  if(note){
    note.style.display=onlyFav?"":"none";
    if(onlyFav)note.textContent="★ 仅显示收藏（本页 "+shown+" 条）· 分页与筛选不受影响，翻页后仍然只显示收藏"
      +(shown===0?(view.length?"（当前筛选结果里没有你收藏的条目）":"（还没有收藏，点条目名前的 ☆ 收藏）"):"");
  }
  /* 徽标把「只看收藏」也算作一个生效条件；点收藏 chip 不走 apply，
     不在这里刷一次就会停留旧值。 */
  updateFbadge();
}
function favUpdateStars(){
  const tb=$("#tb");if(!tb)return;
  const rows=tb.querySelectorAll("tr.row");
  for(let i=0;i<rows.length;i++){
    const b=rows[i].querySelector(".favbtn");
    if(!b)continue;
    const on=!!fav[rows[i].dataset.k||""];
    b.textContent=on?"★":"☆";
    b.className="favbtn"+(on?" on":"");
  }
}
/* 注入「只看收藏 / 收藏导出 / 收藏导入」三个按钮（幂等） */
function favInject(){
  const chips=document.getElementById("chips");
  if(!chips)return;
  if(!document.getElementById("favOnly")){
    const b=document.createElement("button");
    b.type="button";b.id="favOnly";b.className="favchip";
    b.title="只显示本机收藏的资费（收藏存在浏览器本地）";
    b.onclick=()=>{
      onlyFav=!onlyFav;
      try{localStorage.setItem(ONLY_KEY,onlyFav?"1":"0")}catch(e){}
      favRefresh();
    };
    chips.appendChild(b);
  }
  if(!document.getElementById("favExp")){
    const ex=document.createElement("button");
    ex.type="button";ex.id="favExp";ex.className="favchip";
    ex.title="把本机收藏导出成 JSON 文件（换设备 / 备份用）";
    ex.textContent="收藏导出";
    ex.onclick=()=>{
      const n=Object.keys(fav).length;
      if(!n){toast("还没有任何收藏，先点条目名前的 ☆");return}
      download("河北资费收藏_"+(net().base||"")+".json",
               JSON.stringify({v:1,app:"hebei-tariff-monitor",favs:fav},null,1),
               "application/json");
    };
    chips.appendChild(ex);
  }
  if(!document.getElementById("favImp")){
    const im=document.createElement("button");
    im.type="button";im.id="favImp";im.className="favchip";
    im.title="从导出的 JSON 文件合并收藏（不覆盖本机已有的）";
    im.textContent="收藏导入";
    const fi=document.createElement("input");
    fi.type="file";fi.accept=".json,application/json";fi.style.display="none";
    im.onclick=()=>fi.click();
    fi.onchange=()=>{
      const f=fi.files&&fi.files[0];
      if(!f)return;
      const r=new FileReader();
      r.onload=()=>{
        try{
          const o=JSON.parse(r.result);
          const src=(o&&typeof o==="object")?(o.favs||o):null;
          let total=0,added=0;
          if(src&&typeof src==="object"){
            Object.keys(src).forEach(k=>{
              if(typeof k==="string"&&k.indexOf("|")>0){total++;if(!fav[k]){fav[k]=1;added++}}
            });
          }
          if(!total){toast("导入失败：文件里没有可识别的收藏");return}
          saveObj(FAV_KEY,fav);
          favUpdateStars();favRefresh();
          toast("导入 "+total+" 条收藏（本机新增 "+added+" 条）");
        }catch(err){toast("导入失败：不是有效的收藏导出文件")}
      };
      r.readAsText(f);
      fi.value="";                    // 允许连续导入同一个文件
    };
    chips.appendChild(im);chips.appendChild(fi);
  }
  if(!document.getElementById("favNote")){
    const d=document.createElement("div");
    d.id="favNote";d.className="favnote";d.style.display="none";
    chips.parentNode.insertBefore(d,chips.nextSibling);
  }
}
