/* —— 搜索词表 + 命中高亮 ——
   词表与 condOf() 的 kw 同一口径（trim → 小写 → 空白分词），两处各读一次输入、
   语义一致；不共享变量是因为 condOf 每轮 apply 都要重建条件对象，render 只需要词表。
   ★ 先 split 再对每一片单独 esc：不能先 esc 整串再替换 —— esc 会把 & 变 &amp;，
     词表里若恰好有「amp」「lt」这类片段就会命中转义产物，把标签拼坏。
   ★ 长词优先：两个词有前缀关系时（「流量」与「流量包」），短词先匹配会把长词切碎。
   ★ split 带捕获组：匹配段会出现在结果里，逐段判断是否命中词（大小写归一后比对）。 */
function kwTermsNow(){
  return $("#kw").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
}
function hl(text,terms){
  const t=String(text==null?"":text);
  if(!terms.length||!t)return esc(t);
  const re=new RegExp("("+terms.slice().sort((a,b)=>b.length-a.length)
    .map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  return t.split(re).map(p=>
    (p&&terms.indexOf(p.toLowerCase())>=0)?"<mark>"+esc(p)+"</mark>":esc(p)).join("");
}

/* —— 空结果诊断：哪个条件把结果筛没了 ——
   只在 0 条时算：对每个**生效中**的条件单独摘掉、重算一次 count，
   把「摘掉它能找回多少条」列成可点建议。≤ 15 次过滤，只在空结果页付一次。
   ★ 按找回条数降序 —— 用户最想先看到「误伤最重的那个条件」。
   ★ 全部为 0（即摘掉任何单条仍为 0）时不渲染：那说明是多条件联合筛没的，
     逐条建议只会误导，让「重置全部」兜底。 */
function activeConds(){
  const a=[];
  const kw=$("#kw").value.trim();
  if(kw)a.push({k:"kw",lab:"关键词「"+kw+"」"});
  if(STA!=="")a.push({k:"st",lab:"状态："+(STA==="1"?"已下架":"在售")});
  DIMS.forEach(k=>{if($("#"+k).value)a.push({k:k,lab:(DIM_PRE[k]||"")+optText(k)})});
  return a;
}
function removeCond(k){
  if(k==="kw"){$("#kw").value="";apply();return}
  if(k==="st"){STA="";syncTabs();apply();return}
  const el=$("#"+k);if(el)el.value="";
  if(k==="cat")syncDims();          // 摘掉大类 ⇒ 细分置灰复原（同标签 × 那条路）
  apply();
}
function diagEmpty(){
  const base=condOf();
  const cands=activeConds().map(c=>{
    const one=Object.assign({},base);
    if(c.k==="kw")one.kw=[];
    else if(c.k==="st")one.sta="";
    else{
      /* 维度 id → 条件键只有一处不一致：#off 控件在条件里叫 offv。
         区间型（月费/流量/通话）复位成 null（= 不筛），其余复位空串。 */
      const ck=(c.k==="off")?"offv":c.k;
      one[ck]=(c.k==="pf"||c.k==="gf"||c.k==="cf")?null:"";
    }
    return {k:c.k,lab:c.lab,n:rowsOf(NET).filter(d=>match(d,one)).length};
  }).filter(c=>c.n>0).sort((x,y)=>y.n-x.n);
  if(!cands.length)return "";
  return '<div class="diag"><span>试试摘掉一个条件：</span>'+cands.slice(0,6).map(c=>
    '<button type="button" class="diagb" data-rm="'+esc(c.k)+'" title="摘掉这个条件并重新筛选">'
    +esc(c.lab)+' → 找回 '+c.n+' 条</button>').join("")+'</div>';
}

/* 斑马纹按**可见行**重排（见 CSS .zeb 注释）：render 后、「只看收藏」显隐后都要跑。
   行与详情行成对插入，只数 tr.row 且 display 不为 none 的。 */
function zebrafy(){
  const rows=$("#tb").querySelectorAll("tr.row");
  let i=0;
  for(const tr of rows){
    tr.classList.toggle("zeb",tr.style.display!=="none"&&(i++%2===1));
  }
}
function render(){
  const tb=$("#tb");tb.innerHTML="";
  const terms=kwTermsNow();          // 命中词高亮与筛选用同一份词表
  const st=pg*PAGE,slice=view.slice(st,st+PAGE);
  const tp=Math.max(1,Math.ceil(view.length/PAGE));
  $("#stat").innerHTML="匹配 <b>"+view.length+"</b> 条"
    +" · 共 "+rowsOf(NET).length+" 条"
    +(view.length?" · 显示 "+(st+1)+"–"+Math.min(st+PAGE,view.length):"")
    +' · <span class="sortinfo">'+F[sortK].lb+(sortD===1?" ↑ 升序":" ↓ 降序")+"</span>"
    +" · 筛选："+chipsHtml();
  $("#pg").textContent="第 "+(pg+1)+" / "+tp+" 页";
  $("#pgin").value=pg+1;$("#pgin").max=tp;
  $("#prev").disabled=pg===0;$("#first").disabled=pg===0;
  $("#next").disabled=st+PAGE>=view.length;$("#last").disabled=st+PAGE>=view.length;
  if(!view.length){
    tb.innerHTML='<tr><td colspan="10" class="empty"><div>没有匹配的资费</div>'
      +diagEmpty()
      +'<div style="margin-top:10px"><a href="#" id="clr">重置全部筛选</a></div></td></tr>';
    const c=$("#clr");if(c)c.onclick=e=>{e.preventDefault();resetAll()};
    tb.querySelectorAll(".diagb").forEach(b=>{b.onclick=()=>removeCond(b.dataset.rm)});
    return;
  }
  slice.forEach(d=>{
    const agNew=BASE_OK?(ago(toDate(d.o))??9e9):9e9;
    const isNew=agNew>=0&&agNew<=30;
    const tr=document.createElement("tr");
    tr.className="row"+(isNew?" isnew":"")+(d.st?" stopped":"");
    /* 收藏关注用的稳定键（网 + 名称）。星标靠它记 ——
       不从 DOM 反推名称：名称单元格里还混着分类 / 变更 / 下架标签，反推不可靠。 */
    tr.dataset.k=NET+"|"+(d.n||d.t||"");
    /* 键盘可达：行展开原本只认 click，Tab 进不来、回车也没反应。
       tabindex=0 + Enter/Space → 与点击同一条路（调 click()，不复制逻辑）。 */
    tr.tabIndex=0;
    tr.title="点击展开详情 / 复制";
    tr.setAttribute("aria-expanded","false");
    tr.innerHTML='<td class="fee '+feeCls(d.f)+'">'+(d.f!==""&&d.f!=null?esc(d.f)+" 元":"—")+'</td>'
      +'<td>'+fmtGb(d.g)+perCell(d)+'</td>'
      +'<td>'+(d.c&&d.c!=="0"?esc(d.c)+" 分":"—")+'</td>'
      +'<td class="nm">'+scTag(d)+hl(d.n||d.t,terms)+chgTag(d)+stopTag(d)+vpTag(d)+'</td>'
      +'<td><span class="tg" title="资费大类；官方原始分类见展开详情">'+esc(d.cat||"—")+'</span></td>'
      +'<td>'+owTag(d)+'</td>'
      +'<td>'+bwCell(d)+'</td>'
      +'<td class="ap">'+esc((d.ap||"—").slice(0,90))+'</td>'
      +'<td style="white-space:nowrap">'+onCell(d)+'</td>'
      +'<td style="white-space:nowrap">'+offCell(d)+'</td>';
    const dr=document.createElement("tr");dr.className="det";
    dr.innerHTML='<td colspan="10"><div class="detwrap">'+detHTML(d)+'</div></td>';
    tr.onclick=()=>{
      const open=dr.classList.toggle("on");
      tr.classList.toggle("open",open);          // 行首箭头转向（CSS）
      tr.setAttribute("aria-expanded",open?"true":"false");
      /* 「同价位更优」按需计算（首次展开才算一次）：全表 9000 行扫一遍，
         80 行都预计算就是 72 万次比较/每次渲染 —— 而绝大多数详情根本没被展开过。 */
      if(open&&!dr.dataset.ai){
        const el=dr.querySelector(".aicmp"),line=dr.querySelector(".ailine");
        if(el&&line){
          const html=aiCompareHTML(d);
          if(html){el.innerHTML=html;line.style.display=""}
        }
        dr.dataset.ai="1";
      }
    };
    tr.onkeydown=ev=>{
      if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();tr.click()}
    };
    /* 复制按钮在**另一个 tr**（详情行）里，点它不会冒泡到上面那个 tr，
       所以不需要 stopPropagation；但它是独立元素，得自己绑事件。 */
    dr.querySelector(".cpbtn").onclick=()=>copyText(rowText(d));
    tb.appendChild(tr);tb.appendChild(dr);
  });
  decorateFav();
  zebrafy();
}
/* —— 唯一的一条筛选判据 ——
   apply() 用它筛结果，syncDims() 用它算「每个档位几条」。
   ★ 只有一份：任何「改了筛选却没改条数」的自相矛盾都不可能出现。
   ★ 两条保险丝（归属 / 板块）都走 dimOff：本网没有这一维 ⇒ 不筛，
     而不是拿一个不存在的取值去筛出「0 条」这种看着正常的假答案。
     （地市那一维 2026-10-03 起整个下线，不再是判据的一部分。） */
function match(d,c){
  const kw=c.kw,scv=c.sc,owv=c.ow,sbv=c.sb,cat=c.cat,
        ty=c.ty,pf=c.pf,gf=c.gf,
        cf=c.cf,bw=c.bw,chx=c.chx,
        on=c.on,off=c.offv,chg=c.chg;
  const owDimOff=c.dimOff.ow,sbDimOff=c.dimOff.sb;

    /* 「在售 / 已下架」页签先判 —— 它是这一页的**前提**，不是并列条件。
       d.st 为 1 表示已下架（由采集侧按各网判据写好，见 tariff_monitor.state_of）；
       缺失一律当在售。两页物理分开，在售页的排序与「本次变更」因此不含下架条目。
       ★ 判据读条件对象里的 sta（condOf 写入）而不是全局 STA：空结果诊断要算
         「摘掉状态页签能找回几条」—— 那是在 c.sta="" 下重算的反事实，
         判据若读全局变量，这个反事实永远算不出来。 */
    if(c.sta!==""&&(d.st?1:0)!==+c.sta)return false;
    /* 地域：d.sc 是构建期按**原始地域字段**算出的（hb 河北 / cn 全国），
       不是从名称文本猜的 —— 猜地名会让「名称没写地市」的条目全部漏判。
       注意：这是**省级**口径（河北 vs 全国），与条目的地市归属（d.cty）无关；
       后者自 2026-10-03 起只作展示，不参与筛选。 */
    if(scv&&d.sc!==scv)return false;
    /* 「本次变更」= 本次巡检**新增** 或 **关键字段有变更**的条目。
       下线/下架的条目不在这里 —— 它们已经不在本网数据里了。
       标注由构建脚本（build_html 的 diff）写进行数据，页面只负责读。 */
    if(chg&&!(d.ca||d.ck))return false;
    /* 类型两级：大类（四网统一口径）与细分（上游原始分类）。
       两者是「且」关系，但**不会互相打架** —— 选了大类之后，不属于它的细分项
       在 UI 上已经被置灰（见 syncDims），用户根本选不出
       「大类＝加装包 ＋ 细分＝5G套餐」这种必然为空的自相矛盾组合。 */
    /* 归属（个人 / 政企）：只有移动的条目带 d.ow。
       owDimOff 是保险丝 —— UI 上点不到隐藏项，但脚本 /
       深链仍可能把它设进来（实测可行），那时按它筛会给出「政企 0 条」这类
       看着正常、实则拿不存在的维度筛出来的假答案。无效筛选 = 不筛。 */
    if(owv&&!owDimOff&&d.ow!==owv)return false;
    /* 板块（上游 tariffAttr）：全国资费＝全国/跨省目录，本省资费＝河北本省目录。
       构建期只在本网该字段真有两档时才落盘 d.sect（见 ATTR_CN）；
       sbDimOff 是保险丝 —— 本网没有这一维时按它筛会给出「0 条」的假答案。 */
    if(sbv&&!sbDimOff&&d.sect!==sbv)return false;
    if(cat&&d.cat!==cat)return false;
    if(ty&&d.ty!==ty)return false;
    if(pf){
      const f=num(d.f);
      if(f==null||f<pf[0]||f>pf[1])return false;
    }
    /* 流量区间。「无流量」＝ 流量填 0 **或** 压根没填流量字段 ——
       后者在移动那网占全部条目的 34.8%（1326 条）。若把它们挡在「无流量」之外，
       用户点这一档会得到一份明显偏少的名单，而且看不出少了谁。 */
    if(gf){
      if(gf==="none"){
        if(!(d.g==null||d.g===0))return false;
      }else{
        if(d.g==null||d.g<gf[0]||d.g>gf[1])return false;
      }
    }
    if(cf){
      const cm=num(d.c);
      if(cf==="none"){
        if(!(cm==null||cm===0))return false;
      }else{
        if(cm==null||cm<cf[0]||cm>cf[1])return false;
      }
    }
    /* 渠道：上游原文已由构建脚本归一到三档（+其他）写在 d.chx 上，这里直接比对。
       按原文 ch 筛没有意义 —— 光移动一家就有 8 种写法表达同一件事。 */
    if(chx&&d.chx!==chx)return false;
    if(on){
      const dt=toDate(d.o);
      if(on==="none"){if(dt)return false}
      else{
        if(!BASE_OK||dt==null)return false;   // 缺基准日 ⇒ 不通过，绝不静默全通过
        const ag=ago(dt);
        if(ag<0||ag>+on)return false;
      }
    }
    if(off){
      const dt=toDate(d.e);
      if(!BASE_OK||dt==null)return false;
      /* 「N 天内下线/已下线」＝ 下线日落在基线前后 N 天内。
         🔴 早先只算 left>=0（还没下线的），「已下架」页签和「全部」页签里
         选这一档会**恒为 0 条** —— 已下线的条目 left 全是负数，全被挡掉。
         改成 |left|<=N：在售页签匹配「即将下线」，已下架页签匹配「刚下线」，
         「全部」页签两者都算 —— 文案与判据自此一致。 */
      const lf=left(dt);
      if(Math.abs(lf)>+off)return false;
    }
    if(bw==="line"&&!bwInfo(d))return false;
    /* 反向档：只想要纯流量 / 纯语音套餐的人此前没有任何入口 ——
       「不限宽带」是「不管」，不是「不含」。与 line 恰好互补且无缝（bwInfo 是
       单一判据，一条资费要么有线路要么没有，不存在第三态）。 */
    if(bw==="noline"&&bwInfo(d))return false;
    if(bw==="speed"&&!bwSpeed(d))return false;
    /* 速率档 m200 / m500 / m1000 —— 后缀数字就是要求的下行 Mbps。
       速率**未知**的一律不通过（fail-closed，与上架/下线时间筛选同一条原则）：
       「不知道多少兆」不能被当成「满足 500M」。 */
    if(bw&&bw.charAt(0)==="m"){
      const mb=bwMbps(d);
      if(mb==null||mb<+bw.slice(1))return false;
    }
    if(kw){
      /* 搜索覆盖面：名称 / 套餐名 / 目标客户 / 渠道 / 报备编号 / 细分类型 / **大类** / 渠道档 /
         权益 / 宽带 / 超套 / 有效期。
         加 d.cat 是刻意的：搜「加装包」应当命中原分类写作「流量包」「语音包」的条目 ——
         大类是用户心里的词，细分是上游的词，搜索该按用户那套来。
         特意不含月费与流量数值：它们已有专门的筛选与排序，混进来只会让搜「50」全是噪音。
         🔴 拼接串缓存进行对象（_kws）：行数据是构建期常量，这串每个字都不变；
            不缓存的话 1.4 万行 × 每次输入重建一遍，纯属浪费（2026-10-02 审查项）。
         ★ 空格分词 AND（2026-10-03）：整串 includes 时搜「宽带 千兆」命中 0 条 ——
           字段拼接顺序里两个词隔着几十个字。按空格拆成多词、要求**全部**命中，
           与主流电商/文档站的搜索直觉一致。词序无关、重复词无害。 */
      let s=d._kws;
      if(s==null){s=[d.n,d.t,d.ap,d.ch,d.r,d.ty,d.cat,d.chx,d.x,d.bw,d.ex,d.vp]
                .join(" ").toLowerCase();d._kws=s}
      for(let i=0;i<kw.length;i++){
        if(s.indexOf(kw[i])<0)return false;
      }
    }
    return true;
}

function apply(){
  /* 基线随网走：放在 apply() 开头而不是只放在 switchNet() 里，是为了让
     「直接带 hash 进来」「hashchange」这些旁路也一定先重算过 ——
     少调一次的后果是**静默**按错网的基线算天数，比报错难发现得多。 */
  setBase();
  /* 大类 → 细分的联动也放在这里，理由与 setBase() 完全一样：
     **程序化设值不会触发 onchange**（深链 #cat=…、脚本、恢复状态都属此类），
     只有 apply() 是所有路径的必经之处。实测踩过：只在 #cat 的 onchange 里调，
     脚本设完 cat 后「加装包」等细分项照样可点 ⇒ 能选出「套餐 ＋ 加装包」
     这种不存在的组合，页面安静地给出 0 条。
     ★ 必须在下面读 ty 的值**之前**跑 —— 它可能把已被置灰的那个细分清掉。 */
  syncDims();
  /* 快捷 chip 高亮跟维度值对齐：深链 / 标签 × / 切网清空都改值而不经过 chips 点击，
     每轮 apply 都重推一次选中态，chip 就永远不会「亮着、条件却不在」。 */
  syncChips();
  /* 折叠开关上的徽标：生效条件数（含关键词与状态页签） */
  updateFbadge();
  /* 警告条在这里统一求值（而不是挂在 renderNet() 上）：renderNet 只在「换了网」
     时才跑，任何「base 坏了但没换网」的路径都会留下一份与数据不符的旧状态。
     放在未接入短路**之前**，还顺带保证切到未接入的网时警告条一定会被收起。 */
  renderBaseWarn();
  /* 未接入的网没有任何数据可筛，直接短路 —— 否则会给出一堆 0 条的
     「正常」统计，看着像筛选把数据全滤掉了。 */
  if(!online(NET)){view=[];renderEmptyState();syncHash();return}
  renderEmptyState();
  /* 条件一次读成对象（见 condOf 上的注释）：判据与「档位条数」共用同一份 ——
     apply() 里不再把各维度解成局部变量，省掉「改了筛选没改条数」的可能。 */
  const c=condOf();
  view=rowsOf(NET).filter(d=>match(d,c));
  sortView();
  /* 页码：筛选变了就回第 1 页（新结果集里旧页码毫无意义）；
     唯一例外是深链 #p=N 带进来的 _pgNext —— 那是「恢复现场」不是「新筛选」。
     clamp 到结果集的实际页数：数据更新后页数可能缩水，越界页码自愈到最后一页。 */
  if(_pgNext!=null){
    pg=Math.min(Math.max(0,_pgNext),Math.max(0,Math.ceil(view.length/PAGE)-1));
    _pgNext=null;
  }else pg=0;
  render();markHead();syncHash();
}

function markHead(){
  document.querySelectorAll("th[data-k]").forEach(th=>{
    const on=th.dataset.k===sortK;
    th.classList.toggle("act",on);
    const ar=th.querySelector(".ar");
    if(ar)ar.textContent=on?(sortD===1?"▲":"▼"):"⇅";
  });
  $("#dir").textContent=sortD===1?"↑":"↓";
  $("#dir").title="当前："+(sortD===1?"升序":"降序")+"，点击切"+ (sortD===1?"降序":"升序");
}

/* —— 页签同步（在售 / 已下架 / 全部）——
   把 STA 反映到 UI，并带上级内条数（不带条数就看不出这一页有多少东西）。
   ★ 不给「本网根本拿不到」的维度提供入口：移动那网的明细接口恒返回 0 条下架数据，
     若照旧让「已下架」可点，用户点进去看到 0 条会以为「河北移动没有下架资费」——
     那是拿一个取不到的维度在问，答案没有意义。与 renderDims 对「地域」置灰的处理一致：
     置灰 + 写明原因，而不是给一个能点却答非所问的按钮。 */
const ST_LB={"0":"在售","1":"已下架","":"全部"};
function syncTabs(){
  const rs=rowsOf(NET),hasStop=rs.some(d=>d.st);
  if(STA==="1"&&!hasStop)STA="0";
  document.querySelectorAll("#tabs button").forEach(b=>{
    const v=b.dataset.v,n=(v==="")?rs.length:rs.filter(d=>((d.st?1:0)===+v)).length;
    b.disabled=(v==="1"&&!hasStop);
    b.title=b.disabled?"本网暂无下架资费数据":"";
    b.classList.toggle("on",v===STA);
    b.textContent=ST_LB[v]+"（"+n+"）";
  });
}

function syncHash(){
  const p=new URLSearchParams();
  /* net 无条件写入（它不是「空值就省略」的筛选条件）：地址栏里没有 net
     时默认网由 NET_DEF 决定，而 NET_DEF 会随「哪网有数据」变化 ——
     显式写出 net，分享出去的链接才会一直指向同一网。 */
  const m={net:NET,st:STA,kw:$("#kw").value.trim(),s:sortK,d:sortD};
  /* 页码进深链：翻到几十页再刷新/分享，落回来的还是那一页。
     第 1 页不写（保持无参链接干净）；apply → syncHash 与翻页路径都会走到这里。 */
  if(pg>0)m.p=pg+1;
  /* 页签也进深链（但「资费明细」是默认值、不写）—— 分享「总览」或「变化历史」
     时，收链接的人应该直接落在同一屏，而不是又回到明细表。 */
  if(VIEW!=="list")m.v=VIEW;
  /* 枚举型维度统一从 DIMS 取 —— 加维度时不用回来改这里（漏改＝新维度分享不出去） */
  DIMS.forEach(k=>{const e=$("#"+k);if(e)m[k]=e.value});
  for(const k in m)if(m[k]!== ""&&m[k]!=null)p.set(k,m[k]);
  const h=p.toString(),base=location.href.split("#")[0];
  if(location.hash.slice(1)!==h){
    /* try 是必需的：把页面「另存为」成单文件、再从 file:// 打开时，
       文档 origin 是 null，部分浏览器会对 replaceState 抛 SecurityError。
       那不该让整页崩掉 —— 地址栏不同步只是少了可分享链接，功能照常。 */
    try{history.replaceState(null,"",h?base+"#"+h:base)}catch(e){}
  }
}
function readHash(){
  if(!location.hash)return;
  const p=new URLSearchParams(location.hash.slice(1));
  /* net 必须**最先**处理：类型下拉是按网重建的，先设 ty 会设到一个此刻
     还不存在的 option 上（select.value 静默失败）⇒ 之后按空值过滤，
     表面看是「筛选没生效」，实际是网还没切。 */
  const nn=p.get("net");
  if(nn&&NETS[nn]&&nn!==NET){
    NET=nn;
    $("#kw").value="";clearDims();
    clearChips();
    renderNav();renderNet();
  }
  $("#kw").value=p.get("kw")||"";
  /* 枚举型参数先与**实际存在的 option** 核对再写入。
     不核对的话，页面不认识的取值（手改地址栏 / 旧链接 / 上游改了选项集）
     会让 select.value 静默失败：下拉停在「全部」，代码却在按那个幽灵值过滤
     —— 控件与结果对不上且不报错。认不出来就当这个参数没传，
     三者随即恢复一致（syncHash 会把非法参数从地址栏里抹掉，链接自愈）。 */
  DIMS.forEach(k=>{
    const v=p.get(k),sel=$("#"+k);
    if(!sel)return;
    /* ★ 还得看这个取值在本网「存不存在」—— 见 renderDims()：
       某网若没有这个维度，对应控件会被**隐藏**（归属：只有移动的官方接口带这个字段）
       或 option 被置灰（地域：本网取不到的那一档）。
       不查的话，地址栏里带着别网的取值进来（#net=cbn&ow=政企）会被照单全收，
       筛选随即恒为空 —— 而链接看起来完全正常、不报任何错。 */
    if(v!=null&&sel.style.display!=="none"
       &&[...sel.options].some(o=>o.value===v&&!o.disabled))sel.value=v;
    /* ★ 大类必须先于细分处理（DIMS 里 cat 就排在 ty 前面），且设完立刻同步置灰：
       否则链接里带 #cat=加装包&ty=5G套餐 会被照单全收 —— 那是个不存在的组合，
       页面会安静地给出 0 条。 */
    if(k==="cat")syncDims();
  });
  /* 页签（st）不是 select，单独校验：只认 ""/0/1，其余当没传。
     同「枚举参数先核对」的道理 —— 认不出来就退回默认，而不是把一个
     幽灵值喂进筛选（那样会稳定筛出 0 条且不报错）。 */
  const sv=p.get("st");
  STA=(sv==="0"||sv==="1")?sv:"";
  syncTabs();
  const s=p.get("s");if(s&&F[s])sortK=s;
  const d=p.get("d");if(d==="1"||d==="-1")sortD=+d;
  /* 页码：只认正整数，认不出来当没传；越界由 apply() 消费时 clamp。
     写进 _pgNext 旁路而不直接改 pg —— apply() 对新筛选一律回第 1 页，
     深链恢复必须绕过那条默认路（见 _pgNext 声明处的注释）。 */
  const pv=parseInt(p.get("p"),10);
  if(pv>=1)_pgNext=pv-1;
  $("#sort").value=sortK;
  /* 页签：只认白名单里的四个值，认不出来就当没传（同「枚举参数先核对」的原则）。 */
  const vv=p.get("v");
  if(vv&&["ov","list","hist"].indexOf(vv)>=0)setView(vv);
}

/* —— 网别导航 —— */
function renderNav(){
  const nav=$("#netnav");
  nav.innerHTML='<div class="netnav-in"></div>';
  const inn=nav.firstChild;
  NET_LS.forEach(c=>{
    const n=NETS[c]||{},has=online(c);
    const b=document.createElement("button");
    b.type="button";
    b.className="netbtn"+(c===NET?" on":"");
    b.innerHTML="<span>"+esc(n.nm||c)+"</span>"
      +(has?'<span class="nc">'+rowsOf(c).length+" 条</span>"
           :'<span class="nb">未接入</span>');
    b.onclick=()=>switchNet(c);
    inn.appendChild(b);
  });
}

/* —— 切网 ——
   换网清空全部筛选（保留排序键）：类型选项是**按网生成**的，上个网选中的类型
   在新网的下拉里根本不存在 —— 留着 value 会出现「下拉显示『全部类型』、
   实际却按一个幽灵值过滤」的静默错。关键字同理，包名不跨网通用。 */
function switchNet(c){
  if(!NETS[c])return;
  if(c!==NET){
    NET=c;
    $("#kw").value="";clearDims();
    clearChips();
  }
  /* 点当前网也照常走一遍刷新（但**不清筛选**，所以是幂等的）：
     别在这里提前 return —— 少刷一次的后果是页面上留着与数据不符的旧标题/旧下拉，
     而且完全不报错。 */
  renderNav();setBase();renderNet();apply();
}

/* 按当前网刷新品牌位：有官方标志 → 浅色底板 + 标志；没有（将来新增的网）→
   退回原来的「首字」渐变块，不出现空白。 */
function setLogo(){
  const el=$("#logo"),mk=NET_LOGO[NET];
  if(mk){el.classList.add("mk");el.innerHTML=mk;}
  else{el.classList.remove("mk");el.textContent=(net().sh||"").slice(0,1);}
}

/* —— 按当前网刷新：标题 / 来源 / 类型下拉 / 基线警告 ——
   setBase() 放在本函数开头（而不是靠调用方记得先调），renderNet 才总是自洽的。 */
function renderNet(){
  setBase();
  const n=net(),rs=rowsOf(NET),has=online(NET),name="河北"+(n.sh||"");
  $("#h1").textContent=name+" · 资费全量目录";
  document.title=name+"资费全量查询"+(has?"（"+rs.length+" 条）":"");
  /* 主题色跟着当前网走：文档级属性一变，所有 --op* 变量同时切到那家的色板。 */
  document.documentElement.setAttribute("data-net",NET);
  /* 横栏统计。切网时必须整行重算 —— 只改标题不改这里，横栏会一直挂着
     上一家的数字，且**完全不报错**（看着像「页面没刷新」，实际是漏了一处）。 */
  const nStop=rs.filter(d=>d.st).length,nChg=rs.filter(d=>d.ca||d.ck).length;
  setLogo();
  $("#navCnt").textContent=has?String(rs.length-nStop):"—";
  $("#navStop").textContent=has?String(nStop):"—";
  $("#navChg").textContent=has?String(nChg):"—";
  $("#updTxt").textContent=has?("更新于 "+(n.ts||n.base||"—")):"本网数据尚未接入";
  /* 分档条数写进副标题：只报一个总数看不出「河北有几条 / 全国有几条」，
     而地域筛选正需要这两档的规模才读得懂。
     2026-10-03 起不再附报「地市专属 / 不限地市」—— 地市已不作筛选维度，
     在副标题里报一份用不上的分布只会让人去找那个已经不存在的地市下拉。 */
  let scTxt="";
  if(has){
    const cnt={};rs.forEach(d=>{cnt[d.sc]=(cnt[d.sc]||0)+1});
    scTxt=["hb","cn"].filter(k=>cnt[k])
          .map(k=>SC_LB[k]+" "+cnt[k]).join(" · ");
  }
  $("#sub").innerHTML=has
    ?"来源："+esc(n.src||"—")+" · 数据基线 "+esc(n.base||"—")+" · 共 "+rs.length+" 条"
      +(scTxt?"（"+scTxt+"）":"")
    :"来源：待接入";
  /* —— 类型两级：先建大类，再建细分 ——
     · 大类按 CAT_ORDER 的**固定顺序**生成（不是按条数或拼音）：顺序稳定，
       逐日看的时候才知道「今天冒出来的是哪一类」。
     · 本网没有的大类不给入口 —— 与「地域」本网没有的那一档就置灰同一条原则。
     · 细分项把所属大类记在 data-cat 上，供 syncDims() 做联动置灰。
       顺便把**条数**写进选项文本：用户问的就是「有哪些套餐、加装包」，
       先看到规模再决定要不要展开；筛选标签里会把「（数字）」削掉（见 optText）。 */
  /* 这里的条数是**本网全量**（不随筛选变），只用于「本网有没有这一档」；
     随筛选联动的条数由 syncDims() 用 match() 重写（同一判据，不会打架）。 */
  const cCnt={},tCnt={},tCat={};
  rs.forEach(d=>{
    cCnt[d.cat]=(cCnt[d.cat]||0)+1;
    tCnt[d.ty]=(tCnt[d.ty]||0)+1;
    if(!(d.ty in tCat))tCat[d.ty]=d.cat;
  });
  const cat=$("#cat");
  cat.innerHTML='<option value="">全部大类</option>';
  CAT_ORDER.filter(c=>cCnt[c]).forEach(c=>{
    const o=document.createElement("option");
    o.value=c;o.textContent=c+"（"+cCnt[c]+"）";
    cat.appendChild(o);
  });
  const ty=$("#ty");
  ty.innerHTML='<option value="">全部细分</option>';
  Object.keys(tCnt).filter(Boolean).sort().forEach(t=>{
    const o=document.createElement("option");
    o.value=t;o.textContent=t+"（"+tCnt[t]+"）";
    o.dataset.cat=tCat[t]||"";
    ty.appendChild(o);
  });
  /* 建完就同步一次：切网时大类被清空，细分的置灰状态必须跟着复原，
     否则会留着上个网的置灰格局（那时 ty 已被 clearDims 清空，看不出异样，
     但要等用户重新选一次大类才发现有些项点不了）。 */
  syncDims();
  /* 「本次变更」条数随网、随日变化 —— 标签带上条数才看得出有没有东西可看。
     本网当天无变更时把快捷 chip 收起来；选单保留：万一地址栏带着 chg=1 进来，
     状态仍然可见、语义仍一致（会筛出 0 条），而不是被悄悄抹掉。 */
  const nch=rs.filter(d=>d.ca||d.ck).length;
  const oc=$("#chg").options[1];
  if(oc)oc.textContent=nch?("本次变更（"+nch+" 条）"):"本次变更（本网无）";
  const cc=document.getElementById("chipchg");
  if(cc)cc.style.display=nch?"":"none";
  /* —— 归属下拉：按本网**实际出现的取值**建，并带条数 ——
     与地域「本网没有的那档置灰」同一条原则：不给不存在的取值留选项，
     否则用户选了会拿到 0 条，而那不是「本网没有政企资费」，是问了个不存在的值。 */
  const owc={};rs.forEach(d=>{if(d.ow)owc[d.ow]=(owc[d.ow]||0)+1});
  const owSel=$("#ow");
  owSel.innerHTML='<option value="">全部</option>';
  OW_ORDER.filter(o=>owc[o]).forEach(o=>{
    const op=document.createElement("option");
    op.value=o;op.textContent=o+"（"+owc[o]+"）";
    owSel.appendChild(op);
  });
  syncTabs();
  renderDims();
  /* 切网会增删「归属」下拉（只有移动的官方接口带这个字段），筛选栏因此高低不同
     —— 常驻偏移必须跟着重量，否则表头会钉在错的位置、或者被筛选栏盖住。
     放在 renderDims() **之后**：此刻 #ow 的显隐已经定下来了。 */
  fixBarh();
  /* 总览与本页共用同一份行数据，切网时它也得跟着刷 —— 放在这里而不是
     只在「切到总览页签」时算，是为了让两个页签的数字**永远同源**。 */
  renderOverview();
}

/* —— 地市维度已于 2026-10-03 整体下线 ——
   原先这里有三块：buildCtOptions()（按注入清单建下拉）、syncCtAvail()（可用状态与
   提示文案）、以及 renderDims() 里那一段「建选项 + 置灰 + 显隐」。
   整块删掉的理由不是「功能没用」，而是**它维护的成本落在了判据上**：
   地市口径改过两次（2026-09-24 的「不限地市 + 该市专属」），每次都要同步
   match() / 建选项 / 置灰 / 副标题 / 分布图 五处，任一处漏掉就出现
   「选项写着 0 条却点得动」这类自相矛盾。
   数据侧一个字没动：d.cty / d.pw 照旧写在行数据里，CI 也照旧断言它们的完备性，
   所以哪天要恢复，只需把这一段与两个占位符加回来。 */

function renderDims(){
  const rs=rowsOf(NET);
  /* —— 地域（#sc）：本网没有的那一档不给选 ——
     判据用**实际条数**而不是硬编码哪网有哪档：上游哪天补了数据，这里自动放开。 */
  const sc=$("#sc");
  if(sc){
    [...sc.options].forEach(o=>{
      if(!o.value){o.disabled=false;return}
      o.disabled=!rs.some(d=>d.sc===o.value);
    });
    const cs=sc.selectedOptions[0];
    if(cs&&cs.disabled)sc.value="";
    sc.title="地域范围：河北省 / 全国（本网没有的那一档会置灰）";
  }
  /* —— 板块（#sb：全国资费 / 本省资费）——
     判据 = 本网真有**两档以上**才给入口（构建期按同一判据决定是否落盘 d.sect，
     见 tariff_monitor.ATTR_CN）：只有一个取值时这一格没有任何信息量，
     留着只会让人以为「还有一半没显示」。 */
  const sbSel=$("#sb"),wsb=$("#wsb");
  if(sbSel){
    const secs={};rs.forEach(d=>{if(d.sect)secs[d.sect]=1});
    const hasSb=Object.keys(secs).length>=2;
    /* 整格（含标签）一起收 —— 只藏 select 会剩一个孤零零的「板块」字样。
       ★ select **本身也要置 display:none**：readHash / condOf / clearDims 都以
       「控件是否隐藏」判「这一维在本网存不存在」，只藏外层标签的话它们会把
       隐藏的板块维度当真，去筛一个本网没有的取值 ⇒ 静默 0 条。 */
    sbSel.style.display=hasSb?"":"none";
    if(wsb)wsb.style.display=hasSb?"":"none";
    if(!hasSb)sbSel.value="";      // 切网时把别网带过来的值清掉，否则筛选恒空
    sbSel.title=hasSb
      ?"板块：全国资费＝全国/跨省目录，本省资费＝河北本省目录（0 条的档置灰）"
      :"本网官方页面只有一个板块，该维度不提供";
    [...sbSel.options].forEach(o=>{
      if(!o.value){o.disabled=false;return}
      o.disabled=!rs.some(d=>d.sect===o.value);
    });
    const bs=sbSel.selectedOptions[0];
    if(bs&&bs.disabled)sbSel.value="";
  }
  /* —— 归属（个人 / 政企）：本网**实际有数据**才给入口 ——
     判据用数据而不是硬编码「只有移动有」：上游哪天给别的网补了这个字段，
     这里自动放开，不必回来改代码。联通/电信/广电实测条目里连 type1 键都没有。 */
  const owSel=$("#ow");
  if(owSel){
    const hasOw=rs.some(d=>d.ow);
    owSel.style.display=hasOw?"":"none";
    const wow=$("#wow");if(wow)wow.style.display=hasOw?"":"none";   // 连「资费归属」整行一起收
    if(!hasOw)owSel.value="";   // 切网时把别网带过来的归属值清掉，否则筛选恒空
    owSel.title=hasOw?"归属：个人资费 / 政企资费（官方标注）"
      :"本网官方页面没有「归属」分类，该维度不提供";
  }
  /* 切网后主轴页签要跟着本网重出（#ow 的选项刚刚在 renderNet 里重建过）。
     正常路径上 apply() 还会再刷一次（那时已带上条数），这里是为「本网无数据、
     syncDims 提前返回」那条分支兜底 —— 否则页签会留着上一个网的取值。 */
  syncAxis();
}

function renderBaseWarn(){
  const w=$("#basewarn");
  if(BASE_OK||!online(NET)){w.style.display="none";w.textContent="";return}
  w.style.display="";

    +"以免给出看似正常的错误结果。";
}

/* —— 未接入占位 ——
   已接入：确保工具栏 / 统计行 / 表格 / 分页器可见，并移除占位块。
   未接入：把它们整个藏起来 —— 给一个能点却点不出东西的工具栏，用户只会
   怀疑页面坏了；直接说明「尚未接入」更诚实。
   ★ 用 _emptyFor 记住当前渲染给哪个网：apply() 每次都会调到这里，
     不加这道闸就是每次筛选都重建一遍 DOM。 */
let _emptyFor=null;      // 空态当前渲染给哪个网（"" = 已接入 / 非空态）
function renderEmptyState(){
  const has=online(NET),key=has?"":NET;
  if(key===_emptyFor)return;
  _emptyFor=key;
  const pager=document.querySelector(".pager"),tbl=document.querySelector("table");
  $("#bar").style.display=has?"":"none";
  $("#stat").style.display=has?"":"none";
  tbl.style.display=has?"":"none";
  pager.style.display=has?"":"none";
  /* 不只是藏起来，内容也清掉：藏着的旧统计行 / 旧表格行会留在 DOM 里，
     于是「看不见」和「没有」变成两件事 —— 之后任何读 #stat / #tb 的代码
     （包括体检脚本）都可能拿到上一个网的残留值。 */
  if(!has){$("#stat").innerHTML="";$("#pg").textContent="";$("#tb").innerHTML=""}
  let ph=document.getElementById("netempty");
  if(has){if(ph)ph.remove();fixBarh();return}
  if(!ph){
    ph=document.createElement("div");ph.id="netempty";ph.className="netempty";
    pager.parentNode.insertBefore(ph,pager);
  }
  const n=net();
  ph.innerHTML="<h2>"+esc(n.nm||NET)+" · 资费数据尚未接入</h2>"
    +"<p>该运营商的资费数据暂未采集到，先看看其它三网。</p>";
  fixBarh();
}

function clearChips(){document.querySelectorAll("#chips button").forEach(b=>b.classList.remove("on"))}

     只清下拉会留下「点了重置、结果还是少一截」的迷惑；空结果页那个
     「重置全部筛选」链接尤其要兑现「全部」二字。排序键也一并回默认。 */
  if(STA!==""){STA="";syncTabs()}

/* —— 单条资费的纯文本摘要 ——
   复制出去是要粘到聊天 / 文档里的，所以纯文本、一行一字段、不带任何 HTML。 */
function rowText(d){
  const bi=bwInfo(d),mb=bwMbps(d);
  return [
    (d.n||d.t||"").trim(),
    "类型："+(d.cat||"—")+(d.ty&&d.ty!==d.cat?" / "+d.ty:""),
    (d.ow?"归属："+d.ow:""),
    "月费："+(d.f!==""&&d.f!=null?d.f+" 元":"—"),
    "流量："+fmtGb(d.g),
    "通话："+(d.c&&d.c!=="0"?d.c+" 分钟":"—"),
    "地域："+(SC_LB[d.sc]||"—")+(cityTags(d).length?"（"+cityTags(d).join("/")+"）":""),
    "状态："+(d.st?"已下架":"在售"),
    "宽带："+(bi?(mb?mb+"M":"含宽带"):"—"),
    "渠道："+(d.chx||"—")+(d.ch?"（"+d.ch+"）":""),
    "上架："+(fmtD(d.o)||"—")+"  下线："+(fmtD(d.e)||"—"),
    "报备编号："+(d.r||"—"),
    "数据基线："+String(net().base||"—")+"（来源 "+String(net().src||"—")+"）"
  ].join("\n");
}

/* —— 复制到剪贴板 ——
   ⚠️ navigator.clipboard 需要 secure context，而本页的**主要用法之一**就是
   另存成单文件再从 file:// 打开（见 saveOffline）。那条路上它不一定可用，
   所以 execCommand 那条老路在这儿不是「兜底」，是并列的主路径 —— 必须实现。 */
let _toastQ=null;
function toast(msg){
  let el=document.getElementById("toast");
  if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el)}
  el.textContent=msg;el.classList.add("on");
  clearTimeout(_toastQ);
  _toastQ=setTimeout(()=>el.classList.remove("on"),1800);
}
function legacyCopy(s){
  const t=document.createElement("textarea");
  t.value=s;t.setAttribute("readonly","");
  t.style.cssText="position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(t);t.select();
  let ok=false;
  try{ok=document.execCommand("copy")}catch(e){ok=false}
  t.remove();
  return ok;
}
function copyText(s){
  const done=ok=>toast(ok?"已复制":"复制失败：浏览器不允许，请手动选中复制");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(()=>done(true),()=>done(legacyCopy(s)));
  }else{
    done(legacyCopy(s));
  }
}

/* —— 导出 CSV ——
   导的是 **view**（当前筛选 + 排序之后的全部结果），不是当前这一页：
   否则 49 页就得点 49 次。 */
const CSV_COLS=[
  ["地域",d=>SC_LB[d.sc]||""],["状态",d=>d.st?"已下架":"在售"],["归属",d=>d.ow||""],
  ["月费(元)",d=>d.f],["流量(GB)",d=>d.g],["流量原文",d=>d.d],["流量单位",d=>d.du],
  ["每元流量(GB)",d=>{const v=perVal(d);return v==null?"":(v===Infinity?"∞":+v.toFixed(3))}],
  ["通话(分)",d=>d.c],["名称",d=>d.n],["套餐名",d=>d.t],
  /* 大类在前、细分在后：大类是四网可比的横轴，细分是上游各自的说法。
     两个都留着 —— 只给大类会丢掉「流量包还是语音包」这种关键差别。 */
  ["类型大类",d=>d.cat],["类型细分",d=>d.ty],
  ["宽带字段",d=>d.bw],
  ["宽带判定",d=>{const i=bwInfo(d);return i?"含宽带":"不含宽带"}],
  ["城市",d=>cityTags(d).join("/")],["目标客户",d=>d.ap],
  ["渠道档",d=>d.chx],["办理渠道原文",d=>d.ch],
  ["报备编号",d=>d.r],["上架日",d=>fmtD(d.o)],["下线日",d=>fmtD(d.e)],
  ["本次变更",d=>(d.ca?"新增":"")+(d.ca&&d.ck?"/":"")+(d.ck?"字段变更":"")],
  ["超套资费",d=>d.ex],["有效期",d=>d.vp],["权益说明",d=>d.x]];
/* 换行、逗号、引号都要按 RFC4180 处理：正文里这几种字符都有可能出现
   （权益说明尤其），不转义就会把一行拆成好几行、整张表错位。 */
function csvCell(v){
  const s=String(v==null?"":v).replace(/\r?\n/g," ");
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function download(name,text,mime){
  const blob=new Blob([text],{type:mime});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  /* 立刻 revoke 会在部分浏览器里把还没写完的下载掐掉，留一点余量。 */
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function exportCSV(){
  /* 「只看收藏」是 DOM 层显隐、不在 view 里 —— 导出若无视它，用户看着
     几条收藏、导出的却是全量筛选结果，口径就劈了。按同一口径过滤；
     收藏键与表格行的 dataset.k 同一构造（NET|名称）。 */
  const rows=onlyFav?view.filter(d=>fav[NET+"|"+(d.n||d.t||"")]):view;
  const L=[CSV_COLS.map(c=>csvCell(c[0])).join(",")];
  rows.forEach(d=>L.push(CSV_COLS.map(c=>csvCell(c[1](d))).join(",")));
  /* BOM 不能省：不加的话 Excel 会按本地代码页解读 UTF-8，中文全是乱码。
     文件名用「数据基线日期」而不是当前时刻 —— 同一份数据导两次得到同一个
     文件名，不会堆出一堆看着不同、其实一样的副本。 */
  download("河北"+(net().sh||"")+"资费_"+(net().base||"")+".csv",
           "\ufeff"+L.join("\r\n"),"text/csv;charset=utf-8");
}
/* —— 另存为单文件离线副本 ——
   NETS 是构建时写进页面的真实数据，outerHTML 里自然带着它，
   所以存下来的这份不联网、不起服务也能直接打开。 */
function saveOffline(){
  download("河北四网资费查询_"+(net().base||"")+".html",
           "<!DOCTYPE html>\n"+document.documentElement.outerHTML,
           "text/html;charset=utf-8");
}


/* ══════════════════════════════════════════════════════════════════════
   视图页签（数据总览 / 资费明细 / 变化历史）
   ★ 默认「资费明细」：打开页面即见按上架时间倒序的最新资费清单。
   ★ 只切显示，不碰筛选状态 —— 页签是「看哪一块」，不是筛选条件。
     切回明细页时筛选原样还在，用户不会因为看了一眼总览就丢掉筛选。
   ══════════════════════════════════════════════════════════════════════ */
let VIEW="list";
const VIEWS=["ov","list","hist"];
function setView(v){
  if(VIEWS.indexOf(v)<0)v="list";
  VIEW=v;
  /* 工具条 #bar 住在 #deck 里（必须与 #vtab 同盒），
     而吸顶层不能被 .view 的 display 控制 —— 所以显隐改由这里声明的
     body[data-view] 驱动（CSS 里 `body[data-view="list"] .bar{display:block}`）。
     setView 是唯一的视图切换入口，写在这里就不用担心漏掉某条切换路径。 */
  document.body.dataset.view=v;
  document.querySelectorAll("#vtab .tab").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  VIEWS.forEach(k=>{
    const s=document.getElementById("v-"+k);
    if(s)s.classList.toggle("on",k===v);
  });
  /* 切回明细页要**重新量**工具条高度：在别的页签里它是 display:none、
     量出来是 0，不重量就会把粘性表头钉到错的位置（滚动时才看得出来）。
     ★ 同步调用，**不要**包 requestAnimationFrame：rAF 在窗口不在前台时会被
     节流甚至完全不执行（实测：CDP 后台窗口里 --barh 一直是 0，
     表头钉在 46px、正好被筛选栏压住）。classList.toggle 之后读 offsetHeight
     会强制一次同步布局，拿到的一定是新值。 */
  fixBarh();
  if(v==="ov")renderOverview();
  if(v==="hist")renderHistory();
}

/* ══════════════════════════════════════════════════════════════════════
   数据总览
   ★ 所有数字都从**行数据现算**，不复用构建期统计：两者必须同源，
     否则一旦出现「总览说 3887、明细说 3883」这种不一致，整页的可信度就没了。
   ══════════════════════════════════════════════════════════════════════ */
function ovBar(label,val,max,note){
  const pct=max>0?Math.round(val*100/max):0;
  const w=max>0?(val>0?Math.max(pct,1):0):0;
  return '<div class="brow"><div class="blab"'+(note?' title="'+esc(note)+'"':"")+'>'+esc(label)+'</div>'
    +'<div class="btrack"><div class="bfill" style="width:'+w+'%"></div>'
    +(val?'<span class="bpct">'+pct+'%</span>':"")+'</div>'
    +'<div class="bval">'+val+'</div></div>';
}
/* 一组 {名称: 条数} → 横条图。按**给定顺序**而不是按条数排：
   顺序稳定才能逐日比对（今天冒出来的是哪一类，一眼可见）。
   🔴 第 4 参允许**两种形态**：函数 ⇒ 逐条取备注；字符串 ⇒ 整组共用一条备注。
   早先只按「函数」写，而月费/上架时间两个调用点传的是字符串 —— 字符串是 truthy，
   于是被当函数调用，抛 TypeError 把 renderOverview() 整个中断：页面框架看着都在、
   总览页却全空，控制台之外毫无迹象（典型的静默失效）。 */
function ovBars(el,order,obj,note){
  const max=Math.max.apply(null,order.map(k=>obj[k]||0).concat([0]));
  const nf=typeof note==="function"?note:(note==null?()=>"":()=>note);
  el.innerHTML=order.filter(k=>obj[k]).map(k=>ovBar(k,obj[k],max,nf(k))).join("")
    || '<div class="mut">本网无此类数据</div>';
}
/* 上次 renderOverview 的输入签名：同网且行数组同一引用 ⇒ 结果必然不变，
   直接跳过 —— 否则每敲一个搜索键都要为它多付约 10 趟全表过滤（2026-10-02 审查项）。
   行数据是构建期常量、运行期无任何写路径，引用比对足够可靠。 */
let _ovNet=null,_ovRows=null;
function renderOverview(){
  const rs=rowsOf(NET),has=online(NET);
  if(_ovNet===NET&&_ovRows===rs)return;
  _ovNet=NET;_ovRows=rs;
  if(!has){
    $("#ovStats").innerHTML='<div class="stat k"><div class="si">⏳</div>'
      +'<div class="sn">—</div><div class="sl">本网数据尚未接入</div></div>';
    ["ovCat","ovSc","ovOw","ovFee","ovAge"].forEach(k=>{
      const e=document.getElementById(k);if(e)e.innerHTML="";
    });
    return;
  }
  const live=rs.filter(d=>!d.st);
  /* ── KPI 卡 ── */
  const gq=rs.filter(d=>d.ow==="政企").length;
  const k=[];
  k.push(["🗂️","在架资费",live.length,"本网当前在售 + 未标下架的全部条目"]);
  k.push(["📍","河北",live.filter(d=>d.sc==="hb").length,"适用地域为河北省"]);
  k.push(["🌐","全国",live.filter(d=>d.sc==="cn").length,"适用地域为全国"]);
  if(rs.some(d=>d.ow))k.push(["🏢","政企资费",gq,"官方标注为「政企」的条目（仅移动提供归属分类）"]);
  k.push(["📴","已下架",rs.filter(d=>d.st).length,"本网判据下已停售/下线的条目"]);
  k.push(["🔄","本次变更",rs.filter(d=>d.ca||d.ck).length,"本次巡检新增或关键字段有变动的条目"]);
  $("#ovStats").innerHTML=k.map(x=>
    '<div class="stat k" title="'+esc(x[3])+'"><div class="si">'+x[0]+'</div>'
    +'<div class="sn">'+x[2]+'</div><div class="sl">'+esc(x[1])+'</div></div>').join("");

  /* ── 分类构成 ── */
  const cat={};rs.forEach(d=>{const c=d.cat||"其他";cat[c]=(cat[c]||0)+1});
  $("#ovCatNote").textContent="共 "+CAT_ORDER.filter(c=>cat[c]).length+" 个大类";
  ovBars($("#ovCat"),CAT_ORDER,cat);

  /* ── 地域构成 ── */
  const sc={};rs.forEach(d=>{const k2=SC_LB[d.sc]||"未知";sc[k2]=(sc[k2]||0)+1});
  $("#ovScNote").textContent="本网官方只有「河北 / 全国」两档地域";
  ovBars($("#ovSc"),["河北","全国","未知"],sc);

  /* ── 个人 / 政企 ── */
  const op=$("#ovOwPanel"),owc={};
  rs.forEach(d=>{if(d.ow)owc[d.ow]=(owc[d.ow]||0)+1});
  if(rs.some(d=>d.ow)){
    op.style.display="";
    ovBars($("#ovOw"),OW_ORDER,owc);
  }else{
    op.style.display="none";
  }

  /* ── 月费档位 ── */
  const FEES=[["0 元",d=>num(d.f)===0],["≤ 10 元",d=>{const v=num(d.f);return v>0&&v<=10}],
    ["10 ~ 30 元",d=>{const v=num(d.f);return v>10&&v<=30}],
    ["30 ~ 60 元",d=>{const v=num(d.f);return v>30&&v<=60}],
    ["60 ~ 100 元",d=>{const v=num(d.f);return v>60&&v<=100}],
    ["≥ 100 元",d=>{const v=num(d.f);return v!=null&&v>100}],
    ["未标月费",d=>num(d.f)==null]];
  const fc={};FEES.forEach(f=>{fc[f[0]]=rs.filter(f[1]).length});
  ovBars($("#ovFee"),FEES.map(f=>f[0]),fc,"按标准月费（元）分档");

  /* ── 上架时间 ── */
  const AGES=[["7 天内",7],["30 天内",30],["90 天内",90],["一年内",365],["一年以上",1e9]];
  const ac={},un=[];
  rs.forEach(d=>{
    const dt=toDate(d.o);
    if(!BASE_OK||dt==null){un.push(d);return}
    const a=ago(dt);
    if(a<0)return;                      // 还没上架的（待上架）不计入历史分布
    for(let i=0;i<AGES.length;i++)if(a<=AGES[i][1]){ac[AGES[i][0]]=(ac[AGES[i][0]]||0)+1;break}
  });
  if(un.length)ac["无上架日期"]=un.length;
  ovBars($("#ovAge"),AGES.map(a=>a[0]).concat(["无上架日期"]),ac,
         "相对本网数据基线日期"+(BASE_OK?"":"（当前基线不可解析）"));
}

/* ══════════════════════════════════════════════════════════════════════
   变化历史（时间线）
   ★ 数据来自构建脚本注入的 HIST（history.json 的 items），不解析 changes/*.md：
     那是给人读的长文，正则一改版就全废 —— 产物不该当接口用。
   ══════════════════════════════════════════════════════════════════════ */
/* ⚠️ 2026-10-03：「在架规模趋势」SVG 折线图已按用户要求整块删除。
   原先它把 HIST 里每条巡检记录的 n（当轮在架条数）画成四网折线，纯前端现算
   （不新增构建期产物，所以不破坏「归档可逐字节比对」）。
   删除时**没有**删掉 HIST 或 history.json —— 时间线仍按原样显示每轮的「N 条」，
   趋势信息只是不再单独画一张图；哪天要恢复，数据侧一个字都不用改。 */

/* 对照卡每轮先铺的张数，其余折叠（数据侧上限与 changes/*.md 一致：120 条） */
const DIFF_SHOW=6;
function fmtDiffs(ds){
  if(ds.length<=DIFF_SHOW)return ds.join("");
  return ds.slice(0,DIFF_SHOW).join("")
    +'<div class="dmore" hidden>'+ds.slice(DIFF_SHOW).join("")+'</div>'
    +'<button type="button" class="dmorebtn" data-n="'+ds.length+'">展开其余 '
    +(ds.length-DIFF_SHOW)+' 条字段变更</button>';
}

function renderHistory(){
  const box=$("#histBox"),note=$("#histNote");
  const items=(HIST||[]).slice().sort((a,b)=>String(b.ts||"").localeCompare(String(a.ts||"")));
  /* 抑制原因（history.json 的 note）—— 中文对照表。
     ★ 为什么必须显示：a=r=c=0 有两种完全不同的含义 ——
       「上游确实没变」和「本轮数据异常/基线回弹，我们没敢记变化」。
       只显示「本次无变化」会把后者伪装成前者，而后者是**需要人看一眼**的。
       表在这里而不是在构建脚本里注入：它只是文案，改动不需要动数据。 */
  const NOTE_CN={"degraded":"数据异常·已冻结上一版","rebound":"基线回弹·不计变化",
    "schema":"字段结构变更·仅重建基线","baseline":"首版基线","resync":"重同步基线",
    "collect-error":"采集失败·沿用上一版","snapshot-fallback":"沿用快照"};
  if(!items.length){
    box.innerHTML='<div class="empty">还没有可展示的变更记录 —— 自本次部署起开始累积，'
      +'下一次巡检有变化时就会出现。</div>';
    note.textContent="";
    return;
  }
  /* 按**日期**聚合成节点（而不是按 ts）：同一天里四网是分几轮跑的，
     按 ts 分会变成一串只含一个网的小节点，反而看不出「这一天整体变了什么」。 */
  const byD={};
  items.forEach(x=>{const d=x.d||String(x.ts||"").slice(0,10);(byD[d]=byD[d]||[]).push(x)});
  const days=Object.keys(byD).sort().reverse();
  note.textContent="共 "+items.length+" 次网级巡检 · "+days.length+" 天 · 点击任一行展开";
  box.innerHTML=days.map(d=>{
    const ns=byD[d].slice().sort((a,b)=>String(a.net||"").localeCompare(String(b.net||"")));
    let A=0,R=0,C=0;
    ns.forEach(x=>{A+=x.a||0;R+=x.r||0;C+=x.c||0});
    const zero=!(A||R||C);
    /* 当天只要有一网带 note，节点头上就挂一个「有抑制」标 ——
       否则整天的汇总数字看着像「什么都没发生」。 */
    const notas=[...new Set(ns.map(x=>x.note).filter(Boolean))];
    return '<div class="tnode'+(zero?" zero":"")+'">'
      +'<div class="thd"><span class="ts">'+esc(d)+'</span>'
      +'<span class="tcap a">新增 '+A+'</span>'
      +'<span class="tcap r">下架 '+R+'</span>'
      +'<span class="tcap c">字段变更 '+C+'</span>'
      +(notas.length?'<span class="tcap w" title="'+esc(notas.map(n=>NOTE_CN[n]||n).join("；"))+'">⚠ 有抑制 '+notas.length+'</span>':"")
      +'<span class="tm">'+ns.length+' 个网</span></div>'
      +'<div class="tbd">'+ns.map(x=>{
          const caps=[];
          if(x.note)caps.push('<span class="tcap w" title="本轮未记入任何变化">⚠ '+esc(NOTE_CN[x.note]||x.note)+'</span>');
          if(x.a)caps.push('<span class="tcap a">新增 '+x.a+'</span>');
          if(x.r)caps.push('<span class="tcap r">下架 '+x.r+'</span>');
          if(x.c)caps.push('<span class="tcap c">字段变更 '+x.c+'</span>');
          /* 护栏数字：这三个**不计入**上面的新增/下架，但不显示就等于把
             「为什么数字比想象的小」这件事藏起来（真变化被吃掉时无人能察觉）。 */
          if(x.gl)caps.push('<span class="tcap" title="同一条资费换了栏目/板块，不算新增也不算下线">漂移合并 '+x.gl+'</span>');
          if(x.gm)caps.push('<span class="tcap" title="在售目录 ↔ 停售目录之间迁移，只按一个方向计一次">在售↔停售 '+x.gm+'</span>');
          if(x.gf)caps.push('<span class="tcap" title="下线日期尚未到期，判为漏采而非下架">假下架抑制 '+x.gf+'</span>');
          if(x.gs)caps.push('<span class="tcap" title="上线日早于上一轮基线，属漏采补录">补录 '+x.gs+'</span>');
          if(!caps.length)caps.push('<span class="tcap">本次无变化</span>');
          /* 样本展示分两路：
             ① 带 ch（旧值→新值）的字段变更样本 → 对照卡：字段名 | 旧值 | 新值，
                中间一条分隔线，一眼看清「从什么改成什么」；
             ② 其余（新增/下架，以及没带 ch 的旧历史记录）→ 保持 chip。
             不全改成卡：新增/下架没有「新旧」可对照，塞进同一布局只是空壳。 */
          const chips=[],diffs=[];
          (x.smp||[]).forEach(s=>{
            if(s.k==="c"&&((s.rows&&s.rows.length)||(s.ch&&s.ch.length))){
              /* rows = 整行对照 [字段名, 旧, 新, 是否变更0/1]（新格式）：
                 未变字段（上线/下线日等）也显示 —— 用户要看「这个套餐长什么样」，
                 变更项高亮、未变项退后；ch = 旧格式（仅变更字段），全部按变更处理。
                 头部标注「变更 N / 共 M 项」，一眼知道高亮看什么。 */
              const items=(s.rows&&s.rows.length)
                ?s.rows.map(r=>({f:r[0],o:r[1],n:r[2],ch:!!r[3]}))
                :s.ch.map(c=>({f:c.f,o:c.o,n:c.n,ch:true}));
              const nch=items.filter(i=>i.ch).length;
              const rows=items.map(i=>{
                const o=(i.o==null?"":String(i.o))||"—",n=(i.n==null?"":String(i.n))||"—";
                if(!i.ch)return '<div class="drow"><div class="dlab">'+esc(i.f||"")+'</div>'
                  +'<div class="dold plain">'+esc(o)+'</div>'
                  +'<div class="dnew plain">'+esc(n)+'</div></div>';
                return '<div class="drow chg"><div class="dlab">'+esc(i.f||"字段")+'</div>'
                  +'<div class="dold"><span class="dtg o">旧</span>'+esc(o)+'</div>'
                  +'<div class="dnew"><span class="dtg n">新</span>'+esc(n)+'</div></div>';
              }).join("");
              diffs.push('<div class="dc'+(nch<items.length?" full":"")
                +'"><div class="dch">⇄ '+esc(s.n||"")
                +(s.ty?'<span class="nn">'+esc(s.ty)+'</span>':"")
                +(nch<items.length?'<span class="dstat">变更 '+nch+' 项 / 共 '
                  +items.length+' 项 · 高亮为变更</span>':"")
                +'</div>'+rows+'</div>');
              return;
            }
            const mark=s.k==="a"?"＋":s.k==="r"?"－":"⇄";
            const fb=(s.f&&s.f.length)?(" · "+s.f.join("/")):"";
            chips.push('<span class="tcap'+(s.k==="a"?" a":s.k==="r"?" r":" c")+'" title="'
              +esc((s.ty||"")+fb)+'">'+mark+esc(s.n||"")+'</span>');
          });
          return '<div class="tnet"><div class="nh"><span>'+esc(x.net||x.code||"")
            +'</span><span class="nn">'+(x.n==null?"":x.n+" 条")+'</span></div>'
            +'<div class="tcaps">'+caps.join("")+'</div>'
            +(chips.length?'<div class="tcaps">'+chips.join("")+'</div>':"")
            +fmtDiffs(diffs)
            +'</div>';
        }).join("")+'</div></div>';
  }).join("");
  box.querySelectorAll(".thd").forEach(h=>{
    h.onclick=()=>h.parentNode.classList.toggle("open");
  });
  box.querySelectorAll(".dmorebtn").forEach(b=>{
    b.onclick=()=>{
      const m=b.parentNode.querySelector(".dmore");
      if(!m)return;
      const n=+b.dataset.n||0;
      if(m.hidden){m.hidden=false;b.textContent="收起字段变更（共 "+n+" 条）"}
      else{m.hidden=true;b.textContent="展开其余 "+(n-DIFF_SHOW)+" 条字段变更"}
    };
  });
}

/* ══════════════════════════════════════════════════════════════════════
   深浅主题
   ★ 默认跟随系统；用户手动切过之后以手动为准，并只把**用户的选择**写进
     localStorage —— 不缓存「系统当前是什么」，否则「我明明一直用浅色，
     系统切成深色后页面前一刷新就变了」这种事必然发生。
   ══════════════════════════════════════════════════════════════════════ */
const THEME_KEY="hb-tariff-theme";
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  document.documentElement.style.colorScheme=t;
  const b=$("#themeBtn");
  if(b){
    const lb=t==="dark"?"当前深色 · 点击切到浅色":"当前浅色 · 点击切到深色";
    b.title=lb;b.setAttribute("aria-label",lb);
  }
}
function initTheme(){
  let t=null;
  try{t=localStorage.getItem(THEME_KEY)}catch(e){}
  if(t!=="dark"&&t!=="light"){
    t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  }
  applyTheme(t);
}

/* —— 初始化 ——
   顺序有讲究：先把排序下拉建好（readHash 要设 #sort），再 renderNav/renderNet
   建出导航与**按网生成**的类型下拉，readHash 才可能把 ty 设到一个已存在的
   option 上；最后 apply() 里 setBase() + 首屏渲染。 */
Object.keys(F).forEach(k=>{
  const o=document.createElement("option");o.value=k;o.textContent=F[k].lb;$("#sort").appendChild(o);
});
$("#sort").value=sortK;
initTheme();
/* 全网零变化时构建侧把 notice 留空 —— 空提示条没有信息量，整条藏掉。
   真正需要常驻顶部的提示是「降级冻结 / 沿用快照 / 真变化」，那些都有内容，
   不会走到这条隐藏分支。 */
(function(){const nb=$("#notice");if(nb&&!nb.textContent.trim())nb.style.display="none";})();
/* 每页条数记忆恢复：必须在 readHash() 之前 —— 深链 #p=N 的页码要按恢复后的
   PAGE 折算（第 5 页/80条 与 第 5 页/200条 是两回事），apply() 里 clamp 用的也是它。 */
(function(){try{const v=+localStorage.getItem("hbtm_psz");if(v===80||v===200||v===400){PAGE=v;$("#psz").value=String(v)}}catch(e){}})();
renderNav();renderNet();
favInject();
readHash();
markHead();

/* 搜索框防抖（2026-10-01）：#kw 每敲一个字符都会触发一轮全量 filter + sort
   （联通那网 8000+ 行，decorate-sort 也要 O(n) 取值一遍）。连打一串字时，
   中间的每一键都是白算的 —— 用户只会看最后那一下。150ms 足以把「连打」
   合并成一次，又不会让人感到迟钝。Esc 清空那条路径保持立即 apply
   （清空是明确的一次性动作，没必要再等 150ms）。
   ★ 只防抖 #kw：下拉/页签/快捷 chip 的 onchange 本来就是低频离散动作，
     加防抖反而让「点了没反应」的错觉有机会出现。 */
let _kwT=null;
$("#kw").oninput=()=>{clearTimeout(_kwT);_kwT=setTimeout(apply,150)};
DIMS.forEach(k=>{
  /* 这里**不再**单独处理大类联动：统一由 apply() 开头那一次 syncDims() 负责。
     两处都写会让人以为「只有走 onchange 才联动」，而深链那条路恰恰就是这么漏掉的。 */
  $("#"+k).onchange=()=>{clearChips();apply()};
});
/* —— 两级主轴的页签点击 → 回写底层 select 并派发 change ——
   ★ 用事件委托而不是给按钮逐个绑定：按钮会被 syncAxis() 重建，直接绑的监听
     在第一次重建后就没了（点了没反应，且完全不报错）。
   ★ 派发的是**真的 change 事件**，走的是和用户拉下拉框完全同一条路
     （DIMS 上那个 onchange ⇒ clearChips + apply）——
     不另外写一条「点按钮就 apply」的旁路，免得两条路哪天口径分叉。 */
$("#axisbar").addEventListener("click",e=>{
  const b=e.target.closest(".axseg button");
  if(!b||b.disabled)return;
  const ax=b.closest(".axis"),sel=ax&&ax.querySelector("select");
  if(!sel)return;
  sel.value=b.dataset.v||"";
  sel.dispatchEvent(new Event("change",{bubbles:true}));
});
/* 页签点击：只改 STA，不碰别的筛选 —— 切页签不该把关键词/地域筛掉。
   禁用项（本网拿不到下架数据的那些）点了不生效，与置灰语义一致。 */
document.querySelectorAll("#tabs button").forEach(b=>{
  b.onclick=()=>{
    if(b.disabled)return;
    STA=b.dataset.v;syncTabs();pg=0;apply();
  };
});
$("#sort").onchange=e=>{sortK=e.target.value;sortD=F[sortK].def;apply()};
$("#dir").onclick=()=>{sortD=-sortD;apply()};
$("#reset").onclick=resetAll;

/* —— 筛选区折叠 ——
   窄屏上筛选区（两级主轴 + 五段 + 快捷行）拉得比首屏还长，收起后一屏见表。
   ★ 状态记在 localStorage；没有记录时只按**当前视口**定默认：桌面展开
     （滚动成本低、可发现性好），窄屏收起。
   ★ 徽标显示「生效条件数」：收起时也看得到里面还挂着几个条件，
     不会出现「折叠区里藏着 5 个条件、结果莫名其妙只剩 3 条」的迷惑。 */
const FT_KEY="ft-fold";
function updateFbadge(){
  let n=($("#kw").value.trim()?1:0)+(STA!==""?1:0)+(onlyFav?1:0);
  DIMS.forEach(k=>{if($("#"+k).value)n++});
  const b=$("#fbadge");
  if(b){b.textContent=n||"";b.hidden=!n}
}
function foldFilters(f){
  document.getElementById("deck").classList.toggle("folded",f);
  $("#ftog").setAttribute("aria-expanded",f?"false":"true");
  try{localStorage.setItem(FT_KEY,f?"1":"0")}catch(e){}
}
(function(){
  let f=null;try{f=localStorage.getItem(FT_KEY)}catch(e){}
  if(f==null)f=window.innerWidth<860?"1":"0";
  document.getElementById("deck").classList.toggle("folded",f==="1");
  $("#ftog").setAttribute("aria-expanded",f==="1"?"false":"true");
})();
$("#ftog").onclick=()=>foldFilters(!document.getElementById("deck").classList.contains("folded"));
/* 视图页签 / 主题切换 / 历史展开。都是纯粹的「显示层」操作，
   一律不碰筛选状态（见 setView 注释）。 */
$("#vtab").addEventListener("click",e=>{
  const b=e.target.closest(".tab");if(b)setView(b.dataset.v);
});
$("#themeBtn").onclick=()=>{
  const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  applyTheme(t);
  try{localStorage.setItem(THEME_KEY,t)}catch(e){}
};
$("#histTog").onclick=()=>{
  const ns=document.querySelectorAll("#histBox .tnode");
  const anyClosed=[].some.call(ns,n=>!n.classList.contains("open"));
  [].forEach.call(ns,n=>n.classList.toggle("open",anyClosed));

};
$("#csv").onclick=exportCSV;
$("#offline").onclick=saveOffline;

/* —— 点筛选标签上的 × ：只摘掉那**一个**条件 ——
   用事件委托挂在 #stat 上（它的 innerHTML 每次 render 都重建，
   挂在标签本身上会在第一次重渲染后失效）。 */
$("#stat").addEventListener("click",e=>{
  const b=e.target.closest(".fchip");if(!b)return;
  const k=b.dataset.d;
  if(k==="kw"){$("#kw").value=""}
  else if(k==="st"){STA="";syncTabs()}
  else{
    const el=$("#"+k);if(el)el.value="";
    if(k==="cat")syncDims();     // 大类被摘掉 ⇒ 细分的置灰要复原
  }
  clearChips();apply();
});

/* —— 键盘快捷键 ——
   / 聚焦搜索框、Esc 清空搜索。判「当前是不是在输入」而不是无脑抢键：
   在下拉/输入框里敲 / 是正常输入，抢走焦点会很烦人。 */
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();
  const typing=tag==="input"||tag==="select"||tag==="textarea";
  if(e.key==="/"&&!typing){e.preventDefault();$("#kw").focus()}
  else if(e.key==="Escape"&&e.target===$("#kw")&&$("#kw").value){$("#kw").value="";apply()}
});
$("#prev").onclick=()=>{if(pg>0){pg--;render();markHead();syncHash();scrollToList()}};
$("#next").onclick=()=>{if((pg+1)*PAGE<view.length){pg++;render();markHead();syncHash();scrollToList()}};
$("#first").onclick=()=>{if(pg>0){pg=0;render();markHead();syncHash();scrollToList()}};
$("#last").onclick=()=>{const n=Math.max(1,Math.ceil(view.length/PAGE));if(pg<n-1){pg=n-1;render();markHead();syncHash();scrollToList()}};
$("#pgin").onchange=()=>{
  const n=Math.max(1,Math.ceil(view.length/PAGE));
  const v=Math.min(n,Math.max(1,parseInt($("#pgin").value,10)||1));
  if(v-1!==pg){pg=v-1;render();markHead();syncHash();scrollToList()}
  else $("#pgin").value=v;      // 越界输入归位（如第 0 页 / 第 999 页）
};
$("#psz").onchange=e=>{
  /* 换每页条数：页码语义全变（第 3 页/80条 ≠ 第 3 页/200条），一律回第 1 页 ——
     apply() 本来就会置 pg=0，这里只改 PAGE。 */
  PAGE=+e.target.value||80;
  try{localStorage.setItem("hbtm_psz",String(PAGE))}catch(err){}
  apply();
};
/* 翻页后滚到表格头而不是页顶：筛选区 / 快捷 chips 展开时页顶可能离表格
   两三屏，每次翻页都被甩回最顶上，上下文全丢。对齐到 th 的吸顶层下沿。 */
function scrollToList(){
  const t=document.querySelector("table");
  if(!t)return;
  const sh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--stackh"))||0;
  const y=t.getBoundingClientRect().top+window.pageYOffset-sh-6;
  window.scrollTo(0,Math.max(0,y));
}
/* 每页条数记忆（读回放在 init 段） */

document.querySelectorAll("th[data-k]").forEach(th=>{
  th.onclick=()=>{
    const k=th.dataset.k;
    if(sortK===k)sortD=-sortD;
    else{sortK=k;sortD=F[k].def}
    $("#sort").value=sortK;clearChips();apply();
  };
});

/* 快捷 chip → 维度取值的映射。选中态与点击行为都从这份表推导，两处共用。 */
const CHIP_MAP={new7:["on","7"],new30:["on","30"],new90:["on","90"],exp60:["off","60"],
                free:["pf","0,0"],bw:["bw","line"],g100:["gf","100,99999"],chg:["chg","1"]};
/* chip 的选中态从**维度值**反推（而不是点击时手工加 class）——
   深链进来、点筛选标签 × 摘掉条件、切网清空，任何路径改了维度值，
   下一次 apply 都会把高亮对齐回真实状态，不会出现「chip 亮着条件却不在」的两张皮。 */
function syncChips(){
  document.querySelectorAll("#chips button[data-p]").forEach(b=>{
    const m=CHIP_MAP[b.dataset.p];
    b.classList.toggle("on",!!m&&($("#"+m[0]).value===m[1]));
  });
}

$("#chips").addEventListener("click",e=>{
  const b=e.target.closest("button[data-p]");if(!b)return;
  const p=b.dataset.p;
  if(p==="all"){
    /* 「全部」＝ 清空关键词 + 全部维度（状态页签与排序不动 —— 与「重置」同语义）。 */
    $("#kw").value="";clearDims();syncDims();
  }else{
    const m=CHIP_MAP[p];
    if(m){
      const el=$("#"+m[0]);
      /* toggle：再点一次同 chip ＝ 摘掉这个条件；其他维度与关键词**原样保留** ——
         「0 元 + 含宽带」「7 天内上架 + 含宽带」这类组合正是快捷项存在的意义。
         早先的互斥设计（点一个清全部）把组合能力砍掉了；映射到同一维度的
         两个 chip（如 7 天 / 30 天上架）天然互斥，toggle 语义自动处理。 */
      if(el)el.value=(el.value===m[1])?"":m[1];
    }
  }
  apply();          // 高亮由 apply → syncChips 按维度值重算，不在这里手改 class
});

/* 粘性偏移：实量常驻层的高度写进 CSS 变量，供 th 取用。
   ★ 常驻的只有「视图页签 #vtab」；顶栏 .topbar 不常驻，筛选栏 #bar 随列表滚走
    （2026-09-25 修复的架构：吸顶层过高会把可见区压没）。
   ★ 量高度用 offsetHeight 而不是 getBoundingClientRect().height：元素一旦处于
     sticky 状态，rect 会带上偏移量；offset* 是布局尺寸，永远是自然高度。
   ★ 数字不写死：筛选栏高度随网变化（只有移动的官方接口带「归属」字段，
     没有这一维的网筛选栏矮一截），也随窗口宽度换行数变化，所以 resize / 切网 /
     切页签都要重量。 */
function fixBarh(){
  const vt=document.getElementById("vtab");
  const vh=vt?vt.offsetHeight:0;
  const st=document.documentElement.style;
  st.setProperty("--vtabh",vh+"px");
  /* ★ 表头钉在**唯一吸顶层 #vtab**的下沿。2026-09-25 起 #bar（筛选栏）不再吸顶、
     随列表滚走，所以表头吸顶位置 = 页签高度。
     （非明细页工具条隐藏，结果一致。） */
  st.setProperty("--stackh",vh+"px");
}
window.addEventListener("resize",fixBarh);
/* 同页跳到另一个 hash（手改地址栏 / 点同页链接）不会重新加载，
   没这个监听页面就不会跟着变。syncHash 用的是 replaceState（不触发 hashchange），
   所以加监听不会自激。 */
window.addEventListener("hashchange",()=>{readHash();apply()});
fixBarh();
apply();
/* 首屏落在哪个页签：readHash() 里若带了 #v=… 已 self 设定过（setView 是幂等的，
   重设一遍只是保证「没有 hash 时」也走一次完整的显隐 + 尺寸重算）。 */
setView(VIEW);

/* ── PWA：注册 Service Worker。只在 http(s) 下注册（file:// 直接跳过） ── */
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){
      /* 静默失败：离线壳是加分项，不是页面能不能用的前提 */
    });
  });
}
</script>
