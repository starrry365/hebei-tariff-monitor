version: 2
# 本仓库的工作流把 GitHub Actions 固定到了 commit SHA（供应链加固）。
# 固定后不会被上游静默改写，但也不会自动升级 —— 由 Dependabot 负责提议更新。
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
