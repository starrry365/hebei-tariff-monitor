# -*- coding: utf-8 -*-
name: 推送通道自检

# 只测试五个推送通道（钉钉 / 飞书 / 企业微信 / PushPlus / 邮件）是否配置正确，
# 不动数据、不抓取、不部署。
# 适用场景：
#   - 第一次配置 Secrets 后跑一次，确认微信/邮件能收到
#   - 换 token / SMTP 授权码后跑一次，验证生效
#   - 没收到 tariff-daily 的推送时，先跑这个排除「通道坏」的可能
#
# 未配置任何通道也不会失败（cloud/tariff/notify.py 在没通道时静默跳过）。

on:
  workflow_dispatch:                # 只允许手动触发
    inputs:
      mode:
        description: "测试模式（check=只查配置 / test=发一条测试消息）"
        type: choice
        options: [check, test]
        default: check

concurrency:
  group: notify-test
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TZ: CST-8
      # ── 钉钉 / 飞书 / 企业微信（群机器人 webhook）─────────────
      # 加签是可选的：机器人安全设置里选了「加签」才需要配对应的 SECRET。
      # 🔴 两家的加签算法**不一样**（抄错会一直 310000 / sign not match）：
      #    钉钉 HMAC-SHA256(key=secret, msg=ts+"\n"+secret)
      #    飞书 HMAC-SHA256(key="",     msg=ts+"\n"+secret)
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET:  ${{ secrets.DINGTALK_SECRET }}
      FEISHU_WEBHOOK:   ${{ secrets.FEISHU_WEBHOOK }}
      FEISHU_SECRET:    ${{ secrets.FEISHU_SECRET }}
      WECOM_WEBHOOK:    ${{ secrets.WECOM_WEBHOOK }}
      # ── PushPlus ────────────────────────────────────────────
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_TOPIC:  ${{ secrets.PUSHPLUS_TOPIC }}
      # ── SMTP 邮件 ───────────────────────────────────────────
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_SSL:  ${{ vars.SMTP_SSL || '1' }}
      MAIL_TO:   ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || '资费监控' }}
      # ── 开关 ───────────────────────────────────────────────
      # selfcheck 模式强制打开 SELF_NOTIFY（默认就开），避免被外部编排关掉
      SELF_NOTIFY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            pycryptodome websocket-client

      - name: 推送自检
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set +e
          echo "=== mode = $MODE ==="
          echo "本地时间：$(date '+%F %T %Z')"

          # ── step 1：通道配置自检（不发请求）──────────────────────
          echo ""
          echo "── 通道配置自检（--check）──"
          python cloud/tariff/notify.py --check

          # ── step 2：推送逻辑自测（不发请求）──────────────────────
          echo ""
          echo "── 推送逻辑自测（--selfcheck）──"
          python cloud/tariff/notify.py --selfcheck
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::推送逻辑自测失败 exit=$RC"
            exit $RC
          fi

          # ── step 3：真发一条测试消息（mode=test 时）──────────────
          if [ "$MODE" = "test" ]; then
            echo ""
            echo "── 真发送测试消息（--test）──"
            python cloud/tariff/notify.py --test
            echo "（注意：pushplus 是异步投递，code=200 只代表服务端已接收；真实到达看微信/邮箱）"
          else
            echo ""
            echo "ℹ 本次只验证配置和逻辑，未真发消息。"
            echo "  想发一条测试消息：workflow_dispatch 时把 mode 选成 test"
          fi

          # 推送失败不让 workflow 失败（这是诊断工具，不是闸门）
          exit 0

      - name: 提示：未配置通道时的引导
        if: always()
        run: |
          # 检查是否有任何通道被配置
          HAS_IM="no"
          if [ -n "$DINGTALK_WEBHOOK" ] || [ -n "$FEISHU_WEBHOOK" ] || [ -n "$WECOM_WEBHOOK" ]; then
            HAS_IM="yes"
          fi
          HAS_PUSHPLUS=$([ -n "$PUSHPLUS_TOKEN" ] && echo "yes" || echo "no")
          HAS_SMTP=$([ -n "$SMTP_HOST" ] && [ -n "$MAIL_TO" ] && echo "yes" || echo "no")
          if [ "$HAS_IM" = "no" ] && [ "$HAS_PUSHPLUS" = "no" ] && [ "$HAS_SMTP" = "no" ]; then
            echo "::notice::未配置任何推送通道 —— 主任务会自动跳过推送，不会失败"
            echo ""
            echo "## 配置推送通道"
            echo
            echo "在仓库 Settings → Secrets and variables → Actions 里加上想用的通道对应变量："
            echo
            echo "| 通道 | 需要的 Secrets |"
            echo "|---|---|"
            echo "| 钉钉群机器人 | DINGTALK_WEBHOOK（开了「加签」再加 DINGTALK_SECRET）|"
            echo "| 飞书群机器人 | FEISHU_WEBHOOK（同上，再加 FEISHU_SECRET）|"
            echo "| 企业微信群机器人 | WECOM_WEBHOOK |"
            echo "| 微信（PushPlus） | PUSHPLUS_TOKEN（必填）+ PUSHPLUS_TOPIC（可选，一对多）|"
            echo "| 邮件（SMTP）| SMTP_HOST + SMTP_PORT + SMTP_USER + SMTP_PASS + MAIL_TO + MAIL_FROM |"
            echo
            echo "⚠️ 钉钉与飞书的**加签算法不同**，别互相套用："
            echo "钉钉的 key 是 secret，飞书的 key 是空串 —— 抄错会一直提示 sign not match。"
            echo "（两个算法都已写进 cloud/tariff/notify.py 的自测，跑 --selfcheck 可自证。）"
            echo
            echo "推荐服务：QQ 邮箱 smtp.qq.com:465（SSL）/ 网易 smtp.163.com:465 / Gmail smtp.gmail.com:587（STARTTLS）"
            echo "⚠️ QQ / 163 / Gmail 都需要专门的「授权码」而不是登录密码，在邮箱后台开通 SMTP 服务时拿到。"
            echo
            echo "完整模板见 .env.example"
          fi
