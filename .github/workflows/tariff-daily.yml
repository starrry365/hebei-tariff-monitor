# -*- coding: utf-8 -*-
name: 资费每日巡检 + 页面部署

# 河北四网「资费专区」抓取 → 差异对比 → 生成查询页 → 部署到 GitHub Pages
#
# 三网（移动 / 联通 / 广电）走纯 HTTP，无需任何登录凭证
#（2026-09-20 实测：无 token、无签名、明文请求体即可），不存在 Cookie 过期 / 顶号问题，
# 适合长期无人值守。
#
# 电信走**真实 Chrome** —— 它的 WAF 是瑞数类 JS 挑战：纯 HTTP 必 412，
# 且 navigator.webdriver=true 的自动化浏览器会被 400 空响应硬拒。
# 🟢 2026-09-22 实测（ubuntu-latest）：Xvfb + **有头** Chrome（启动只给
#    --remote-debugging-port，不给 --enable-automation）挑战自动通过，
#    884 条 5 个分类逐项采全 ⇒「云端采不到电信」是个**推断错误**，
#    真正的前提只是「得有浏览器 + 得有屏幕」。采集脚本 = ci_grab.sh。
#    ⚠️ 别图省事改回 --headless：UA 带 HeadlessChrome，等于自己把难度调高。
#
# 电信仍是**机会性采集**（不硬依赖）：ci_grab.sh 失败时（瑞数改规则 / 镜像没 Chrome），
# tariff_monitor 自动退回仓库里最新那份快照渲染 ⇒ 页面**不会少一网**，
# 只是电信数据停在上一版，且基线日期取自快照自身，陈旧是看得见的。
#
# 页面公开可访问：https://starrry365.github.io/hebei-tariff-monitor/
# 每次运行都会重新部署，所以线上页面始终是最近一次成功巡检的数据。

on:
  schedule:
    # UTC 22:00 = 北京时间次日 06:00
    # 注：GitHub 定时任务在高峰会排队，实际启动可能晚几分钟
    - cron: "0 22 * * *"
  # 允许手动触发（临时补抓 / 改完代码验证）
  workflow_dispatch:

permissions:
  contents: write        # 需要把快照 / 报告 / 页面归档提交回本仓库
  pages: write           # 部署 GitHub Pages
  id-token: write        # deploy-pages 需要 OIDC

concurrency:
  group: tariff-daily
  cancel-in-progress: false

jobs:
  tariff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 必须用 POSIX 格式（CST-8）而不是 Asia/Shanghai —— 精简镜像缺 tzdata 会被静默忽略、
      # 退回 UTC，导致快照文件名与报告日期整体错一天
      TZ: CST-8
      # 网关密钥不写进代码，由 Actions Secret 注入（缺了会直接抛错，不会静默回退）
      NRAPIGATE_KEY: ${{ secrets.NRAPIGATE_KEY }}
      NRAPIGATE_IV: ${{ secrets.NRAPIGATE_IV }}
      # ── 推送（邮件 + PushPlus）────────────────────────────────────────
      # 全部走 Secrets，代码里一个都不出现。**一个都没配就自动跳过推送**，
      # 本地 fork / 未配置环境不会因此失败（见 cloud/tariff/notify.py 的 enabled()）。
      # 想临时静音：把 NOTIFY 设成 "0"（或在仓库变量里改），不用动代码。
      NOTIFY: ${{ vars.NOTIFY || '1' }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_SSL: ${{ vars.SMTP_SSL || '1' }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || '河北资费巡检' }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --quiet --disable-pip-version-check pycryptodome websocket-client
          # xvfb：电信采集要一块「屏幕」才能起有头 Chrome（headless 会被 WAF 识别）
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null

      - name: 环境自检
        run: |
          set -e
          echo "python  : $(python -V)"
          echo "本地时间: $(date '+%F %T %Z')"
          python -c "import Crypto; print('pycryptodome', Crypto.__version__)"
          echo "--- 密钥装载检查 ---"
          PYTHONPATH=cloud/tariff python -c "import mz_crypto as m; print('    网关密钥已装载: key=%d字节 iv=%d字节' % (len(m.KEY), len(m.IV)))"

          # ── 出口连通预检：**只告警，不失败** ─────────────────────────────
          # 🔴 2026-09-22 踩到：这一步 `OSError [Errno 101] Network is unreachable`
          #    把整轮巡检直接掐死（抓取 / 校验 / 部署 全部 skipped），而同一分支
          #    上一次运行这步是通的 —— 典型的**单发连通假阴性**。
          #    预检是诊断，不是功能：它的 URL、它的握手参数都和真实抓取不是同一条
          #    代码路径，拿它当闸门等于用一个更脆的东西去挡一个更稳的东西。
          #    真正的闸门是抓取本身（抓到 0 条会明确失败并给出原因）。
          set +e
          echo "--- 出口连通预检（仅告警）---"
          echo "    注意：不能用 curl 预检。Linux curl 走 OpenSSL 3.x，会因"
          echo "    UNSAFE_LEGACY_RENEGOTIATION_DISABLED 误报 HTTP=000，而脚本实际是通的"
          echo "    （移动服务器不支持 RFC5746，须开 OP_LEGACY_SERVER_CONNECT）"
          python - <<'PY'
          import socket, ssl, time, urllib.request as u
          # 只取 IPv4：部分 runner 上 getaddrinfo 首个结果是不可路由的地址，
          # socket.create_connection 会直接 Errno 101（而不是回退到下一个）。
          _gai = socket.getaddrinfo
          socket.getaddrinfo = lambda *a, **k: [r for r in _gai(*a, **k) if r[0] == socket.AF_INET]
          c = ssl.create_default_context()
          c.options |= getattr(ssl, 'OP_LEGACY_SERVER_CONNECT', 4)
          o = u.build_opener(u.HTTPSHandler(context=c), u.ProxyHandler({}))
          url = 'https://h.app.coc.10086.cn/cmcc-app/uni-pages/tariffZonePers.html'
          for i in range(3):
              try:
                  r = o.open(url, timeout=25)
                  print('    tariffZone HTTP=%d bytes=%d' % (r.status, len(r.read())))
                  break
              except Exception as e:
                  print('    第 %d 次未通：%s: %s' % (i + 1, type(e).__name__, e))
                  time.sleep(3)
          else:
              print('::warning title=出口连通预检未通过::预检失败**不影响**后续抓取（这只是诊断步骤）。'
                    '若抓取步骤也失败，再按网络问题排查。')
          PY
          set -e

      - name: 采集电信（真实 Chrome + Xvfb，失败不阻断）
        run: bash probes/tools/ct_browser/ci_grab.sh

      - name: 留存电信采集现场（失败时才有用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ct-grab-evidence
          path: |
            /tmp/ct_shot.png
            /tmp/ct-chrome.log
            cloud/tariff/.ct_raw.json
          if-no-files-found: ignore
          retention-days: 14

      - name: 抓取 + 对比 + 生成并归档页面
        run: python cloud/tariff/tariff_monitor.py

      # ── 判据层体检 ───────────────────────────────────────────────────
      # 🔴 这两步以前**从来没在 CI 里跑过**，只在本机手动执行过 ——
      #    于是判据（宽带判定 / 日期格式 / 搜索字段 / 城市表 / 脚本↔模板规则同步）
      #    一旦回归，没有任何自动拦截，直到有人肉眼发现页面筛选不对。
      #    「有检查脚本」和「检查真的会跑」是两件事；后者才是护栏。
      #    放在生成页面之后、部署之前：判据坏了就别把坏页面推上线。
      - name: 体检数据判据（判据注入 / 日期 / 宽带 / 搜索 / 地市归属）
        run: |
          set -e
          # ★ 2026-09-26 前置：**护栏判据自测** + 推送通道配置检查。
          #   护栏（假下架/假新增/身份漂移/回弹/降级状态机）本身就是代码，
          #   改错了**不会报错**，只会静默地少报或多报变化 —— 那是最难发现的一类错误
          #   （页面照常更新、数字看着正常、日志一行异常都没有）。
          #   自测是纯逻辑、不联网、毫秒级，所以放在最前面当作闸门：判据坏了就不许继续。
          python cloud/tariff/change_guard.py
          # 推送只做「配没配」的检查，不发消息；一个通道都没配也**不算失败**
          python cloud/tariff/notify.py --check
          # ★ 推送**该不该发**这条判据同样要自测（零变化不许推、异常态必须推）。
          #   写错的方向是「天天推无变化」→ 用户静音通知 → 真变化也看不见，
          #   而这件事在日志里完全看不出来（推送调用返回的都是成功）。
          python cloud/tariff/notify.py --selfcheck
          # 体检**有条目级地市归属**的三网（move / telecom / unicom）——
          # 广电上游只有「全国 / 河北省」两档，跑城市类判据只会得到一堆 0，没有意义。
          # ⚠️ audit_data 只断言「结构性」不变量（不含条数），正常情况下应当零失败；
          #    它一旦红，说明模板改了而注入/判据没跟着改（或反之），必须人工处理。
          python cloud/tariff/audit_data.py --net move --quiet
          python cloud/tariff/audit_data.py --net telecom --quiet
          # 联通这条是 2026-09-24 新加的：它的地市归属来自采集侧的 12 城目录归属，
          # 是全链路里唯一一条「不直接读上游字段」的判据 —— 最该被体检的就是它。
          python cloud/tariff/audit_data.py --net unicom --quiet

      - name: 核对地域口径（只保留「河北 + 全国」）
        run: |
          set -e
          # 需求：「四网我只要河北和全国的，其他省份不要」。这条需求是**静默**的 ——
          # 条目归错档或被误丢，页面看不出来（「仅全国」置灰到底是上游没有、
          # 还是我们没认出来，截图一样）。本步把上游地域取值分布与被丢弃条目都摊开。
          # 读的是**入库快照**（不是本地缓存），所以 CI / 任意 clone 都能跑。
          # 退出码只看硬错误（数据缺失）：把「外省专属条目被丢弃」当失败是把需求当 bug。
          python probes/check_area_scope.py --json "$RUNNER_TEMP/area_scope.json"

      - name: 核对采集维度语义（地市码名 ↔ 条目文案 / 全省的第二种写法）
        run: |
          set -e
          # ★ 2026-09-24 新增。前面几步问的都是「**已经采到的那批**对不对」；
          #   这一步问的是「**该采的是不是都去采了**」。两者失效方式完全不同：
          #   前者算错能对出来；后者是整栏/整档**从未被请求过** —— 接口全 200、
          #   日志无异常，唯一的症状是「少了」，而且少的那部分从不出现。
          #   本轮两个真错全在这一层（前面所有步都照不出来）：
          #     · `HB_CITY["3121"]` 挂着「省直辖（定州/辛集）」，实测该码单独出现的
          #       条目**全是雄安**（页面里「雄安新区」档因此永远拿不到自己的资费）；
          #     · 上游用「把 12 个地市码全列出来」表达「全省通用」，没被识别 ⇒
          #       59 条全省资费被当成「12 城专属」，按「仅全省通用」筛时漏掉。
          python probes/probe_city_code_semantics.py

      - name: 核对采集维度穷尽性（上游目录 / 地市集合 / 板块取值）
        run: |
          set -e
          # 打真接口，验证四个可能被静默漏掉的维度：
          #   ① 上游 cityList 是否 == 硬编码的 12 城（少一个城就少一整城的资费）
          #   ② 12 城的一级/二级栏目骨架是否一致（单城取骨架是否安全）
          #   ③ tariffAttributes 是否只有 1/2（有没有第三个板块）
          #   ④ 超出上游目录声明的组合是否真的没有数据（「目录没列」≠「没有数据」）
          # 拿联通当代表：它是唯二能逐城取数的网（另一网是电信，需真实浏览器）。
          python probes/probe_coverage_axes.py --net unicom

      - name: 核对吸顶层不透明（滚动内容不许从吸顶层下面透出来）
        run: |
          set -e
          # ★ 2026-09-24 新增。用户报「界面有问题」，截图顶部是一条叠在一起的乱码：
          #     「0 元 — 数据总览 全国 通话尊享服… 资费明细 个人 — 变化历史 20 数据说明」
          #   根因＝吸顶的「视图页签条」**没有背景**（筛选栏有 glass，页签条忘了加）
          #   ⇒ 滚动时表格行从它下面透上来，与页签文字叠在一起。
          #   ★ 这一条**其它所有检查都照不出来**：rect.top 正常（透明不影响几何）、
          #     elementFromPoint 正常（命中测试返回最上层元素，与透明度无关）、
          #     事件绑定正常、异常 0、连跑一致。唯一能表达它的量是**背景色的 alpha**。
          #   判据：模板里每条 position:sticky 的规则都必须自带**实色**背景
          #     （--card/--card2/--card3 或 hex/rgb），出现 --glass/rgba(...,<1) 
          #     /transparent 一律失败；且必须存在唯一吸顶根 #deck（防止再被拆成
          #     几层各自 sticky —— 那是这次事故的结构成因）。
          python probes/probe_sticky_layers.py

      - name: 核对联通栏目覆盖（上游有目录 / 快照有没有条目）
        run: |
          set -e
          # ★ 2026-09-24 新增。上一步 probe_coverage_axes 问的是**骨架**
          #   （cityList 是不是 12 城 / 12 城栏目签名一致吗 / 板块取值只有 1、2 吗），
          #   它**不问**「每个 (板块 × 一级 × 二级) 组合到底有没有数据」。
          #   而「整栏从未被请求过」失效时接口全 200、日志无异常，唯一症状是「少了」。
          #   这一步逐组合打真接口（44 × 12 = 528 格），把「该组合在 12 城并集下的
          #   三级目录 id 数」与「快照落在该组合的条目数」并排对：
          #       三级 id > 0  而  快照条目 == 0   ⇒ 🔴 整栏漏采
          #       三级 id == 0（全 code=0001）     ⇒ 上游确实没有这一栏（正常）
          #       有请求失败格                     ⇒ 结论不可信，判失败
          #   ⚠️ 判据不能写成「两个数相等」：同一条资费可挂多栏目，快照 entries 是
          #     按 reportNo 去重后的（实测 9120 → 8041，差 1079 是重复挂载不是漏）。
          python probes/probe_unicom_axes.py

      - name: 核对筛选维度口径（停售还原 / 细分域 / 板块显隐）
        run: |
          set -e
          # ★ 2026-09-24 新增。前面几条问的是**采集**（该采的是不是都去采了），
          #   这一条问的是**构建**（采回来的有没有被正确归类到筛选维度上）。
          #   它失效时接口全 200、采集零失败，唯一症状是「页面上某一类永远筛不出来」。
          #   三条判据：
          #     ① 联通「停售套餐」必须按二级栏目还原成真实分类，不得整体归成 cat=套餐
          #        （旧错：3177 条被一律归成套餐；只查「cat 越界 = 0」会被骗过去，
          #         所以还要查「停售行里 cat != 套餐 的占多数」）
          #     ② 细分 ty 取值域 ⊆ 上游栏目（不许凭空造词；域为空也算废了）
          #     ③ 板块 sect 只在本网 tariffAttr 真有两档时落盘（一档也落盘 = 没信息量）
          python probes/probe_filter_dims.py

      - name: 校验页面归档
        run: |
          python -c "
          import gzip, json, re, time
          s = gzip.open('cloud/tariff/page/index.html.gz', 'rt', encoding='utf-8').read()
          # 占位符要逐个列全。漏检 __NETS__ 尤其糟 —— 整页 JS 会退化成语法错误，
          # 而这一步照样报 OK。
          # ⚠️ 这份列表和 tariff_monitor.PLACEHOLDERS 是**两处**，加新占位符时都要改
          #    （2026-09-22 加 __CAT_ORDER__ 时先漏了 render_only，又漏了这一处；
          #      2026-09-23 加 __OW_ORDER__ / __HIST__ 时同样只改了 tarif_monitor 那侧）。
          #    注：现在只剩这两处 —— rebuild_offline.py 改为直接调 build_html()，
          #    不再自带一份替换列表（它那份曾在改造中静默漏掉过占位符）。
          #    漏检的后果很隐蔽：占位符原样留在页面里，而 JS 里 `const HIST=__HIST__`
          #    会**直接变成语法错误**，整页功能全废 —— 但标签看着都在。
          left = [p for p in ('__NETS__', '__N__', '__DATE__', '__CAT_ORDER__',
                              '__OW_ORDER__', '__CITY_ORDER__', '__CITY_EXTRA__',
                              '__HIST__', '__NOTICE__') if p in s]
          assert not left, '占位符未替换: %s' % left
          m = re.search(r'const NETS=', s)
          assert m, '页面里找不到 const NETS= 数据容器'
          nets = json.JSONDecoder().raw_decode(s[m.end():])[0]
          assert set(nets) >= {'move', 'unicom', 'telecom', 'cbn'}, '四网容器不完整: %s' % sorted(nets)
          # ★ 地市清单：从**页面自己**读出来当作地市名的合法集合（唯一致命来源是构建脚本，
          #   这里只是把它捞出来复用）。它的价值是「页面能选到的档」与「行数据里出现的值」
          #   必须闭合 —— 写进行数据却选不到的地市名，那条资费就永远筛不出来（静默）。
          co = re.search(r'const CITY_ORDER=(\[.*?\]);', s)
          ce = re.search(r'const CITY_EXTRA=(\[.*?\]);', s)
          assert co and ce, '页面里找不到注入后的 CITY_ORDER / CITY_EXTRA（地市下拉会是空的）'
          CITY_ALL = set(json.loads(co.group(1))) | set(json.loads(ce.group(1)))
          assert len(CITY_ALL) >= 12, '地市清单过短（%d 项）—— 注入内容不对' % len(CITY_ALL)

          # ★ 逐网断言，别只查移动那网。接第二网时最容易漏的正是这个 ——
          #   联通那网若 base 没填、或 rows 忘了灌，页面切过去就是「待接入」白页，
          #   而只断言 move 的校验会一路放行。
          #   下限卡「有没有数据」，上限卡「筛条件是不是失效了」（异常膨胀会让
          #   单页 gz 逼近 1 MB，页面加载明显变慢）。
          #   ⚠️ 每网的量级不同，下限必须逐网给：广电（公开公示页）只有两百来条，
          #      照抄 500 会让 CI 天天红，而一旦为此把全局下限调到 100，
          #      移动/联通那两网的真骤降就再也拦不住了。
          #
          # ★ 电信也卡区间 —— 正常情况下它由 ci_grab.sh 在云端直采（基线=今天）；
          #   采集失败时退回仓库快照（基线=那份快照的日期）。两种情形页面都有数据，
          #   条数一样有正常量级（800+）。不卡的话，「快照被误删 / 被清空」会静默
          #   退化成页面占位说明，而看的人只会觉得「今天少了一网」，联想不到是快照没了。
          #   ⚠️ 基线日期**允许早于今天**（走兜底时就是旧的），所以只校验格式；
          #      陈旧程度单独告警、**不阻断** —— 电信采不到是机会性问题，
          #      不该连带把另外三网的页面部署一起卡死。
          LIVE = {'move': (500, 20000), 'unicom': (500, 20000),
                  'cbn': (100, 20000), 'telecom': (100, 20000)}
          STALE_DAYS = 14
          today = time.strftime('%Y-%m-%d')
          for code, (lo, hi) in LIVE.items():
              n = nets.get(code) or {}
              rows, base, src = n.get('rows') or [], n.get('base') or '', (n.get('src') or '').strip()
              assert lo <= len(rows) <= hi, '%s 条数异常: %d（期望 %d~%d）' % (code, len(rows), lo, hi)
              assert re.fullmatch(r'\d{4}-\d{2}-\d{2}', base), '%s 数据基线缺失/格式不对: %r' % (code, base)
              assert src, '%s 缺少来源说明 src（页面顶部那行会显示成 —）' % code
              # 行的字段形态也要看一眼：少一个 o/e/f，页面排序与时间筛选会**静默**失效
              # （NaN 参与比较恒为 false ⇒ 筛选返回全部），而上面每一步都不会报错。
              #   少 cat/chx ⇒ 大类与渠道筛选恒空或恒落「其他」，页面同样不报错。
              miss = [k for k in ('n', 'o', 'e', 'f', 'ty', 'cat', 'chx') if k not in rows[0]]
              assert not miss, '%s 的行缺少字段 %s（页面排序/时间筛选会静默失效）' % (code, miss)

              # ★ 地域标（sc）与下架标（st）也要卡 —— 这两个漏了同样是**静默**故障：
              #   少 sc ⇒ 地域筛选恒为空（筛出 0 条，看着像「本网没有河北资费」）；
              #   少 st ⇒ 「已下架」页签恒为空，且页面不会报任何错。
              scs = {r.get('sc') for r in rows}
              assert scs and scs <= {'hb', 'cn'}, '%s 的地域标 sc 异常: %s' % (code, scs)
              # ★ 地市归属（cty）：取值只能是页面下拉里有的那些中文名。
              #   出现下拉里没有的值 ⇒ 那条资费永远筛不出来（下拉里没有这一项），
              #   而数据里明明有、页面上没有任何提示 —— 与 sc 同类静默故障。
              #   ⚠️ 这里早先卡的是「4 位地市码」，2026-09-24 起 cty 已统一成中文名
              #      （联通的码是 3 位，两套码表并存时根本没法判该查哪张）。
              bad_cty = {c for r in rows for c in (r.get('cty') or [])} - CITY_ALL
              assert not bad_cty, '%s 出现下拉里没有的地市名: %s' % (code, bad_cty)
              n_cty = sum(1 for r in rows if r.get('cty'))
              if code == 'cbn':
                  # 广电是**唯一**上游真没有地市粒度的网（区域码表只有「全国 / 河北省」，
                  # 传地市码回 BASE102）。把「它不该有地市」钉进 CI：哪天冒出来，
                  # 说明上游变了，得人工看 —— 而不是让页面悄悄多出一层。
                  assert n_cty == 0, ('广电上游本无地市级数据，却出现 %d 条带地市 —— '
                                      '上游语义已变，需人工确认' % n_cty)
                  # 同理：没有地市维度就不该有「不限地市」标（它的含义是「不限地市」，
                  # 隐含「本网有地市这一层」）。冒出来说明 CITY_NETS 该不该加它需要人工定。
                  n_pw0 = sum(1 for r in rows if r.get('pw'))
                  assert n_pw0 == 0, ('广电没有地市维度，却写了 %d 条 pw=1 —— '
                                      'CITY_NETS 是否该加上它？需人工确认' % n_pw0)
              if code == 'unicom':
                  # 🔴🔴 联通**必须**有地市（2026-09-24 纠错）。此前这里断言的是 n_cty == 0，
                  #   依据是「上游没有地市级数据」—— 那是**抽样假阴性**：当时只采了邢台一城，
                  #   20 个栏目组合里恰好抽到两个全省一致的，于是结论反了。
                  #   全量实测：12 城并集后 139/8042 条只出现在部分城市。
                  #   0 条 ⇒ 采集侧的城市归属丢了（或又退回单城采集），必须拦。
                  assert n_cty > 0, ('联通一条地市归属都没有 —— 采集侧 12 城并集的 '
                                     '城市归属丢了？或又退回单城采集（那是假阴性老路）')
                  assert n_cty < len(rows) * 0.5, \
                      '联通带地市的条目过多（%d/%d）—— 全省通用的那批没被认出来？' % (n_cty, len(rows))
              if code == 'telecom':
                  # 电信有条目级地市码，但覆盖率不高（实测 265 次命中 / 884 条）。
                  # 断言「至少存在」而不是「有多少」：完全是 0 说明 _areaCodes 丢了。
                  assert n_cty > 0, '电信地市码全丢（_areaCodes 没进行数据？）'
              # ★★ pw（不限地市，2026-09-24 新口径）/ cty 的**互斥与完备**：
              #   页面按地市筛的逻辑就是「pw 或 cty 含该市」，所以两者必须把**在售**条目
              #   恰好覆盖一遍。「已下架」条目刻意两者皆无 —— 那批的归属来自各城
              #   「停售目录」的差异，同一条停售资费被哪些城市收录是任意的，不可信。
              #   缺一个 ⇒ 那条资费在任何具体地市档下都看不到（页面不报错，只是少一批）；
              #   多一个 ⇒ 两档各算它一次，选项上的条数与真实结果对不上。
              #   判据网别不在 CI 里另写一份 —— audit_data.py 已按 tariff_monitor.CITY_NETS
              #   判过；这里只兜「送进页面的数据本身是否自洽」。
              n_pw = sum(1 for r in rows if r.get('pw'))
              _live = [r for r in rows if not r.get('st')]
              _both = [r for r in _live if r.get('cty') and r.get('pw')]
              _neither = [r for r in _live if not r.get('cty') and not r.get('pw')]
              assert not _both, '%s 有 %d 条同时写了 cty 与 pw（归属自相矛盾）' % (code, len(_both))
              if code != 'cbn':
                  assert not _neither, ('%s 有 %d 条在售条目既无 cty 也无 pw —— 按地市筛时'
                                        '整批看不到（口径必须互斥且完备）' % (code, len(_neither)))
                  assert n_cty > 0 and n_pw > 0, \
                      '%s 地市维度残缺（cty %d / pw %d）' % (code, n_cty, n_pw)
              stop_n = sum(1 for r in rows if r.get('st'))
              if code in ('unicom', 'cbn'):
                  assert stop_n > 0, ('%s 本轮一条下架资费都没有 —— include_stopped 掉了？'
                                      '（联通应有 3000+、广电 100+）' % code)
              if code == 'move':
                  # 移动的 isPublic=0 只列分类不给明细，**结构上拿不到**下架数据。
                  # 这里断言为 0 是把这条限制**钉进 CI**：哪天它变成非 0，
                  # 说明上游语义变了或我们的判据错了，都得人工看一眼再说。
                  assert stop_n == 0, ('移动公开接口取不到下架数据，却出现了 %d 条 —— '
                                       '判据或上游语义已变，需人工确认' % stop_n)

              # ★ 归属（ow = 个人 / 政企）：来自上游条目级 type1 字段的归一
              #   （1→个人、2→政企），由 rows_of() 写进行数据。
              #   🔴 这条断言是 2026-09-23 一次纠错的固化：此前判政企用的是
              #      applicablePeople（「目标客户」）文本，只捞到 68 条，
              #      并据此得出了「政企四网公开渠道都取不到」的**错误结论**。
              #      真相是移动的 type1=2 一直就在自己的快照里（河北 24 条政企）。
              #      所以两侧都要卡死，防止再退回「靠文本猜」那套：
              #        · 移动：政企必须存在（否则上游语义变了或 rows_of 漏写 ow）
              #        · 其余三网：必须**一条 ow 都没有**（上游条目里连 type1 键都不存在）
              ows = {r.get('ow') for r in rows if r.get('ow')}
              assert ows <= {'个人', '政企'}, '%s 的归属 ow 取值异常: %s' % (code, ows)
              if code == 'move':
                  n_gq = sum(1 for r in rows if r.get('ow') == '政企')
                  n_gr = sum(1 for r in rows if r.get('ow') == '个人')
                  assert n_gq > 0, ('移动的政企资费(type1=2)归零 —— 上游语义变了，'
                                    '或 rows_of 忘了把 type1 写进 ow')
                  # 反向：政企占比必须仍是「少数派」（实测 24/3887 ≈ 0.6%）。
                  # 突然占到大比例 ⇒ 判据把个人条目也算成政企了。
                  assert n_gq < len(rows) * 0.2, \
                      '移动政企占比异常高（%d/%d）—— 归属判据可能把个人也算进去了' % (n_gq, len(rows))
                  assert n_gr > n_gq, '移动个人资费应远多于政企（实测 %d : %d）' % (n_gr, n_gq)
              else:
                  assert not ows, ('%s 上游没有 type1 字段，却出现归属标注 %s —— '
                                   '归属只能来自 type1，不能从「目标客户」文本猜'
                                   % (code, sorted(ows)))

              # ★ 渠道档（chx）：构建期按 ch_norm 把上游那几十种写法归一到三档。
              #   取值域必须封闭；落「其他」的比例锁在 2% 以内（实测四网 0.38%）。
              #   比例突然涨高 ⇒ 上游换了写法，关键字表该更新 —— 而这类变化
              #   在页面上只表现为「其他」多了一点，没人会天天去数，所以交给 CI 盯。
              chxs = {r.get('chx') for r in rows}
              assert chxs and chxs <= {'线上', '线下', '线上+线下', '其他'}, \
                  '%s 的渠道档 chx 取值异常: %s' % (code, chxs)
              n_chx_other = sum(1 for r in rows if r.get('chx') == '其他')
              assert n_chx_other <= max(5, len(rows) * 0.02), \
                  ('%s 渠道归一落「其他」过多（%d 条）—— ch_norm 的关键字表该更新了'
                   % (code, n_chx_other))

              # ★ 类型大类（cat）：构建期按 TYPE_CAT 归一，页面直接读。
              #   出现「其他」＝有原始分类没被映射 —— 页面上会多出一个含义不明的类。
              #   零星冒头只警告（页面照常更新，别为一条新分类掐断当天的自动更新），
              #   但占比过 1% 就说明映射整体失效，必须硬失败。
              other_cat = sum(1 for r in rows if r.get('cat') == '其他')
              if other_cat:
                  bad_ty = '、'.join(sorted({r.get('ty') or '(空)' for r in rows
                                            if r.get('cat') == '其他'}))
                  cm = '%s 有 %d 条原始分类没归到大类（%s）' % (code, other_cat, bad_ty)
                  assert other_cat <= max(2, len(rows) * 0.01), cm + ' —— 请在 TYPE_CAT 补映射'
                  print('::warning title=类型大类出现未映射项::' + cm + '；已落进「其他」')

              tag = ''
              if code == 'telecom':
                  age = (time.mktime(time.strptime(today, '%Y-%m-%d'))
                         - time.mktime(time.strptime(base, '%Y-%m-%d'))) / 86400
                  if age <= 0:
                      tag = ' · 云端直采'
                  else:
                      # 基线不是今天 ⇒ 本轮 ci_grab.sh 没采到，走的是快照兜底。
                      # 这不是错误（设计如此），但必须**显式说出来** ——
                      # 否则「电信悄悄停在旧数据」这件事没有任何人会发现。
                      tag = ' · ⚠ 快照兜底（基线早 %d 天）' % age
                      print('::notice title=电信本轮走快照兜底::基线 %s 早于今天，'
                            '说明 ci_grab.sh 没采到（看它那步的 ::warning::）' % base)
                  if age > STALE_DAYS:
                      print('::warning title=电信数据陈旧::基线 %s，已 %d 天未更新（阈值 %d 天）。'
                            '云端连续采集失败，需检查 ci_grab.sh 或改回本机采集后提交快照'
                            % (base, age, STALE_DAYS))
              print('  %-7s %5d 条 · 基线 %s · %s%s' % (code, len(rows), base, src[:32], tag))
          # ── history.json：页面「变化历史」时间线的数据源 ──
          # ① 它必须**入库**（见「提交数据与归档」那步）。2026-09-23 之前一直被漏掉，
          #    结果每轮新追加的节点随 runner 一起销毁 —— 页面用的是当轮内存里的版本
          #    （看着有今天），仓库里那份却没有，下次构建又退回去。
          # ② 同一天同网只允许有一条：一天跑两轮很正常（定时 + 手动 dispatch / 重试），
          #    若按抓取时刻各记一条，时间线上同一天会显示两套互相矛盾的数字，
          #    而页面顶部「本次巡检」只显示最新那套 —— 用户看到的就是「对不上」。
          h = json.load(open('cloud/tariff/history.json', encoding='utf-8'))
          it = h.get('items') or []
          keys = [(x.get('d'), x.get('code')) for x in it]
          dups = sorted({k for k in keys if keys.count(k) > 1})
          assert not dups, ('history.json 里同一天同网有多条（时间线会显示两套矛盾数字）：%s'
                            % dups)
          hist_today = [x for x in it if x.get('d') == today]
          assert hist_today, ('history.json 里没有 %s 的记录 —— 本轮没写入，'
                              '或文件没被提交（后者会让时间线永远长不起来）' % today)
          for x in hist_today:
              print('  历史 %s %-8s 条数 %-5s 新增 %-3s 下线 %-3s 变更 %-3s'
                    % (x.get('d'), x.get('code'), x.get('n'), x.get('a'), x.get('r'), x.get('c')))
          print('页面校验 OK：四网齐备（电信为直采或快照兜底，上方逐网标注）')
          "

      # ── 部署到 GitHub Pages ────────────────────────────────────────────
      # 部署的是 CI 现场生成的 docs/index.html（未压缩那份，已 gitignore）。
      # 页面数据全部内联在 HTML 里（const NETS=...），所以 artifact 里只需这一个文件，
      # 不需要额外托管数据文件 —— 也就不会出现「页面更新了但数据接口还是旧的」这类错配。
      - name: 准备 Pages 产物
        run: |
          set -e
          test -s cloud/tariff/docs/index.html
          touch cloud/tariff/docs/.nojekyll          # 禁止 Jekyll 处理，避免下划线文件被吞
          ls -la cloud/tariff/docs/
          echo "页面大小：$(du -h cloud/tariff/docs/index.html | cut -f1)"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: cloud/tariff/docs

      - name: 产物完整性闸门（缺产物就**不许提交**）
        run: |
          set -e
          # 🔴 这一步是 2026-09-26 新加的，防的是这一类事故：
          #    旧写法 `git add -A cloud/tariff/snapshots ... page` 里 `-A` 会**连删除一起暂存**。
          #    一旦上一环出错（快照没落盘 / 页面归档没写成），提交下去的就不是
          #    「本轮数据」而是「snapshots 目录少了一批文件」——
          #   而 git 提交成功、Actions 全绿，没有任何一处报错。
          #    参考的同类项目原话：`rm -rf` 之后 `cp ... || true` 失败，
          #    会把「data 目录消失」当正常变更提交，直接删掉线上数据。
          #    ⇒ 提交前先把「该在的东西在不在」断言一遍。
          set -e
          n_snap=$(ls -1 cloud/tariff/snapshots/*.json.gz 2>/dev/null | wc -l)
          test "$n_snap" -ge 4 || { echo "::error::快照只剩 $n_snap 份（四网至少各 1 份）——拒绝提交，先查抓取"; exit 1; }
          test -s cloud/tariff/page/index.html.gz || { echo "::error::页面归档 page/index.html.gz 缺失或为空——拒绝提交"; exit 1; }
          test -s cloud/tariff/history.json || { echo "::error::history.json 缺失或为空——拒绝提交"; exit 1; }
          test -s cloud/tariff/docs/index.html || { echo "::error::docs/index.html 缺失——拒绝提交"; exit 1; }
          # 每网都要有当天（或最近）的影子，防止「某网静默消失」
          for p in hebei_tariff_ unicom_tariff_ ct_tariff_ cbn_tariff_; do
            ls -1 cloud/tariff/snapshots/${p}*.json.gz >/dev/null 2>&1 \
              || { echo "::error::$p 一份快照都没有"; exit 1; }
          done
          # 原子写的残片绝不能被提交（.gitignore 已挡，这里再断言一次：
          # 万一哪天 gitignore 被改动，坏基线就会跟着入库）
          left=$(ls -1 cloud/tariff/**/*.tmp cloud/tariff/*.tmp cloud/tariff/**/*.new 2>/dev/null | wc -l)
          if [ "$left" != "0" ]; then
            echo "::warning::发现 $left 个原子写残片（*.tmp/*.new），清理后再提交"
            ls -1 cloud/tariff/**/*.tmp cloud/tariff/*.tmp cloud/tariff/**/*.new 2>/dev/null | head
            rm -f cloud/tariff/**/*.tmp cloud/tariff/*.tmp cloud/tariff/**/*.new
          fi
          echo "快照 $n_snap 份 · 归档 $(du -h cloud/tariff/page/index.html.gz | cut -f1) · 闸门通过"

      - name: 提交数据与归档
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cloud/tariff/snapshots cloud/tariff/changes cloud/tariff/page
          if [ -f cloud/tariff/state.json ]; then git add cloud/tariff/state.json; fi
          # 🔴 history.json（「变化历史」时间线的数据源）也必须提交。
          #    2026-09-23 发现：它一直被漏掉，于是每轮新追加的节点随 runner 一起销毁，
          #    时间线永远只有仓库里那一份、长不起来。页面用的却是当轮内存里的版本，
          #    所以「页面看着有今天、仓库里没有」，下次构建又退回去。
          if [ -f cloud/tariff/history.json ]; then git add cloud/tariff/history.json; fi
          # ★ 降级计数（连续 N 轮偏低才接受新数据）必须**跨轮次持久化** ——
          #   不提交它，「连续 3 轮」就退化成「每轮都算第一轮」，护栏等于没装。
          if [ -f cloud/tariff/degrade_state.json ]; then git add cloud/tariff/degrade_state.json; fi
          # ★ 推送去重指纹：CI 每轮都是全新 checkout，只在内存里去重等于没去重，
          #   而 workflow_dispatch 反复重跑是常态（同一次变化会被推好几条）。
          if [ -f cloud/tariff/.notify_state.json ]; then git add cloud/tariff/.notify_state.json; fi
          # 提交前再自查一遍：`-A` 会把删除也暂存，这里把「有没有被删掉的产物」摊开
          git diff --staged --name-status --diff-filter=D -- cloud/tariff/snapshots cloud/tariff/page \
            | head || true
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "data(tariff): 资费巡检 $(date +%F)"
            # 🔴 裸 `git push` 只在「远端没动过」时才成功。一旦本机手动推过、
            #    或两轮 CI 重叠，就必然被拒（`! [rejected] ... (fetch first)`），
            #    本轮现采的数据随 runner 一起销毁 —— 2026-09-24 实测踩到一次。
            #    被拒就 fetch + rebase 再推，重试 3 次。
            #    冲突一律取**本轮**（数据是刚采的、比远端新）：
            #    ⚠️ rebase 里 `ours`=远端、`theirs`=本地，与 merge 相反，别搞反。
            pushed=""
            for i in 1 2 3; do
              if git push; then pushed=1; echo "push 成功（第 $i 次尝试）"; break; fi
              echo "::warning::push 被拒（远端有新提交），rebase 后重试（第 $i 次）"
              git pull --rebase -X theirs
            done
            test -n "$pushed"     # 三次仍失败则让本步失败（在 Actions 上看得见）
          fi

  # 部署单独一个 job：Pages 的 environment 需要独立声明，
  # 也让「抓取失败」和「部署失败」在 Actions 页面上一眼可分。
  deploy:
    needs: tariff
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
